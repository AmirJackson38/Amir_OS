// FX state
let fxState = { type: "none", timer: 0, color: new THREE.Color(0x5fd0ff) };

function triggerFX(type, color = 0x5fd0ff, count = 40) {
    fxState.type = type;
    fxState.timer = 0;
    fxState.color.setHex(color);
    
    const positions = fxParticleGeo.attributes.position.array;
    const velocities = fxParticleVelocities;
    const lifes = fxParticleLifes;
    const colors = fxParticleGeo.attributes.color.array;
    const sizes = fxParticleGeo.attributes.size.array;
    
    for (let i = 0; i < count; i++) {
        const idx = i * 3;
        // Spawn at entity center
        positions[idx] = 0;
        positions[idx + 1] = 0;
        positions[idx + 2] = 0;
        
        // Random velocity based on FX type
        let speed, spread;
        if (type === "burst") {
            speed = 0.8 + Math.random() * 1.2;
            spread = 1.0;
        } else if (type === "strobe_red" || type === "strobe_orange") {
            speed = 0.3 + Math.random() * 0.5;
            spread = 0.5;
        } else {
            speed = 0.4 + Math.random() * 0.6;
            spread = 0.8;
        }
        
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        velocities[idx] = Math.sin(phi) * Math.cos(theta) * speed;
        velocities[idx + 1] = Math.cos(phi) * speed;
        velocities[idx + 2] = Math.sin(phi) * Math.sin(theta) * speed;
        
        lifes[i] = 1.5 + Math.random() * 1.0; // life in seconds
        
        colors[idx] = fxState.color.r;
        colors[idx + 1] = fxState.color.g;
        colors[idx + 2] = fxState.color.b;
        
        sizes[i] = 0.05 + Math.random() * 0.08;
    }
    fxParticleGeo.attributes.position.needsUpdate = true;
    fxParticleGeo.attributes.color.needsUpdate = true;
    fxParticleGeo.attributes.size.needsUpdate = true;
}

// Emotion Mixer - blends between states smoothly
class EmotionMixer {
    constructor() {
        this.current = { ...BEHAVIOR_PRESETS.idle };
        this.target = { ...BEHAVIOR_PRESETS.idle };
        this.lerpSpeed = 0.08;
        this.gesturePhase = 0;
        // Use THREE.Color for proper lerping
        this.current.color = new THREE.Color(BEHAVIOR_PRESETS.idle.color);
        this.target.color = new THREE.Color(BEHAVIOR_PRESETS.idle.color);
    }

    setTarget(presetName, intensity = 1.0) {
        const preset = BEHAVIOR_PRESETS[presetName];
        if (!preset) return;
        this.target = { ...preset };
        // Apply intensity modifier
        this.target.deformation *= intensity;
        this.target.energy *= intensity;
        this.target.pulseSpeed *= (0.5 + intensity * 0.5);
        this.target.orbitSpeed *= (0.5 + intensity * 0.5);
        // Convert color to THREE.Color
        this.target.color = new THREE.Color(preset.color);
    }

    blend(presetA, presetB, factor) {
        const result = {};
        const keys = ['pulseSpeed', 'deformation', 'energy', 'asymmetry', 'leanZ', 'orbitSpeed'];
        for (const key of keys) {
            const a = presetA[key];
            const b = presetB[key];
            result[key] = a + (b - a) * factor;
        }
        // Color lerp
        result.color = new THREE.Color(presetA.color).lerp(new THREE.Color(presetB.color), factor);
        result.gesture = factor > 0.5 ? presetB.gesture : presetA.gesture;
        return result;
    }

    update(dt) {
        // Smooth lerp towards target
        const keys = ['pulseSpeed', 'deformation', 'energy', 'asymmetry', 'leanZ', 'orbitSpeed'];
        for (const key of keys) {
            this.current[key] += (this.target[key] - this.current[key]) * this.lerpSpeed * dt * 60;
        }
        // Color lerp
        this.current.color.lerp(this.target.color, this.lerpSpeed * dt * 60);
        
        this.gesturePhase += dt * this.current.orbitSpeed * 0.5;
    }

    getCurrent() {
        return this.current;
    }

    getMixedState() {
        // Return with color as THREE.Color for proper lerping in animation loop
        return {
            color: this.current.color.clone(),
            pulseSpeed: this.current.pulseSpeed,
            deformation: this.current.deformation,
            asymmetry: this.current.asymmetry,
            leanZ: this.current.leanZ,
            orbitSpeed: this.current.orbitSpeed,
            energy: this.current.energy,
            gesture: this.current.gesture
        };
    }

    getGesture() {
        return this.current.gesture;
    }
    
    setIntensity(intensity) {
        // Adjust target deformation and energy based on intensity
        const basePreset = Object.values(BEHAVIOR_PRESETS).find(p => p.color === this.target.color.getHex()) || BEHAVIOR_PRESETS.idle;
        this.target.deformation = basePreset.deformation * intensity;
        this.target.energy = basePreset.energy * intensity;
    }
}

// Global TARS Controller API

window.TARS = {
    setMode(mode) {
        currentState.mode = mode;
        document.getElementById("current-mode").innerText = mode.toUpperCase();
    },
    trigger(presetName) {
        if (!BEHAVIOR_PRESETS[presetName]) return;
        currentState.emotion = presetName;
        document.getElementById("current-emotion").innerText = presetName.toUpperCase();
        console.log(`[TARS] Trigger: ${presetName}`);
        
        // Fire FX from preset
        const preset = BEHAVIOR_PRESETS[presetName];
        if (preset.fx && preset.fx !== "none") {
            currentState.fx = preset.fx;
            currentState.fxTimer = 0;
        }
        
        // Use EmotionMixer for smooth transitions
        emotionMixer.setTarget(presetName, currentState.intensity);
    },
    setEmotion(name, intensity = 0.5) {
        this.trigger(name);
        currentState.intensity = intensity;
    },
    setSpeaking(bool) {
        currentState.speaking = bool;
        console.log(`[TARS] Speaking: ${bool}`);
        if (bool) {
            this.trigger("speak");
            currentState.lastSpeechTime = performance.now() / 1000;
        }
    },
    setListening(bool) {
        currentState.listening = bool;
        console.log(`[TARS] Listening: ${bool}`);
        if (bool) this.trigger("listen");
    },
    setIntensity(v) {
        currentState.intensity = v;
        console.log(`[TARS] Intensity: ${v}`);
        // Update mixer intensity
        emotionMixer.setIntensity(v);
    },
    setUrgency(v) {
        currentState.urgency = v;
        currentState.orbitSpeed = 0.8 + v * 3.0;
        currentState.pulseSpeed = 1.5 + v * 4.0;
        console.log(`[TARS] Urgency: ${v}`);
    },
    // Speech reactivity hooks for LLM/TTS integration
    setSpeechAmplitude(amp) {
        currentState.speechAmplitude = Math.max(0, Math.min(1, amp));
    },
    setSpeechPitch(pitch) {
        currentState.speechPitch = Math.max(0.5, Math.min(2.0, pitch));
    },
    onSpeechStart() {
        console.log(`[TARS] Speech START`);
        this.setSpeaking(true);
    },
    onSpeechEnd() {
        console.log(`[TARS] Speech END`);
        this.setSpeaking(false);
        // Return to idle after brief delay
        setTimeout(() => {
            if (!currentState.speaking) this.trigger("idle");
        }, 500);
    },
    lookAt(targetKey, reason = "autonomous_move", overrideActivity = null) {
        currentState.gazeTarget = targetKey;
        console.log(`[TARS] Look at: ${targetKey} (reason: ${reason})`);
        if (TARGET_POSITIONS[targetKey]) {
            currentState.targetPos.copy(TARGET_POSITIONS[targetKey]);
            const targetVec = TARGET_POSITIONS[targetKey];
            const dx = targetVec.x - tarsEntityGroup.position.x;
            const dz = targetVec.z - tarsEntityGroup.position.z;
            const angle = Math.atan2(dx, dz);
            tarsEntityGroup.rotation.y = angle;
            
            triggerLocationBehavior(targetKey);
            
            const activity = overrideActivity || (() => {
                const activityMap = {
                    "window_left": "weather_observation",
                    "window_right": "weather_observation", 
                    "desk": "computer_work",
                    "rack-a": "server_check",
                    "user": "user_interaction"
                };
                return activityMap[targetKey] || "idle";
            })();
            setTARSActivity(activity, targetKey, reason);
        }
    },
    moveTo(pos) {
        currentState.targetPos.copy(pos);
        console.log(`[TARS] Move to:`, pos);
    },
    // Accepts behavioral intent JSON from LLM: { emotion, intensity, energy, urgency, gesture, movement, gaze, target }
    setBehavior(obj) {
        console.log(`[TARS] setBehavior:`, obj);
        if (obj.emotion) this.setEmotion(obj.emotion, obj.intensity || 0.5);
        if (obj.energy !== undefined) {
            currentState.energy = obj.energy;
            worldState.tars.energy = obj.energy;
        }
        if (obj.urgency !== undefined) this.setUrgency(obj.urgency);
        if (obj.gaze) this.lookAt(obj.gaze, "llm_intent");
        if (obj.movement && obj.target && TARGET_POSITIONS[obj.target]) {
            this.moveTo(TARGET_POSITIONS[obj.target]);
        }
        if (obj.gesture) {
            this.triggerGesture(obj.gesture);
        }
        // LLM intent takes control, start auto-release timer
        worldState.tars.controlMode = "llm";
        clearTimeout(window._llmReleaseTimer);
        window._llmReleaseTimer = setTimeout(() => {
            if (worldState.tars.controlMode === "llm") {
                worldState.tars.controlMode = "autonomous";
                console.log(`[TARS Control] Auto-release to autonomous (60s timeout)`);
            }
        }, 60000);
    },
    releaseControl() {
        worldState.tars.controlMode = "autonomous";
        clearTimeout(window._llmReleaseTimer);
        console.log(`[TARS Control] Explicit release to autonomous`);
    },
    triggerGesture(gesture) {
        console.log(`[TARS] Gesture: ${gesture}`);
        const gestures = {
            "nod": () => { currentState.leanZ = -0.2; setTimeout(() => currentState.leanZ = 0, 300); },
            "shake": () => { currentState.asymmetry = 0.4; setTimeout(() => currentState.asymmetry = 0, 400); },
            "pulse": () => { currentState.pulseSpeed *= 3; setTimeout(() => currentState.pulseSpeed /= 3, 200); },
            "expand": () => { currentState.scale = 1.3; setTimeout(() => currentState.scale = 1.0, 500); },
            "spin": () => { currentState.orbitSpeed *= 4; setTimeout(() => currentState.orbitSpeed /= 4, 600); }
        };
        if (gestures[gesture]) gestures[gesture]();
    }
};

function updateNeeds(dt) {
    // Decay all needs
    for (const [need, rate] of Object.entries(NEED_DECAY_RATES)) {
        worldState.tars.needs[need] = Math.max(0, worldState.tars.needs[need] - rate * dt * 60);
    }
    
    // Restore needs based on current location
    const loc = worldState.tars.location;
    if (NEED_RESTORATION[loc]) {
        for (const [need, amount] of Object.entries(NEED_RESTORATION[loc])) {
            worldState.tars.needs[need] = Math.min(1, worldState.tars.needs[need] + amount * dt * 60);
        }
    }
    
    // Activity effects — continuous need changes while engaged
    applyActivityEffects(dt);
    
    // Time-of-day modifiers
    const hour = new Date().getHours();
    const isNight = hour < 6 || hour > 22;
    if (isNight) {
        worldState.tars.needs.energy = Math.max(0, worldState.tars.needs.energy - 0.00005 * dt * 60);
        worldState.tars.needs.comfort = Math.max(0, worldState.tars.needs.comfort - 0.00003 * dt * 60);
    }
    
    // Weather modifiers
    const weather = worldState.environment.weather.condition;
    if (weather === "thunderstorm" || weather === "heavy_rain") {
        worldState.tars.needs.curiosity = Math.min(1, worldState.tars.needs.curiosity + 0.0001 * dt * 60);
        worldState.tars.needs.comfort = Math.max(0, worldState.tars.needs.comfort - 0.0001 * dt * 60);
    }

    accumulateFatigue(dt);
}

function accumulateFatigue(dt) {
    const activity = worldState.tars.activity;
    if (!activity || activity === "idle") {
        for (const key of Object.keys(worldState.tars.activityFatigue)) {
            worldState.tars.activityFatigue[key] = Math.max(0,
                worldState.tars.activityFatigue[key] - ACTIVITY_FATIGUE.RECOVERY_RATE * dt * 60);
        }
        return;
    }
    const current = worldState.tars.activityFatigue[activity] || 0;
    worldState.tars.activityFatigue[activity] = Math.min(1, current + ACTIVITY_FATIGUE.ACCRUAL_RATE * dt * 60);
}

function applyActivityEffects(dt) {
    const activity = worldState.tars.activity;
    const effects = ACTIVITY_EFFECTS[activity];
    if (!effects) return;

    const needs = worldState.tars.needs;
    const env = worldState.environment;
    const hour = new Date().getHours();
    const isNight = hour < 6 || hour > 22;
    const weather = env.weather.condition;

    // Base continuous effects
    for (const [need, rate] of Object.entries(effects.continuous)) {
        needs[need] = Math.max(0, Math.min(1, needs[need] + rate * dt * 60));
    }

    // Environmental modifiers
    if (effects.modifiers) {
        let mods = null;
        if (effects.modifiers.storm && (weather === "thunderstorm" || weather === "heavy_rain")) {
            mods = effects.modifiers.storm;
        } else if (effects.modifiers.rain && (weather === "rain" || weather === "drizzle")) {
            mods = effects.modifiers.rain;
        }
        if (effects.modifiers.night && isNight) {
            mods = { ...mods, ...effects.modifiers.night };
        }
        if (mods) {
            for (const [need, rate] of Object.entries(mods)) {
                needs[need] = Math.max(0, Math.min(1, needs[need] + rate * dt * 60));
            }
        }
    }
}

// Map scoring location keys to preference keys (desk → workstation, user → default)
const LOCATION_PREF_KEYS = {
    desk: "workstation",

function scoreLocation(location) {
    let score = 0;
    const needs = worldState.tars.needs;
    const prefs = worldState.tars.preferences;
    const currentLoc = worldState.tars.location;
    const now = Date.now();
    
    // Need satisfaction potential — weighted by deficit magnitude
    const restoration = NEED_RESTORATION[location] || {};
    for (const [need, amount] of Object.entries(restoration)) {
        const deficit = 1 - needs[need];
        score += deficit * amount;
    }
    
    // Hunger pressure — high hunger draws toward desk (future food proxy)
    if (needs.hunger > 0.5 && location === "desk") {
        score += (needs.hunger - 0.5) * 40;
    }
    if (needs.hunger > 0.8) {
        score += 20; // Urgency bonus when starving — any location change is better
    }
    
    // Location preference — use correct key mapping
    const prefKey = LOCATION_PREF_KEYS[location] || location;
    score += (prefs.locations[prefKey] || 0.5) * 10;
    
    // Activity preference for likely activity at location
    const activityMap = {
        desk: "computer_work",
        "rack-a": "server_check",
        "window_right": "weather_observation",
        "window_left": "weather_observation",
        user: "user_interaction"
    };
    const activity = activityMap[location];
    if (activity) score += (prefs.activities[activity] || 0.5) * 10;
    
    // Weather affinity — need-weighted: only interesting when curiosity is high
    if (location.includes("window")) {
        const weather = worldState.environment.weather.condition;
        const curiosityDeficit = 1 - needs.curiosity;
        score += curiosityDeficit * (prefs.conditions[weather] || 0.5) * 15;
    }
    
    // Routine bonus
    const hour = new Date().getHours();
    const currentWeather = worldState.environment.weather.condition;
    if (hour >= 6 && hour < 10 && location === "rack-a") score += prefs.routines.morning_check * 20;
    if (hour >= 18 && hour < 22 && location === "desk") score += prefs.routines.evening_wind_down * 15;
    if (currentWeather === "thunderstorm" && location.includes("window")) score += prefs.routines.storm_watch * 25;
    
    // Recency penalty — avoid returning to a location soon after leaving
    const lastLeft = worldState.tars.locationRecency[location];
    if (lastLeft) {
        const secondsSinceLeft = (now - lastLeft) / 1000;
        if (secondsSinceLeft < 45) {
            score -= (45 - secondsSinceLeft) * 1.0;
        }
    }
    
    // Distance penalty (prefer closer locations but not too strong)
    const currentPos = tarsEntityGroup.position;
    const targetPos = TARGET_POSITIONS[location];
    if (targetPos) {
        const dist = currentPos.distanceTo(targetPos);
        score -= dist * 1;
    }
    
    // Add some randomness for organic behavior
    score += (Math.random() - 0.5) * 6;
    
    return score;
}

function selectBestActivity() {
    const needs = worldState.tars.needs;

    const now = Date.now();
    let bestScore = -Infinity;

    const candidates = [];

    for (const [id, reg] of Object.entries(ACTIVITY_REGISTRY)) {
        let score = 0;
        let needScore = 0;
        let fatiguePenalty = 0;
        let recencyPenalty = 0;
        let weatherBonus = 0;
        let idleBaseline = 0;

        // Need satisfaction potential — how well does this activity address current deficits?
        for (const [need, amount] of Object.entries(reg.needsSatisfied)) {
            const deficit = 1 - needs[need];
            if (deficit > 0.05) {
                const contrib = deficit * amount * SCORING_WEIGHTS.NEED_WEIGHT;
                needScore += contrib;
                score += contrib;
            }
        }

        // Preference weighting
        const prefScore = (prefs.activities[id] || 0.5) * SCORING_WEIGHTS.PREFERENCE_WEIGHT;
        score += prefScore;

        // Fatigue penalty — repeated same activity gets diminishing returns
        const fatigue = worldState.tars.activityFatigue[id] || 0;
        fatiguePenalty = fatigue * SCORING_WEIGHTS.FATIGUE_WEIGHT;
        score -= fatiguePenalty;

        // Curiosity exploration term — encourages new experiences when curiosity is high
        const curiosityDeficit = 1 - needs.curiosity;
        const isMultiLocation = reg.location && reg.location.length > 1;
        const explorationBonus = isMultiLocation ? EXPLORATION.MULTI_LOCATION_BONUS : 1;
        const curiosityScore = curiosityDeficit * SCORING_WEIGHTS.CURIOSITY_EXPLORE_WEIGHT * explorationBonus;
        score += curiosityScore;

        // Environment bonus — weather events make observation more compelling
        const weather = worldState.environment.weather.condition;
        if (id === "weather_observation" && (weather === "thunderstorm" || weather === "heavy_rain")) {
            weatherBonus = EXPLORATION.ENVIRONMENT_BONUS;
            score += weatherBonus;
        }

        // Recency penalty — avoid repeating the same activity too soon
        const lastDone = worldState.tars.activityRecency[id];
        if (lastDone) {
            const secondsSince = (now - lastDone) / 1000;
            if (secondsSince < SCORING_WEIGHTS.RECENCY_WINDOW) {
                recencyPenalty = (SCORING_WEIGHTS.RECENCY_WINDOW - secondsSince) * SCORING_WEIGHTS.RECENCY_PENALTY_RATE;
                score -= recencyPenalty;
            }
        }

        // Idle gets a small baseline to prevent aimless switching when nothing urgent
        if (id === "idle") {
            idleBaseline = SCORING_WEIGHTS.IDLE_BASELINE;
            score += idleBaseline;
        }

        candidates.push({
            id,
            score,
            components: {
                need: +needScore.toFixed(4),
                preference: +prefScore.toFixed(4),
                fatigue: -(+fatiguePenalty.toFixed(4)),
                curiosity: +curiosityScore.toFixed(4),
                recency: -(+recencyPenalty.toFixed(4)),
                weather: +weatherBonus.toFixed(4),
                idle: +idleBaseline.toFixed(4)
            }
        });
        if (score > bestScore) {
            bestScore = score;
            bestActivity = id;
        }
    }

    // Sort descending for runner-up info
    candidates.sort((a, b) => b.score - a.score);
    const topAlternatives = candidates.slice(0, 3).map(c => ({ id: c.id, score: +c.score.toFixed(2) }));
    const winnerComponents = candidates.find(c => c.id === bestActivity)?.components || null;

    if (AUTONOMY_TELEMETRY_DEBUG) {
        console.log(`[TARS Autonomy] Activity scores:`, candidates.map(c => `${c.id}:${c.score.toFixed(1)}`).join(" | "));
    }
    return { activity: bestActivity, scores: candidates, winnerComponents, topAlternatives };
}

// Phase 7.2: Select best location for a given activity using ACTIVITY_REGISTRY metadata
function selectBestLocation(activity) {
    const reg = ACTIVITY_REGISTRY[activity];
    if (!reg || !reg.location || reg.location.length === 0) {
        // Activity has no specific location (e.g., idle) — score all locations
        const all = LOCATIONS.map(loc => ({ location: loc, score: scoreLocation(loc) }));
        all.sort((a, b) => b.score - a.score);
        return all[0].location;
    }
    // Score only compatible locations
    let bestLoc = reg.location[0];
    let bestScore = -Infinity;
    for (const loc of reg.location) {
        const s = scoreLocation(loc);
        if (s > bestScore) {
            bestScore = s;
            bestLoc = loc;
        }
    }
    return bestLoc;
}

// Phase 7.3: Select a wander destination based on location novelty
function selectWanderDestination() {
    const candidates = Object.keys(TARGET_POSITIONS)
        .filter(key => key !== worldState.tars.location);
    if (candidates.length === 0) return null;
    const now = Date.now();
    let bestLoc = candidates[0];
    let bestScore = -Infinity;
    for (const loc of candidates) {
        let score = 0;
        const lastLeft = worldState.tars.locationRecency[loc];
        if (lastLeft) {
            const secondsSince = (now - lastLeft) / 1000;
            score += Math.min(secondsSince, 300);
        } else {
            score += 300;
        }
        const activityMap = {
            "window_left": "weather_observation",
            "window_right": "weather_observation",
            "desk": "computer_work",
            "rack-a": "server_check",
            "user": "user_interaction"
        };
        const act = activityMap[loc];
        if (act) {
            const lastAct = worldState.tars.activityRecency[act];
            if (lastAct) {
                const secondsSinceAct = (now - lastAct) / 1000;
                score += Math.min(secondsSinceAct, 300) * 0.5;
            } else {
                score += 150;
            }
        }
        score += Math.random() * 50;
        if (score > bestScore) {
            bestScore = score;
            bestLoc = loc;
        }
    }
    return bestLoc;
}

// Phase 7.3: Finalize current activity experience into buffer
function finalizeExperience() {
    const now = Date.now();
    const duration = now - worldState.tars.activityStartedAt;
    const entry = {
        activity: worldState.tars.activity,
        location: worldState.tars.location,
        duration,
        startedAt: worldState.tars.activityStartedAt,
        endedAt: now,
        fatigueAtEnd: worldState.tars.activityFatigue[worldState.tars.activity] || 0,
        needsSnapshot: { ...worldState.tars.needs }
    };
    worldState.tars.experienceBuffer.push(entry);
    if (worldState.tars.experienceBuffer.length > 100) {
        worldState.tars.experienceBuffer.shift();
    }
}

// Phase 7.2A: Intent mapping — deterministic activity → intent label
const ACTIVITY_INTENT_MAP = {
    computer_work: "work",
    server_check: "maintain",
    weather_observation: "observe",
    user_interaction: "socialize",
    gaming: "entertain",
    tv_watching: "rest",
    idle: "rest"
};

// Phase 7.2A: Generate deterministic decision reason from need state
function generateDecisionReason(activity, action, needs) {
    // Only consider needs that the activity actually addresses
    const reg = ACTIVITY_REGISTRY[activity];
    const satisfiedNeeds = reg ? Object.keys(reg.needsSatisfied) : [];

    const filteredDeficits = Object.entries(needs)
        .filter(([k]) => satisfiedNeeds.length === 0 || satisfiedNeeds.includes(k))
        .map(([k, v]) => ({ need: k, deficit: 1 - v }))
        .sort((a, b) => b.deficit - a.deficit);

    // Fallback to all deficits if the activity satisfies nothing specific
    const allDeficits = Object.entries(needs)
        .map(([k, v]) => ({ need: k, deficit: 1 - v }))
        .sort((a, b) => b.deficit - a.deficit);

    const deficits = filteredDeficits.length > 0 ? filteredDeficits : allDeficits;
    const topDeficit = deficits[0];
    const secondDeficit = deficits[1];

    if (action === "stay" || action === "continue" || action === "idle") {
        if (activity === "idle") return `low ${topDeficit.need} + no urgent task`;
        if (action === "continue") {
            const fatigue = (worldState.tars.activityFatigue[activity] || 0);
            if (fatigue < 0.15) return `comfortable continuing ${activity}`;
            return `continuing ${activity} despite ${(fatigue * 100).toFixed(0)}% fatigue`;
        }
        if (topDeficit.deficit < 0.15) return "no pressing need deficit";
        return `current activity addresses ${topDeficit.need} deficit`;
    }

    if (action === "complete") {
        const fatigue = (worldState.tars.activityFatigue[activity] || 0);
        return `${activity} fatigue reached ${(fatigue * 100).toFixed(0)}%, seeking change`;
    }

    if (action === "wander") {
        return `curiosity-driven exploration to ${worldState.tars.location}`;
    }

    if (action === "move" || action === "switch_activity") {
        const reasons = [];
        if (topDeficit.deficit > 0.3) reasons.push(`low ${topDeficit.need}`);
        if (secondDeficit && secondDeficit.deficit > 0.2) reasons.push(`declining ${secondDeficit.need}`);
        if (reasons.length === 0) reasons.push("exploration opportunity");
        return reasons.join(" + ");
    }

    return "autonomous decision";
}

// Phase 7.2A: Record a decision to autonomy state and history
function recordAutonomyDecision(intent, selectedActivity, selectedLocation, decisionAction, decisionReason, decisionScore, extra = {}) {
    const now = Date.now();
    const needsSnapshot = { ...worldState.tars.needs };

    const decision = {
        timestamp: now,
        intent,
        selectedActivity,
        selectedLocation,
        decisionAction,
        decisionReason,
        decisionScore,
        needs: needsSnapshot,
        ...extra
    };

    worldState.tars.autonomy = {
        ...decision,
        decidedAt: now
    };

    worldState.tars.autonomyHistory.push(decision);
    if (worldState.tars.autonomyHistory.length > 200) {
        worldState.tars.autonomyHistory.splice(0, worldState.tars.autonomyHistory.length - 200);
    }

    if (AUTONOMY_TELEMETRY_DEBUG) {
        console.log(`[TARS AUTONOMY] intent=${intent} activity=${selectedActivity} location=${selectedLocation} action=${decisionAction} reason="${decisionReason}" score=${decisionScore}`);
        console.log(`  needs:`, Object.entries(needsSnapshot).map(([k,v]) => `${k}=${(v*100).toFixed(0)}%`).join(" "));
    }
}

// Phase 7.2: Autonomous decision engine — intent → activity → location → stay/move
function makeAutonomousDecision() {
    const now = Date.now();
    if (now - worldState.tars.lastDecisionTime < 2000 + Math.random() * 2000) return;
    if (worldState.tars.controlMode === "llm") return;

    const blockingFx = ["strobe_orange", "strobe_red", "strobe", "bounce", "expansive"];
    if (currentState.fx && blockingFx.includes(currentState.fx)) return;

    const currentActivity = ACTIVITY_REGISTRY[worldState.tars.activity];
    if (currentActivity && worldState.tars.activityEndsAt && now < worldState.tars.activityEndsAt) {
        return;
    }

    // Update decision timestamp so the cooldown gates the next cycle regardless of stay/move outcome
    worldState.tars.lastDecisionTime = now;

    const needs = worldState.tars.needs;
    const { activity: chosenActivity, scores: activityScores, winnerComponents, topAlternatives } = selectBestActivity();
    const chosenLocation = selectBestLocation(chosenActivity);
    const current = worldState.tars.location;
    const intent = ACTIVITY_INTENT_MAP[chosenActivity] || "explore";

    const currentActivityCompat = ACTIVITY_REGISTRY[worldState.tars.activity];
    const currentLocCompat = currentActivityCompat && currentActivityCompat.location.includes(current);
    const sameLocation = current === chosenLocation;
    const sameActivity = worldState.tars.activity === chosenActivity;

    const bestScore = activityScores.find(s => s.id === chosenActivity)?.score || 0;

    if (sameLocation && sameActivity) {
        const fatigue = worldState.tars.activityFatigue[chosenActivity] || 0;

        if (fatigue >= ACTIVITY_FATIGUE.COMPLETE_THRESHOLD) {
            finalizeExperience();
            worldState.tars.activity = "idle";
            worldState.tars.activityEndsAt = 0;
            worldState.tars.continuationCount = 0;
            const reason = generateDecisionReason(chosenActivity, "complete", needs);
            recordAutonomyDecision(intent, chosenActivity, chosenLocation, "complete", reason, bestScore, {
                fatigueAtDecision: fatigue,
                scoreComponents: winnerComponents,
                alternatives: topAlternatives
            });
            logStateChange("activity_completed", { activity: chosenActivity, fatigue });
            return;
        }

        const currentScore = activityScores.find(s => s.id === worldState.tars.activity)?.score || 0;
        const sortedScores = [...activityScores].sort((a, b) => b.score - a.score);
        const bestAlt = sortedScores.find(s => s.id !== worldState.tars.activity) || sortedScores[0];
        const continuationBias = Math.max(0, 5 - worldState.tars.continuationCount * 1.5);

        if (currentScore + continuationBias >= bestAlt.score) {
            const reg = ACTIVITY_REGISTRY[chosenActivity];
            const durSec = reg && reg.minDuration !== undefined
                ? reg.minDuration + Math.random() * (reg.maxDuration - reg.minDuration)
                : 15;
            worldState.tars.activityEndsAt = now + durSec * 1000;
            worldState.tars.continuationCount += 1;
            const reason = generateDecisionReason(chosenActivity, "continue", needs);
            recordAutonomyDecision(intent, chosenActivity, chosenLocation, "continue", reason, bestScore, {
                continuationCount: worldState.tars.continuationCount,
                fatigueAtDecision: fatigue,
                scoreComponents: winnerComponents,
                alternatives: topAlternatives
            });
            return;
        }

        finalizeExperience();
        worldState.tars.continuationCount = 0;
    }

    if (!sameLocation) {
        if (currentLocCompat && worldState.tars.activity === chosenActivity) {
            const reason = generateDecisionReason(chosenActivity, "stay", needs);
            recordAutonomyDecision(intent, chosenActivity, current, "stay", reason + " (location compatible)", bestScore, {
                scoreComponents: winnerComponents,
                alternatives: topAlternatives
            });
            return;
        }

        const currentLocScore = scoreLocation(current);
        const targetLocScore = scoreLocation(chosenLocation);
        if (targetLocScore <= currentLocScore + 5 && currentLocScore >= 30) {
            const action = chosenActivity === "idle" ? "idle" : "stay";
            const reason = generateDecisionReason(worldState.tars.activity, action, needs) + " (current location sufficient)";
            recordAutonomyDecision(intent, worldState.tars.activity, current, action, reason, currentLocScore, {
                scoreComponents: winnerComponents,
                alternatives: topAlternatives
            });
            return;
        }
    }

    // Wander check: when no activity wins decisively and curiosity is high
    const sortedScores = [...activityScores].sort((a, b) => b.score - a.score);
    const topScore = sortedScores[0]?.score || 0;
    const secondScore = sortedScores[1]?.score || 0;
    const scoreGap = topScore - secondScore;
    const hasCriticalNeed = Object.values(needs).some(v => (1 - v) > WANDER.PRIORITY_DEFICIT_THRESHOLD);
    const nowWander = Date.now();
    const wanderCooldownElapsed = (nowWander - (worldState.tars.lastWanderTime || 0)) > WANDER.COOLDOWN_SECONDS * 1000;

    if (!hasCriticalNeed
        && needs.curiosity < WANDER.CURIOSITY_THRESHOLD
        && scoreGap < WANDER.SCORE_GAP_THRESHOLD
        && wanderCooldownElapsed
        && worldState.tars.activity !== "idle") {
        const wanderTarget = selectWanderDestination();
        if (wanderTarget) {
            worldState.tars.lastWanderTime = nowWander;
            worldState.tars.currentGoal = wanderTarget;
            const wanderReason = generateDecisionReason("idle", "wander", needs);
            recordAutonomyDecision("explore", "idle", wanderTarget, "wander", wanderReason, 0, {
                wanderTarget,
                triggerReason: `curiosity=${(needs.curiosity * 100).toFixed(0)}% gap=${scoreGap.toFixed(1)}`,
                scoreComponents: winnerComponents,
                alternatives: topAlternatives
            });
            logStateChange("wander", { from: worldState.tars.location, to: wanderTarget });
            window.TARS.lookAt(wanderTarget, "wander", "idle");
            window.TARS.setEmotion("think", 0.4);
            return;
        }
    }

    worldState.tars.currentGoal = chosenLocation;

    const action = chosenActivity === "idle" ? "idle" : (sameLocation ? "switch_activity" : "move");
    const reason = generateDecisionReason(chosenActivity, action, needs);
    recordAutonomyDecision(intent, chosenActivity, chosenLocation, action, reason, bestScore, {
        scoreComponents: winnerComponents,
        alternatives: topAlternatives
    });

    logStateChange("autonomous_move", { from: current, to: chosenLocation, activity: chosenActivity });

    window.TARS.lookAt(chosenLocation, "autonomous_move", chosenActivity);

    const emotionMap = {
        computer_work: "think",
        server_check: "listen",
        weather_observation: "think",
        user_interaction: "listen",
        gaming: "chill",
        tv_watching: "chill",
        idle: "neutral"
    };
    if (emotionMap[chosenActivity]) {
        window.TARS.setEmotion(emotionMap[chosenActivity], 0.5 + Math.random() * 0.3);
    }
}

// ============================================================
// PHASE 3: LLM INTENT PARSER + MOCK GENERATOR
// ============================================================

window.TARS_INTENT = {
    parse(intent) {
        let behavior = {};
        const validation = this.validate(intent, true);

        if (typeof intent === 'string') {
            behavior = this.keywordParse(intent);
        } else if (typeof intent === 'object' && intent !== null) {
            behavior = this.sanitize(intent);
        }

        console.log(`[TARS INTENT] Raw:`, intent, `Parsed:`, behavior, `Valid:`, validation.valid);
        if (Object.keys(behavior).length > 0) {
            window.TARS.setBehavior(behavior);
            const activityMap = {
                window_left: "weather_observation",
                window_right: "weather_observation",
                desk: "computer_work",
                "rack-a": "server_check",
                user: "user_interaction"
            };
            const intentActivity = activityMap[behavior.gaze] || "intent";
            worldState.activityLog.push({
                type: "intent",
                activity: intentActivity,
                location: behavior.gaze || null,
                reason: "llm_intent",
                timestamp: new Date().toISOString(),
                raw: typeof intent === 'string' ? intent : JSON.stringify(intent),
                parsed: behavior,
                valid: validation.valid
            });
            if (worldState.activityLog.length > worldState.maxActivityLogSize) {
                worldState.activityLog.shift();
            }
        }
        return { behavior, validation };
    },

    // Public validation that returns detailed result (does not mutate input)
    validateIntent(intent) {
        if (!intent || typeof intent !== 'object') {
            return { valid: false, errors: ["Intent must be a non-null object"], sanitized: {} };
        }
        const errors = [];
        const sanitized = {};
        if (intent.emotion !== undefined) {
            if (EMOTION_VALUES.includes(intent.emotion)) sanitized.emotion = intent.emotion;
            else errors.push(`Invalid emotion "${intent.emotion}" — must be one of: ${EMOTION_VALUES.join(", ")}`);
        }
        if (intent.gesture !== undefined) {
            if (GESTURE_VALUES.includes(intent.gesture)) sanitized.gesture = intent.gesture;
            else errors.push(`Invalid gesture "${intent.gesture}"`);
        }
        if (intent.gaze !== undefined) {
            if (TARGET_VALUES.includes(intent.gaze)) sanitized.gaze = intent.gaze;
            else errors.push(`Invalid gaze "${intent.gaze}"`);
        }
        if (intent.target !== undefined) {
            if (TARGET_VALUES.includes(intent.target)) sanitized.target = intent.target;
            else errors.push(`Invalid target "${intent.target}"`);
        }
        if (intent.movement !== undefined) {
            if (MOVEMENT_VALUES.includes(intent.movement)) sanitized.movement = intent.movement;
            else errors.push(`Invalid movement "${intent.movement}"`);
        }
        if (intent.energy !== undefined) sanitized.energy = Math.max(0, Math.min(1, intent.energy));
        if (intent.intensity !== undefined) sanitized.intensity = Math.max(0, Math.min(1, intent.intensity));
        if (intent.urgency !== undefined) sanitized.urgency = Math.max(0, Math.min(1, intent.urgency));
        return { valid: errors.length === 0, errors, sanitized };
    },

    keywordParse(input) {
        const text = input.toLowerCase();
        const result = {};

        const keywordMap = [
            { keywords: ["storm", "thunder", "lightning", "rain"], emotion: "think", gaze: "window_right", gesture: "pulse" },
            { keywords: ["work", "code", "write", "build", "computer"], emotion: "think", gaze: "desk" },
            { keywords: ["check", "server", "rack", "monitor", "status"], emotion: "listen", gaze: "rack-a", movement: "walk", target: "rack-a" },
            { keywords: ["chill", "relax", "calm", "sleep"], emotion: "chill", gaze: "window_left", gesture: "expand" },
            { keywords: ["hello", "hi", "hey", "look"], emotion: "amused", gaze: "user", gesture: "nod" },
            { keywords: ["watch", "observe", "bridge", "city", "right window"], emotion: "think", gaze: "window_right", gesture: "expand" },
            { keywords: ["left window"], emotion: "chill", gaze: "window_left" },
            { keywords: ["night", "dark", "sleep"], emotion: "chill", energy: 0.2, gaze: "window_left" },
            { keywords: ["alarm", "warning", "danger", "critical", "alert"], emotion: "warning", urgency: 0.8, gesture: "pulse" },
            { keywords: ["nod", "agree", "yes"], gesture: "nod", emotion: "amused", intensity: 0.4 },
            { keywords: ["spin", "dance", "celebrate"], gesture: "spin", emotion: "celebrate", intensity: 0.9 },
            { keywords: ["expand", "show", "big"], gesture: "expand", emotion: "think" },
            { keywords: ["shake", "no", "disagree"], gesture: "shake", emotion: "confused" },
            { keywords: ["game", "play"], emotion: "amused", gaze: "desk", gesture: "pulse" },
            { keywords: ["tv", "television", "watch"], emotion: "chill", gaze: "user" },
        ];

        for (const rule of keywordMap) {
            if (rule.keywords.some(kw => text.includes(kw))) {
                if (rule.emotion) result.emotion = rule.emotion;
                if (rule.gaze) result.gaze = rule.gaze;
                if (rule.gesture) result.gesture = rule.gesture;
                if (rule.movement) result.movement = rule.movement;
                if (rule.target) result.target = rule.target;
                if (rule.energy !== undefined) result.energy = rule.energy;
                if (rule.urgency !== undefined) result.urgency = rule.urgency;
                break;
            }
        }

        return result;
    },

    validate(obj) {
        return this.validateIntent(obj);
    },

    sanitize(obj) {
        const emotionValues = ["idle", "listen", "think", "speak", "sarcastic", "amused", "confused", "serious", "warning", "critical", "celebrate", "chill", "disapproving", "excited"];
        const gestureValues = ["nod", "shake", "pulse", "expand", "spin"];
        const targetValues = ["window_left", "window_right", "desk", "rack-a", "user"];
        const movementValues = ["walk", "drift", "rush"];

        if (obj.emotion && !emotionValues.includes(obj.emotion)) delete obj.emotion;
        if (obj.gesture && !gestureValues.includes(obj.gesture)) delete obj.gesture;
        if (obj.gaze && !targetValues.includes(obj.gaze)) delete obj.gaze;
        if (obj.target && !targetValues.includes(obj.target)) delete obj.target;
        if (obj.movement && !movementValues.includes(obj.movement)) delete obj.movement;
        if (obj.energy !== undefined) obj.energy = Math.max(0, Math.min(1, obj.energy));
        if (obj.intensity !== undefined) obj.intensity = Math.max(0, Math.min(1, obj.intensity));
        if (obj.urgency !== undefined) obj.urgency = Math.max(0, Math.min(1, obj.urgency));

        return obj;
    },

    mock() {
        const intents = [
            "go to the left window",
            "go to the right window",
            "play a game",
            "work on the computer",
            "check the server rack",
            "watch tv",
            "storm is coming outside",
            "time to check the servers",
            "lets write some code",
            "just relax and watch the rain",
            "hello there",
            "stop current activity and investigate an alert",
        ];
        const pick = intents[Math.floor(Math.random() * intents.length)];
        console.log(`[TARS INTENT] Mock: "${pick}"`);
        return this.parse(pick);
    },
    mockBehavior() {
        return this.mock().behavior;
    }
};

// Phase 6: LLM integration boundary — clean entry point for external LLM
window.TARS_LLM = {
    // Accept behavioral JSON from real LLM, validate, route through World Engine
    handleIntent(intent) {
        const result = window.TARS_INTENT.parse(intent);
        if (!result.behavior || Object.keys(result.behavior).length === 0) {
            console.warn(`[TARS_LLM] Empty intent — no action taken`);
            return { success: false, reason: "Empty intent after validation", errors: result.validation?.errors || [] };
        }
        console.log(`[TARS_LLM] Intent executed:`, result.behavior);
        return { success: true, behavior: result.behavior, validation: result.validation };
    },

    // End LLM conversation — release control back to autonomous
    endConversation() {
        window.TARS.releaseControl();
        console.log(`[TARS_LLM] Conversation ended — control released`);
    },

    // Get current context for LLM prompt
    getContext() {
        return getTARSContext();
    },

    // Check if TARS is currently available for interaction
    isAvailable() {
        return worldState.tars.controlMode !== "llm";
    }
};

// ============================================================
// CAMERA PARALLAX
// ============================================================

let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;

window.addEventListener("pointermove", event => {
    mouseX = (event.clientX / window.innerWidth) * 2 - 1;
    mouseY = (event.clientY / window.innerHeight) * 2 - 1;
});

// ============================================================
// MAIN ANIMATION LOOP
// ============================================================

const clock = new THREE.Clock();
let dayNightAccum = 0;
let clockAccum = 0;
let weatherCheckAccum = 0;

function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    const time = clock.getElapsedTime();

    // 1. Camera Parallax
    targetX = mouseX * 0.7;
    targetY = mouseY * 0.35;
    camera.position.x += (targetX - camera.position.x) * 0.025;
    camera.position.y += (2.7 - targetY - camera.position.y) * 0.025;
    camera.lookAt(0, 2.8, -3);

    // 2. Day/Night & Clock
    dayNightAccum += dt;
    if (dayNightAccum > 0.5) {
        dayNightAccum = 0;
        updateDayNight();
    }
    clockAccum += dt;
    if (clockAccum > 1) {
        clockAccum = 0;
        setClockToRealTime();
    }

    // 2a. Weather sync — propagate worldState weather changes to visuals
    weatherCheckAccum += dt;
    if (weatherCheckAccum > 2) {
        weatherCheckAccum = 0;
        weatherVisualEngine.updateFromWeatherState();
    }

    // 2b. Autonomous Needs & Decision Making
    updateNeeds(dt);
    makeAutonomousDecision();

    // 2c. Process queued world events (interruption system)
    processWorldEvents();

    // Monitor idle/screensaver system (BUG 3 fix)
    updateMonitorIdle(dt);

    // 3. Environment LEDs & Fans
    serverLEDs.forEach(entry => {
        const pulse = Math.sin(time * entry.speed + entry.phase);
        entry.mesh.material.opacity = 0.5 + pulse * 0.4;
    });
    rackFans.forEach((fanBlades, i) => {
        fanBlades.rotation.z += (i % 2 === 0 ? 1 : -1) * 0.06;
    });
    animatedScreens.forEach(s => {
        if (time >= s.nextUpdate) {
            s.nextUpdate = time + s.refreshRate;
            s.drawFn(s.ctx, s.w, s.h, time);
            s.tex.needsUpdate = true;
        }
    });

    // 4. PC RGB Cycle
    const hue = (time * 0.08) % 1;
    rgbStrip.material.color.setHSL(hue, 1, 0.55);
    towerGlass.material.emissive.setHSL(hue, 0.8, 0.4);
    rgbLight.color.setHSL(hue, 1, 0.55);
    rgbLight.intensity = 5 + Math.sin(time * 3) * 1.2;

    // 5. Rain & Dust
    // Right window rain
    const positions = rain.geometry.attributes.position.array;
    for (let i = 0; i < rainCount; i++) {
        positions[i * 3 + 1] -= rainSpeeds[i];
        if (positions[i * 3 + 1] < winBottom - 1.5) {
            positions[i * 3 + 1] = winTop + 1.5;
            positions[i * 3] = winLeft + Math.random() * WIN_W;
        }
    }
    rain.geometry.attributes.position.needsUpdate = true;

    // Left window rain
    const lpositions = lrain.geometry.attributes.position.array;
    for (let i = 0; i < lrainCount; i++) {
        lpositions[i * 3 + 1] -= lrainSpeeds[i];
        if (lpositions[i * 3 + 1] < lwinBottom - 1.5) {
            lpositions[i * 3 + 1] = lwinTop + 1.5;
            lpositions[i * 3] = lwinLeft + Math.random() * 6;
        }
    }
    lrain.geometry.attributes.position.needsUpdate = true;

    dust.rotation.y = time * 0.015;

    // 6. Lights
    blueLight.intensity = 16 + Math.sin(time * 0.4) * 2;
    ledStripLight.intensity = 3.5 + Math.sin(time * 2.2) * 0.8;

    // 7. T.A.R.S. POSITION & MOVEMENT PROCEDURAL CONTROLLER
    // ============================================================
    // COLLISION AVOIDANCE & PATHFINDING SYSTEM
    // ============================================================

    // Simple steering behaviors for obstacle avoidance
    function getAvoidanceVector(position, targetPos, dt) {
        const avoidStrength = 0.8;
        const lookAhead = 1.5;
        const avoidanceVec = new THREE.Vector3(0, 0, 0);
        
        // Check each obstacle
        for (const obs of OBSTACLES) {
            const toObs = new THREE.Vector3().subVectors(position, new THREE.Vector3(obs.x, position.y, obs.z));
            const dist = toObs.length();
            const radius = obs.radius + 0.5; // TARS radius + buffer
            
            if (dist < radius + lookAhead) {
                // Calculate avoidance force
                const force = (radius + lookAhead - dist) / (radius + lookAhead);
                if (dist > 0.001) {
                    toObs.normalize();
                    avoidanceVec.addScaledVector(toObs, force * avoidStrength);
                } else {
                    // Random push if exactly on top
                    avoidanceVec.add(new THREE.Vector3(
                        (Math.random() - 0.5) * force * avoidStrength,
                        0,
                        (Math.random() - 0.5) * force * avoidStrength
                    ));
                }
            }
        }
        
        // Also avoid room bounds
        const bounds = ROOM_BOUNDS;
        const margin = 1.0;
        if (position.x < bounds.xMin + margin) avoidanceVec.x += (bounds.xMin + margin - position.x) * 0.5;
        if (position.x > bounds.xMax - margin) avoidanceVec.x += (bounds.xMax - margin - position.x) * 0.5;
        if (position.z < bounds.zMin + margin) avoidanceVec.z += (bounds.zMin + margin - position.z) * 0.5;
        if (position.z > bounds.zMax - margin) avoidanceVec.z += (bounds.zMax - margin - position.z) * 0.5;
        
        return avoidanceVec;
    }

    // Table wiggle effect when bumped
    let deskWiggle = { x: 0, z: 0, intensity: 0, timer: 0 };
    let rackWiggle = { intensity: 0, timer: 0 };

    // ============================================================
    // MOVEMENT WITH COLLISION AVOIDANCE
    // ============================================================
    if (currentState.mode === "demo") {
        // DEMO Lissajous Flight Path across room
        const demoX = THREE.MathUtils.clamp(Math.sin(time * 0.18) * 5.8, ROOM_BOUNDS.xMin + 0.6, ROOM_BOUNDS.xMax - 0.6);
        const demoZ = THREE.MathUtils.clamp(-0.5 + Math.cos(time * 0.13) * 3.8, ROOM_BOUNDS.zMin + 0.6, ROOM_BOUNDS.zMax - 0.6);
        const demoY = THREE.MathUtils.clamp(2.6 + Math.sin(time * 0.27) * 1.8, ROOM_BOUNDS.yMin + 0.3, ROOM_BOUNDS.yMax - 0.3);
        tarsEntityGroup.position.set(demoX, demoY, demoZ);
    } else {
        // LIVE MODE: Smooth Spring Hovering with collision avoidance
        const hoverY = Math.sin(time * (1.2 + currentState.energy * 2.0)) * (0.12 + currentState.energy * 0.15);
        const hoverX = Math.cos(time * 0.8) * 0.08;
        
        // Calculate desired velocity toward target
        const desiredVel = new THREE.Vector3(
            (currentState.targetPos.x + hoverX - tarsEntityGroup.position.x) * 0.05,
            (currentState.targetPos.y + hoverY - tarsEntityGroup.position.y) * 0.05,
            (currentState.targetPos.z - tarsEntityGroup.position.z) * 0.05
        );
        
        // Add collision avoidance
        const avoidance = getAvoidanceVector(tarsEntityGroup.position, currentState.targetPos, dt);
        desiredVel.add(avoidance);
        
        // Apply velocity
        tarsEntityGroup.position.add(desiredVel);
        
        // Desk wiggle on near-collision
        const deskDist = tarsEntityGroup.position.distanceTo(new THREE.Vector3(1.7, 2.3, -2.2));
        if (deskDist < 1.8 && deskDist > 1.3) {
            const prevDist = deskWiggle.prevDist || deskDist;
            if (deskDist < prevDist - 0.02) { // Moving toward desk
                deskWiggle.intensity = Math.min(1.0, deskWiggle.intensity + 0.3);
                deskWiggle.timer = 0.5;
                deskWiggle.x = (Math.random() - 0.5) * 0.02;
                deskWiggle.z = (Math.random() - 0.5) * 0.02;
            }
            deskWiggle.prevDist = deskDist;
        }
        
        // Apply desk wiggle
        if (deskWiggle.timer > 0) {
            deskWiggle.timer -= dt;
            deskWiggle.intensity *= 0.9;
            desk.position.x += deskWiggle.x * deskWiggle.intensity;
            desk.position.z += deskWiggle.z * deskWiggle.intensity;
            // Snap back
            desk.position.x += (1.7 - desk.position.x) * 0.1;
            desk.position.z += (-2.2 - desk.position.z) * 0.1;
        }
        
        // Rack wiggle
        const rackDist = tarsEntityGroup.position.distanceTo(new THREE.Vector3(-4.7, 2.5, -4));
        if (rackDist < 1.6 && rackDist > 1.1) {
            if (!rackWiggle.prevDist || rackDist < rackWiggle.prevDist - 0.02) {
                rackWiggle.intensity = Math.min(1.0, rackWiggle.intensity + 0.4);
                rackWiggle.timer = 0.4;
            }
            rackWiggle.prevDist = rackDist;
        }
        
        // Apply rack wiggle
        if (rackWiggle.timer > 0) {
            rackWiggle.timer -= dt;
            rackWiggle.intensity *= 0.85;
            // Note: racks are part of room group, we'd need references to wiggle them
            // For now just visual indication via TARS light
            if (rackWiggle.intensity > 0.5) {
                tarsLight.intensity += Math.sin(time * 40) * rackWiggle.intensity * 2;
            }
        }
        
        // Orient / Lean towards Gaze Target
        if (TARGET_POSITIONS[currentState.gazeTarget]) {
            const targetVec = TARGET_POSITIONS[currentState.gazeTarget];
            const dx = targetVec.x - tarsEntityGroup.position.x;
            const dz = targetVec.z - tarsEntityGroup.position.z;
            const angle = Math.atan2(dx, dz);
            tarsEntityGroup.rotation.y += (angle - tarsEntityGroup.rotation.y) * 0.04;
        }
    }

    // 7b. LOCATION-BASED INTERACTIONS
    const pos = tarsEntityGroup.position;
    const atDesk = pos.distanceTo(new THREE.Vector3(1.7, 2.3, -2.2)) < 1.5;
    const atRack = pos.distanceTo(new THREE.Vector3(-4.7, 2.5, -4)) < 1.5;
    const atWindowLeft = pos.distanceTo(new THREE.Vector3(-7.5, 4.2, 0)) < 2.0;
    const atWindowRight = pos.distanceTo(new THREE.Vector3(WIN_X, WIN_Y, WALL_Z)) < 2.0;
    const atWindow = atWindowLeft || atWindowRight;
    
    // Desk interaction - switch monitor to TARS OS
    if (atDesk && !currentState.atDesk) {
        currentState.atDesk = true;
        currentState.atRack = false;
        currentState.atWindow = false;
        // Switch monitor1 to TARS OS
        const deskScreen = animatedScreens.find(s => s.drawFn === drawTerminal);
        if (deskScreen) deskScreen.drawFn = drawTARSOS;
        // Trigger location-specific behavior
        triggerLocationBehavior("desk");
        console.log("[TARS] At desk - neural interface active");
    } else if (!atDesk && currentState.atDesk) {
        currentState.atDesk = false;
        // Restore terminal
        const deskScreen = animatedScreens.find(s => s.drawFn === drawTARSOS);
        if (deskScreen) deskScreen.drawFn = drawTerminal;
    }
    
    // Rack interaction - data transfer effect on server LEDs
    if (atRack && !currentState.atRack) {
        currentState.atRack = true;
        currentState.atDesk = false;
        currentState.atWindow = false;
        // Trigger data transfer pulse on server LEDs
        serverLEDs.forEach(led => {
            led.phase = Math.random() * Math.PI * 2;
            led.speed = 15 + Math.random() * 10; // Fast pulsing
        });
        // Trigger location-specific behavior (sparks, screen effects, etc.)
        triggerLocationBehavior("rack-a");
        console.log("[TARS] At rack - data transfer initiated");
    } else if (!atRack && currentState.atRack) {
        currentState.atRack = false;
        // Restore normal LED speeds
        serverLEDs.forEach(led => {
            led.speed = 2 + Math.random() * 4;
        });
    }
    
    // Window interaction - scan outside
    if (atWindow && !currentState.atWindow) {
        currentState.atWindow = true;
        currentState.atWindowSide = atWindowLeft ? "left" : "right";
        triggerLocationBehavior(atWindowLeft ? "window_left" : "window_right");
        console.log("[TARS] At window - scanning exterior", currentState.atWindowSide);
    } else if (!atWindow && currentState.atWindow) {
        currentState.atWindow = false;
        currentState.atWindowSide = null;
    }

    // 8. T.A.R.S. EMBODIMENT PROCEDURAL SHADER & MESH ANIMATION
    // Update EmotionMixer for smooth transitions
    emotionMixer.update(dt);
    
    // Apply mixed state to currentState
    const mixed = emotionMixer.getMixedState();
    currentState.targetColor.lerp(mixed.color, 0.1);
    currentState.pulseSpeed = mixed.pulseSpeed;
    currentState.deformation = mixed.deformation;
    currentState.asymmetry = mixed.asymmetry;
    currentState.leanZ = mixed.leanZ;
    currentState.orbitSpeed = mixed.orbitSpeed;
    currentState.energy = mixed.energy;

    // Color Lerp
    currentState.currentColor.lerp(currentState.targetColor, 0.05);
    tarsLight.color.copy(currentState.currentColor);
    bodyMat.emissive.copy(currentState.currentColor);
    coreMat.color.copy(currentState.currentColor);
    orbParticleMat.color.copy(currentState.currentColor);

    // Pulse & Core Intensity (with speech reactivity)
    const speechPulse = currentState.speaking 
        ? (Math.sin(time * 12) * 0.4 + currentState.speechAmplitude * 0.6)
        : 0;
    const corePulse = Math.sin(time * currentState.pulseSpeed) * 0.15 + speechPulse;
    tarsCoreMesh.scale.setScalar(1.0 + corePulse * 0.4 * currentState.scale);
    tarsLight.intensity = 5 + corePulse * 4 + currentState.urgency * 4;

    // Draw emotional face
    drawFace(time);

    // Shell Rotation
    tarsShellMesh.rotation.x += 0.005 * currentState.orbitSpeed;
    tarsShellMesh.rotation.y += 0.008 * currentState.orbitSpeed;
    tarsShellMesh.rotation.z += (currentState.leanZ - tarsShellMesh.rotation.z) * 0.05;

    // Gaze Indicator - points toward gaze target
    if (tarsGazeIndicator && TARGET_POSITIONS[currentState.gazeTarget]) {
        const targetVec = TARGET_POSITIONS[currentState.gazeTarget];
        const dx = targetVec.x - tarsEntityGroup.position.x;
        const dz = targetVec.z - tarsEntityGroup.position.z;
        const gazeAngle = Math.atan2(dx, dz);
        tarsGazeIndicator.rotation.y += (gazeAngle - tarsGazeIndicator.rotation.y) * 0.1;
        tarsGazeIndicator.material.color.copy(currentState.currentColor);
    }

    // Deforming Vertex Noise Body
    const bodyPosAttr = bodyGeo.attributes.position;
    const posArr = bodyPosAttr.array;
    const defAmount = currentState.deformation + (currentState.speaking ? 0.1 : 0) + currentState.speechAmplitude * 0.15;
    
    for (let i = 0; i < posArr.length; i += 3) {
        const ox = originalBodyPositions[i];
        const oy = originalBodyPositions[i + 1];
        const oz = originalBodyPositions[i + 2];
        
        // Multi-frequency wave deformation
        const noise = Math.sin(ox * 5 + time * 3) * Math.cos(oy * 5 + time * 2.5) * Math.sin(oz * 5 + time * 4);
        const asym = ox * currentState.asymmetry;
        const factor = 1.0 + (noise * defAmount) + (asym * 0.2);

        posArr[i] = ox * factor * currentState.scale;
        posArr[i + 1] = oy * factor * currentState.scale;
        posArr[i + 2] = oz * factor * currentState.scale;
    }
    bodyPosAttr.needsUpdate = true;
    bodyGeo.computeVertexNormals();

    // Orbiting Particles Simulation
    const pArr = orbParticleGeo.attributes.position.array;
    for (let i = 0; i < orbParticleCount; i++) {
        orbParticlePhases[i] += 0.01 * currentState.orbitSpeed;
        const rad = orbParticleRadii[i] + Math.sin(time * 2 + i) * 0.08;
        pArr[i * 3] = Math.cos(orbParticlePhases[i]) * rad * currentState.scale;
        pArr[i * 3 + 1] = Math.sin(orbParticlePhases[i] * 2) * 0.25 * currentState.scale;
        pArr[i * 3 + 2] = Math.sin(orbParticlePhases[i]) * rad * currentState.scale;
    }
    orbParticleGeo.attributes.position.needsUpdate = true;

    // Spark/FX Particle System Update
    const fxPositions = fxParticleGeo.attributes.position.array;
    const fxVelocities = fxParticleVelocities;
    const fxLifes = fxParticleLifes;
    const fxSizes = fxParticleGeo.attributes.size.array;
    for (let i = 0; i < fxParticleCount; i++) {
        if (fxLifes[i] > 0) {
            const idx = i * 3;
            fxPositions[idx] += fxVelocities[idx] * dt * 60;
            fxPositions[idx + 1] += fxVelocities[idx + 1] * dt * 60;
            fxPositions[idx + 2] += fxVelocities[idx + 2] * dt * 60;
            
            // Gravity
            fxVelocities[idx + 1] -= 0.02 * dt * 60;
            
            fxLifes[i] -= dt;
            fxSizes[i] *= 0.98;
        }
    }
    fxParticleGeo.attributes.position.needsUpdate = true;
    fxParticleGeo.attributes.size.needsUpdate = true;

    // Bird update - fly outside window
    for (let i = 0; i < birdCount; i++) {
        if (birdActive[i] > 0) {
            birdActive[i] -= dt;
            const speed = birdSpeeds[i];
            const phase = birdPhases[i];
            
            // Flap wings
            if (birdMeshes[i].userData.wings) {
                const flap = Math.sin(time * 15 + i) * 0.5;
                birdMeshes[i].userData.wings[0].rotation.z = -0.2 + flap;
                birdMeshes[i].userData.wings[1].rotation.z = 0.2 - flap;
            }
            
            // Fly in a path past the window
            const t = (1 - birdActive[i] / 15) * Math.PI * 2;
            birdMeshes[i].position.x = WIN_X + Math.sin(t) * 8;
            birdMeshes[i].position.y = WIN_Y + Math.cos(t * 0.7) * 3 + Math.sin(time * 2 + i) * 0.5;
            // Stay outside window: WALL_Z = -6, so keep z < -6 (outside)
            birdMeshes[i].position.z = WALL_Z - 12 - Math.cos(t) * 6;
            
            // Look direction
            birdMeshes[i].rotation.y = Math.atan2(
                Math.cos(t) * 8,
                Math.sin(t) * 10
            );
        } else if (Math.random() < 0.001) {
            // Randomly spawn a bird
            birdActive[i] = 15 + Math.random() * 10; // 15-25 second flight
            birdMeshes[i].visible = true;
            birdMeshes[i].position.set(
                WIN_X + (Math.random() - 0.5) * 20,
                WIN_Y + (Math.random() - 0.5) * 10 + 5,
                WALL_Z - 15 - Math.random() * 10
            );
        } else {
            birdMeshes[i].visible = false;
        }
    }

    // Screensaver update - handled by updateMonitorIdle(dt) called earlier
    // const tarsPos = tarsEntityGroup.position;
    // const atDeskScreen = tarsPos.distanceTo(new THREE.Vector3(1.7, 2.3, -2.2)) < 1.5;
    // updateScreensavers(dt, atDeskScreen, false, false);

    // FX System - Special visual effects per emotion
    currentState.fxTimer += dt;
    const fxTime = currentState.fxTimer;
    
    switch (currentState.fx) {
        case "strobe_orange": {  // WARNING - intense orange/red strobe
            const strobe = Math.sin(fxTime * 30) > 0 ? 1 : 0;
            const color = new THREE.Color().lerpColors(
                new THREE.Color(0xff8800), 
                new THREE.Color(0xff2200), 
                (Math.sin(fxTime * 10) + 1) * 0.5
            );
            tarsLight.color.copy(color);
            bodyMat.emissive.copy(color);
            coreMat.color.copy(color);
            orbParticleMat.color.copy(color);
            tarsLight.intensity = 15 + strobe * 20;
            if (fxTime > 3) currentState.fx = "none";  // Auto-clear after 3s
            break;
        }
        case "strobe_red": {  // CRITICAL - violent red strobe
            const strobe = Math.sin(fxTime * 50) > 0 ? 1 : 0.3;
            const color = new THREE.Color(0xff0000);
            tarsLight.color.copy(color);
            bodyMat.emissive.copy(color);
            coreMat.color.copy(color);
            orbParticleMat.color.copy(color);
            tarsLight.intensity = 20 + Math.sin(fxTime * 40) * 15;
            // Violent scale pulse
            currentState.scale = 1.0 + Math.sin(fxTime * 25) * 0.3;
            if (fxTime > 3) { currentState.fx = "none"; currentState.scale = 1.0; }
            break;
        }
        case "strobe": {  // SPEAK - voice wave pulse
            const wave = (Math.sin(fxTime * 20) + 1) * 0.5;
            const color = new THREE.Color().lerpColors(
                new THREE.Color(0x00d2ff), 
                new THREE.Color(0xffffff), 
                wave * 0.5
            );
            orbParticleMat.color.copy(color);
            if (fxTime > 1.5) currentState.fx = "none";
            break;
        }
        case "bounce": {  // AMUSED - playful bounce
            const bounce = Math.sin(fxTime * 15) * 0.15;
            tarsEntityGroup.position.y += bounce;
            tarsCoreMesh.scale.setScalar(1.0 + Math.abs(bounce) * 2);
            if (fxTime > 2) { currentState.fx = "none"; tarsCoreMesh.scale.setScalar(1.0); }
            break;
        }
        case "scan": {  // LISTEN - scanning sweep
            tarsShellMesh.rotation.y += dt * 8;
            tarsLight.intensity = 8 + Math.sin(fxTime * 12) * 3;
            if (fxTime > 2) currentState.fx = "none";
            break;
        }
        case "wobble": {  // CONFUSED - unstable wobble
            currentState.asymmetry = 0.5 + Math.sin(fxTime * 8) * 0.3;
            currentState.leanZ = Math.sin(fxTime * 6) * 0.4;
            if (fxTime > 2.5) currentState.fx = "none";
            break;
        }
        case "flicker": {  // SARCASTIC - color flicker
            if (Math.random() < 0.1) {
                tarsLight.color.setHex(Math.random() < 0.5 ? 0xf39c12 : 0x5fd0ff);
                bodyMat.emissive.setHex(tarsLight.color.getHex());
            }
            if (fxTime > 2) currentState.fx = "none";
            break;
        }
        case "expansive": {  // CELEBRATE - expanding burst with color cycle
            const expand = Math.min(1, fxTime * 2);
            currentState.scale = 1.0 + expand * 0.8;
            currentState.deformation = 0.3 + expand * 0.2;
            // Rainbow cycle
            const hue = (fxTime * 0.3) % 1;
            const rainbow = new THREE.Color().setHSL(hue, 1, 0.5);
            tarsLight.color.copy(rainbow);
            bodyMat.emissive.copy(rainbow);
            coreMat.color.copy(rainbow);
            orbParticleMat.color.copy(rainbow);
            // Burst particles outward
            const pArr2 = orbParticleGeo.attributes.position.array;
            for (let i = 0; i < orbParticleCount; i++) {
                const rad = orbParticleRadii[i] * (1 + expand * 3);
                pArr2[i * 3] = Math.cos(orbParticlePhases[i]) * rad;
                pArr2[i * 3 + 2] = Math.sin(orbParticlePhases[i]) * rad;
            }
            orbParticleGeo.attributes.position.needsUpdate = true;
            if (fxTime > 2.5) { currentState.fx = "none"; currentState.scale = 1.0; }
            break;
        }
        case "steady": {  // SERIOUS - rock solid, high contrast
            tarsLight.intensity = 8;
            bodyMat.emissiveIntensity = 1.5;
            currentState.deformation = 0.01;
            if (fxTime > 2) currentState.fx = "none";
            break;
        }
        case "slow_pulse": {  // THINK - slow deep pulse
            const pulse = Math.sin(fxTime * 2) * 0.2;
            tarsLight.intensity = 5 + pulse * 3;
            if (fxTime > 2) currentState.fx = "none";
            break;
        }
    }

    // FX Spark Particle System Update
    if (fxParticleGeo && fxParticleLifes) {
        const positions = fxParticleGeo.attributes.position.array;
        const velocities = fxParticleVelocities;
        const lifes = fxParticleLifes;
        const colors = fxParticleGeo.attributes.color.array;
        const sizes = fxParticleGeo.attributes.size.array;
        
        for (let i = 0; i < fxParticleCount; i++) {
            if (lifes[i] > 0) {
                const idx = i * 3;
                positions[idx] += velocities[idx] * dt * 60;
                positions[idx + 1] += velocities[idx + 1] * dt * 60;
                positions[idx + 2] += velocities[idx + 2] * dt * 60;
                
                // Gravity
                velocities[idx + 1] -= 0.3 * dt * 60;
                
                lifes[i] -= dt;
                if (lifes[i] <= 0) {
                    sizes[i] = 0;
                } else {
                    // Fade out
                    sizes[i] = Math.max(0, 0.04 * (lifes[i] / 1.5));
                    // Fade color
                    colors[idx] *= 0.98;
                    colors[idx + 1] *= 0.98;
                    colors[idx + 2] *= 0.98;
                }
            }
        }
        fxParticleGeo.attributes.position.needsUpdate = true;
        fxParticleGeo.attributes.size.needsUpdate = true;
        fxParticleGeo.attributes.color.needsUpdate = true;
    }

    // Left window bridge: animate cars on bridge
    lcars.forEach((car, i) => {
        const ud = car.userData;
        car.position.z += ud.speed;
        // Loop cars on bridge
        if (car.position.z > 11) {
            car.position.z = -11;
            // Randomize speed slightly each loop
            ud.speed = 0.08 + Math.random() * 0.06;
        }
        // Headlight beam animation (subtle)
        if (lcarLights[i]) {
            const beamScale = 0.5 + Math.sin(time * 10 + i) * 0.1;
            lcarLights[i].left.scale.setScalar(beamScale);
            lcarLights[i].right.scale.setScalar(beamScale);
        }
    });

    // Left window bridge: parallax layers follow camera slightly
    lbridgeLayers.forEach(layer => {
        // Camera moves in room coordinates; bridge is outside at x=-11
        // Parallax along the wall (Z) and depth (X)
        const parallaxZ = camera.position.z * layer.speed;
        const parallaxX = (camera.position.x + 8) * layer.speed * 0.5; // relative to wall
        layer.mesh.position.z += (parallaxZ - layer.mesh.position.z) * 0.01;
        layer.mesh.position.x += (parallaxX - layer.mesh.position.x) * 0.005;
    });

    // Water surface subtle animation
    lwaterDistortion.time += dt;
    lwaterMesh.position.y = 0.15 + Math.sin(lwaterDistortion.time * 1.5) * 0.02;
    lwaterMesh.rotation.z = Math.sin(lwaterDistortion.time * 0.7) * 0.005;

    renderer.render(scene, camera);
}

    // Creator Console event delegation
    const overlayBody = document.getElementById("tars-overlay-body");
    overlayBody.addEventListener("click", (e) => {

        const setFb = (msg, color) => { if (fb) { fb.textContent = msg; fb.style.color = color || "#4ade80"; } };

        // Collapse toggle
        const header = e.target.closest(".tars-collapse-header");
        if (header) {
            const key = header.dataset.collapse;
            const body = document.getElementById("collapse-" + key);
            if (body) {
                body.classList.toggle("collapsed");
                const arrow = header.querySelector(".arrow");
                if (arrow) arrow.textContent = body.classList.contains("collapsed") ? "▶" : "▼";
                if (body.classList.contains("collapsed")) {
                    TARS_UI.collapsedSections.add(key);
                } else {
                    TARS_UI.collapsedSections.delete(key);
                }
            }
            return;
        }

        const action = e.target.dataset.action;
        if (!action) return;

        switch (action) {
            // System Controls
            case "pause":
                window.TARS_CONTROL.setMode("llm");
                setFb("⏸ Autonomy paused (LLM mode)", "#f87171");
                break;
            case "resume":
                window.TARS_CONTROL.setMode("autonomous");
                setFb("▶ Autonomy resumed", "#4ade80");
                break;
            case "force-decision":
                window.TARS_AUTONOMY.forceDecision();
                setFb("⚡ Decision cycle forced", "#5fd0ff");
                break;
            case "trigger-wander":
                worldState.tars.lastWanderTime = 0;
                window.TARS_AUTONOMY.setNeed("curiosity", 0.1);
                window.TARS_AUTONOMY.forceDecision();
                setFb("🧭 Wander primed + decision forced", "#a78bfa");
                break;
            case "reset-state":
                ["energy","curiosity","social","maintenance","comfort","hunger"].forEach(n => window.TARS_AUTONOMY.setNeed(n, 0.5));
                worldState.tars.activityFatigue = {};
                worldState.tars.continuationCount = 0;
                window.TARS_AUTONOMY.clearAutonomyHistory();
                setFb("🔄 State reset (needs→50%, fatigue cleared, history cleared)", "#fb923c");
                break;
            case "set-mode":
                if (window.TARS.setMode) window.TARS.setMode(e.target.dataset.mode);
                else console.warn("TARS.setMode not available");
                break;
            case "set-control":
                window.TARS_CONTROL.setMode(e.target.dataset.mode);
                break;
            case "release-control":
                if (window.TARS.releaseControl) window.TARS.releaseControl();
                else window.TARS_CONTROL.release();
                setFb("↩ Control released to autonomous", "#4ade80");
                break;

            // Testing sections
            case "inject-need": {
                const need = e.target.dataset.need;
                const delta = parseFloat(e.target.dataset.delta);
                const cur = worldState.tars.needs[need] !== undefined ? worldState.tars.needs[need] : 0.5;
                const newVal = Math.max(0, Math.min(1, cur + delta));
                window.TARS_AUTONOMY.setNeed(need, newVal);
                const valEl = document.querySelector(`[data-need-val="${need}"]`);
                if (valEl) valEl.textContent = (newVal * 100).toFixed(0) + "%";
                setFb(`Need "${need}" → ${(newVal * 100).toFixed(0)}%`, "");
                break;
            }
            case "trigger-behavior":
                window.TARS.trigger(e.target.dataset.preset);
                setFb(`Behavior: ${e.target.dataset.preset}`, "");
                break;
            case "test-behavior": {
                const behaviorMap = {
                    excited: {emotion:"excited", intensity:0.8, energy:0.9, urgency:0.7, gesture:"pulse", gaze:"user"},
                    thinking: {emotion:"thinking", intensity:0.4, energy:0.3, urgency:0.1, gesture:"nod", gaze:"desk"},
                    warning: {emotion:"warning", intensity:0.9, energy:0.8, urgency:0.9, gesture:"expand", gaze:"rack-a"}
                };
                const b = behaviorMap[e.target.dataset.behavior];
                if (b && window.TARS.setBehavior) window.TARS.setBehavior(b);
                setFb(`LLM Intent: ${e.target.dataset.behavior}`, "");
                break;
            }
            case "trigger-gesture":
                window.TARS.triggerGesture(e.target.dataset.gesture);
                setFb(`Gesture: ${e.target.dataset.gesture}`, "");
                break;
            case "test-activity":
                if (window.setTARSActivity) {
                    window.setTARSActivity(e.target.dataset.activity, e.target.dataset.location, "test_injection");
                }
                setFb(`Activity: ${e.target.dataset.activity} @ ${e.target.dataset.location}`, "");
                break;
            case "look-at":
                window.TARS.lookAt(e.target.dataset.target, "test_injection");
                setFb(`Gaze: ${e.target.dataset.target}`, "");
                break;
        }
        setTimeout(() => { if (fb) fb.textContent = ""; }, 3000);
    });

    // Journal entry expand/collapse toggle
    overlayBody.addEventListener("click", (e) => {
        const entry = e.target.closest(".tars-journal-entry");
        if (entry) {
            const detail = entry.querySelector(".tars-journal-detail");
            if (detail) detail.classList.toggle("open");
        }
    });

    TARS_UI.updateStatusHeader();
    console.log("[TARS OBSERVATORY] Phase 7.4 UI initialized. Press 🧠📊📜💬⚙ to open panels.");
}

// Phase 8.1 — Event Bus WebSocket Client
// Connects to TARS runtime server. Silently degrades if server is unavailable.
(function () {
    const WS_URL = (() => {
        const loc = window.location;
        const proto = loc.protocol === "https:" ? "wss:" : "ws:";
        return `${proto}//${loc.host}/ws`;
    })();
    let ws = null;
    let reconnectTimer = null;
    let connected = false;

    const RECONNECT_DELAYS = [1000, 2000, 5000, 10000, 30000];
    let reconnectAttempt = 0;

    function connect() {
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
        try {
            ws = new WebSocket(WS_URL);
        } catch (e) {
            scheduleReconnect();
            return;
        }
        ws.onopen = () => {
            connected = true;
            reconnectAttempt = 0;
            console.log("[TARS EVENTS] Connected to event bus");
            document.dispatchEvent(new CustomEvent("tars-events-connected"));
        };
        ws.onmessage = (msg) => {
            try {
                const event = JSON.parse(msg.data);
                if (event.type !== "system.heartbeat") {
                    console.log("[TARS EVENTS]", event.type, event.source, event.data);
                }
                document.dispatchEvent(new CustomEvent("tars-event", { detail: event }));
            } catch (e) {
                console.warn("[TARS EVENTS] Failed to parse message:", e);
            }
        };
        ws.onclose = () => {
            connected = false;
            ws = null;
            console.log("[TARS EVENTS] Disconnected");
            document.dispatchEvent(new CustomEvent("tars-events-disconnected"));
            scheduleReconnect();
        };
        ws.onerror = () => {
            // onclose will fire after onerror, triggering reconnect
        };
    }

    function scheduleReconnect() {
        if (reconnectTimer) return;
        const delay = RECONNECT_DELAYS[Math.min(reconnectAttempt, RECONNECT_DELAYS.length - 1)];
        reconnectAttempt++;
        reconnectTimer = setTimeout(() => {
            reconnectTimer = null;
            connect();
        }, delay);
    }

    window.TARS_EVENTS = {
        isConnected: () => connected,
        send(event) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(event));
                return true;
            }
            return false;
        },
        connect,
        disconnect() {
            if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
            if (ws) { ws.onclose = null; ws.close(); ws = null; }
            connected = false;
        }
    };

    if (window.location.host && window.location.host !== "") {
        connect();
    }
})();

    }

        const badge = document.getElementById("tars-alert-count");

        fetch("/api/alerts?state=active").then(r => r.json()).then(alerts => {
            if (!Array.isArray(alerts)) return;
            const n = alerts.length;
            badge.textContent = n;
            if (n === 0) { badge.className = "empty"; return; }
            const hasCritical = alerts.some(a => a.severity === "critical");

            badge.className = hasCritical ? "critical" : hasWarning ? "warning" : "";
        }).catch(() => { badge.className = "empty"; });
    }
    document.addEventListener("tars-event", function (e) {
        if (e.detail && e.detail.type && e.detail.type.startsWith("alert.")) {
            updateAlertBadge();
        }
