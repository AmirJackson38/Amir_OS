        };
        document.addEventListener("tars-events-connected", this._homeUpdate);
        document.addEventListener("tars-events-disconnected", this._homeUpdate);
    },

    renderInfra(el) {
        if (this._infraTimer) { clearInterval(this._infraTimer); this._infraTimer = null; }
        if (this._infraHandler) { document.removeEventListener("tars-event", this._infraHandler); this._infraHandler = null; }
        let tarsDockerContainers = [];
        let tarsNetworkHosts = [];

        function setVal(id, val) {
            const e = document.getElementById(id);
            if (e) e.querySelector(".tars-data-value").textContent = val;
        }

        function updateMetrics(data) {
            if (data.cpu !== undefined) setVal("tars-infra-cpu", data.cpu + "%");
            if (data.mem !== undefined) setVal("tars-infra-mem", data.mem + "%");
            if (data.disk !== undefined) setVal("tars-infra-disk", data.disk + "%");
            if (data.temp !== undefined) setVal("tars-infra-temp", data.temp + "°C");
            if (data.uptime !== undefined) {
                const h = Math.floor(data.uptime / 3600);
                const m = Math.floor((data.uptime % 3600) / 60);
                setVal("tars-infra-uptime", h + "h " + m + "m");
            }
            if (data.services !== undefined) setVal("tars-infra-services", data.services);
        }

        function renderAlertList(alerts) {
            const list = document.getElementById("tars-alert-list");
            if (!list) return;
            if (!alerts || alerts.length === 0) {
                list.innerHTML = '<div class="tars-data-row tars-data-row-empty"><span class="tars-data-label" style="color:rgba(210,235,255,0.2)">No active alerts</span></div>';
                return;
            }
            const colors = { critical: "#f87171", warning: "#eab308", info: "#5fd0ff" };
            const labels = { critical: "CRIT", warning: "WARN", info: "INFO" };
            let html = "";
            for (const a of alerts) {
                const color = colors[a.severity] || "rgba(210,235,255,0.3)";
                const time = a.createdAt ? new Date(a.createdAt).toLocaleTimeString() : "";
                html += '<div class="tars-data-row" style="border-left:2px solid ' + color + ';padding-left:6px;margin:2px 0">' +
                    '<span class="tars-data-label"><span style="color:' + color + ';font-weight:bold">' + (labels[a.severity] || a.severity) + '</span> ' +
                    a.title + (a.count > 1 ? ' <span style="color:rgba(210,235,255,0.2)">(x' + a.count + ')</span>' : '') + '</span>' +
                    '<span class="tars-data-value" style="font-size:8px;color:rgba(210,235,255,0.3)">' + time + '</span>' +
                '</div>';
                if (a.message) {
                    html += '<div class="tars-data-row" style="border-left:2px solid ' + color + ';padding:0 0 4px 10px;font-size:8px;color:rgba(210,235,255,0.3)">' +
                        a.message + '</div>';
                }
            }
            list.innerHTML = html;
        }

        function fetchAlerts() {
            fetch("/api/alerts?state=active").then(r => r.json()).then(alerts => {
                if (Array.isArray(alerts)) renderAlertList(alerts);
            }).catch(() => {});
        }

        function renderDockerSummary(summary) {
            const sumEl = document.getElementById("tars-docker-summary");
            const listEl = document.getElementById("tars-docker-list");
            if (!sumEl) return;
            if (!summary) {
                sumEl.querySelector(".tars-data-value").textContent = "No Docker";
                sumEl.querySelector(".tars-data-value").style.color = "rgba(210,235,255,0.2)";
                if (listEl) listEl.innerHTML = "";
                return;
            }
            const crashed = summary.crashed || 0;
            const stopped = summary.stopped || 0;
            const running = summary.running || 0;
            const total = summary.total || 0;
            const color = crashed > 0 ? "#f87171" : total === 0 ? "rgba(210,235,255,0.2)" : "#5fd0ff";
            sumEl.querySelector(".tars-data-value").textContent = running + " running, " + stopped + " stopped" + (crashed > 0 ? ", " + crashed + " crashed" : "");
            sumEl.querySelector(".tars-data-value").style.color = color;
        }

        function renderDockerContainerList(containers) {
            const listEl = document.getElementById("tars-docker-list");
            if (!listEl) return;
            if (!containers || containers.length === 0) {
                listEl.innerHTML = "";
                return;
            }
            let html = "";
            const stateColors = { running: "#4ade80", exited: "rgba(210,235,255,0.2)", created: "rgba(210,235,255,0.2)", paused: "#eab308", restarting: "#f87171", removing: "#f87171", removed: "rgba(210,235,255,0.1)", dead: "#f87171" };
            for (const c of containers) {
                if (c.state === "removed") continue;
                const color = stateColors[c.state] || "rgba(210,235,255,0.3)";
                const uptime = c.uptimeSeconds ? Math.floor(c.uptimeSeconds / 60) + "m" : "";
                html += '<div class="tars-data-row" style="padding-left:6px">' +
                    '<span class="tars-data-label" style="font-size:9px"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:' + color + ';margin-right:4px;vertical-align:middle"></span>' + c.name + '</span>' +
                    '<span class="tars-data-value" style="font-size:8px;color:' + color + '">' + c.state + (uptime ? " " + uptime : "") + '</span>' +
                '</div>';
            }
            listEl.innerHTML = html;
        }

        function fetchDocker() {
            fetch("/api/events?count=50&type=infra.docker.summary").then(r => r.json()).then(events => {
                if (!Array.isArray(events) || events.length === 0) { renderDockerSummary(null); return; }
                renderDockerSummary(events[events.length - 1].data);
            }).catch(() => { renderDockerSummary(null); });
            fetch("/api/events?count=100&type=infra.docker.container").then(r => r.json()).then(events => {
                if (!Array.isArray(events) || events.length === 0) return;
                const seen = {};
                for (const e of events) { seen[e.data.name] = e.data; }
                tarsDockerContainers = Object.values(seen);
                renderDockerContainerList(tarsDockerContainers);
            }).catch(() => {});
        }

        function renderNetworkSummary(summary) {
            const sumEl = document.getElementById("tars-network-summary");
            if (!sumEl) return;
            if (!summary || summary.total === 0) {
                sumEl.querySelector(".tars-data-value").textContent = "No network data";
                sumEl.querySelector(".tars-data-value").style.color = "rgba(210,235,255,0.2)";
                return;
            }
            const color = summary.offline > 0 ? "#f87171" : "#4ade80";
            const text = summary.online + "/" + summary.total + " online" + (summary.avgLatencyMs !== null ? "  avg " + summary.avgLatencyMs + "ms" : "");
            sumEl.querySelector(".tars-data-value").textContent = text;
            sumEl.querySelector(".tars-data-value").style.color = color;
        }

        function renderNetworkHostList(hosts) {
            const listEl = document.getElementById("tars-network-list");
            if (!listEl) return;
            if (!hosts || hosts.length === 0) { listEl.innerHTML = ""; return; }
            let html = "";
            for (const h of hosts) {
                const color = h.reachable ? "#4ade80" : "#f87171";
                const latency = h.latencyMs !== null && h.latencyMs !== undefined ? h.latencyMs + "ms" : "—";
                html += '<div class="tars-data-row" style="padding-left:6px">' +
                    '<span class="tars-data-label" style="font-size:9px"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:' + color + ';margin-right:4px;vertical-align:middle"></span>' + h.host + '</span>' +
                    '<span class="tars-data-value" style="font-size:8px;color:' + color + '">' + (h.reachable ? "online " + latency : "offline") + '</span>' +
                '</div>';
            }
            listEl.innerHTML = html;
        }

        function fetchNetwork() {
            fetch("/api/events?count=50&type=infra.network.summary").then(r => r.json()).then(events => {
                if (!Array.isArray(events) || events.length === 0) { renderNetworkSummary(null); return; }
                renderNetworkSummary(events[events.length - 1].data);
            }).catch(() => { renderNetworkSummary(null); });
            fetch("/api/events?count=100&type=infra.network.host").then(r => r.json()).then(events => {
                if (!Array.isArray(events) || events.length === 0) return;
                const seen = {};
                for (const e of events) { seen[e.data.host] = e.data; }
                tarsNetworkHosts = Object.values(seen);
                renderNetworkHostList(tarsNetworkHosts);
            }).catch(() => {});
        }

        function fetchMetrics() {
            fetch("/api/events?count=50").then(r => r.json()).then(events => {
                if (!Array.isArray(events)) return;
                const cpu = events.filter(e => e.type === "health.cpu").pop();
                const mem = events.filter(e => e.type === "health.memory").pop();
                const disk = events.filter(e => e.type === "health.disk").pop();
                const uptime = events.filter(e => e.type === "health.uptime").pop();
                const service = events.filter(e => e.type === "system.heartbeat").pop();
                updateMetrics({
                    cpu: cpu?.data?.percent,
                    mem: mem?.data?.percent,
                    disk: disk?.data?.percent,
                    temp: cpu?.data?.tempC,
                    uptime: uptime?.data?.uptimeSeconds,
                    services: service?.data?.services ? service.data.services.filter(s => s.status !== "stale").length + " online" : undefined
                });
            }).catch(() => {});
        }

        el.innerHTML =
            '<div class="tars-section">' +
                '<div class="tars-section-title">Infrastructure</div>' +
                '<div id="tars-infra-cpu" class="tars-data-row"><span class="tars-data-label">CPU</span><span class="tars-data-value">—</span></div>' +
                '<div id="tars-infra-mem" class="tars-data-row"><span class="tars-data-label">Memory</span><span class="tars-data-value">—</span></div>' +
                '<div id="tars-infra-disk" class="tars-data-row"><span class="tars-data-label">Disk</span><span class="tars-data-value">—</span></div>' +
                '<div id="tars-infra-temp" class="tars-data-row"><span class="tars-data-label">Temperature</span><span class="tars-data-value">—</span></div>' +
                '<div id="tars-infra-uptime" class="tars-data-row"><span class="tars-data-label">Uptime</span><span class="tars-data-value">—</span></div>' +
                '<div id="tars-infra-services" class="tars-data-row"><span class="tars-data-label">Services</span><span class="tars-data-value">—</span></div>' +
            '</div>' +
            '<div class="tars-section">' +
                '<div class="tars-section-title">Docker Containers</div>' +
                '<div id="tars-docker-summary" class="tars-data-row"><span class="tars-data-label">Containers</span><span class="tars-data-value" style="color:rgba(210,235,255,0.2)">No Docker</span></div>' +
                '<div id="tars-docker-list"></div>' +
            '</div>' +
            '<div class="tars-section">' +
                '<div class="tars-section-title">Network</div>' +
                '<div id="tars-network-summary" class="tars-data-row"><span class="tars-data-label">Hosts</span><span class="tars-data-value" style="color:rgba(210,235,255,0.2)">No network data</span></div>' +
                '<div id="tars-network-list"></div>' +
            '</div>' +
            '<div class="tars-section">' +
                '<div class="tars-section-title">Alerts</div>' +
                '<div id="tars-alert-list"><div class="tars-data-row tars-data-row-empty"><span class="tars-data-label" style="color:rgba(210,235,255,0.2)">No active alerts</span></div></div>' +
            '</div>';

        fetchMetrics();
        fetchAlerts();
        fetchDocker();
        fetchNetwork();
        this._infraTimer = setInterval(function () {
            fetchMetrics();
            fetchAlerts();
            fetchDocker();
            fetchNetwork();
        }, 10000);

        this._infraHandler = function (e) {
            const ev = e.detail;
            if (!ev || !ev.type) return;
            if (ev.type === "health.cpu") {
                if (ev.data.percent !== undefined) setVal("tars-infra-cpu", ev.data.percent + "%");
                if (ev.data.tempC !== undefined) setVal("tars-infra-temp", ev.data.tempC + "°C");
            }
            if (ev.type === "health.memory" && ev.data.percent !== undefined) setVal("tars-infra-mem", ev.data.percent + "%");
            if (ev.type === "health.disk" && ev.data.percent !== undefined) {
                const diskEl = document.getElementById("tars-infra-disk");
                if (diskEl) diskEl.querySelector(".tars-data-value").textContent = ev.data.percent + "% (" + ev.data.device + ")";
            }
            if (ev.type === "health.uptime" && ev.data.uptimeSeconds !== undefined) {
                const h = Math.floor(ev.data.uptimeSeconds / 3600);
                const m = Math.floor((ev.data.uptimeSeconds % 3600) / 60);
                setVal("tars-infra-uptime", h + "h " + m + "m");
            }
            if (ev.type === "system.heartbeat" && ev.data.services) {
                const online = ev.data.services.filter(s => s.status !== "stale").length;
                setVal("tars-infra-services", online + " online");
            }
            if (ev.type.startsWith("alert.")) fetchAlerts();
            if (ev.type === "infra.docker.summary") renderDockerSummary(ev.data);
            if (ev.type === "infra.docker.container") {
                const c = ev.data;
                let updated = false;
                for (let i = 0; i < tarsDockerContainers.length; i++) {
                    if (tarsDockerContainers[i].name === c.name) {
                        if (c.state === "removed") { tarsDockerContainers.splice(i, 1); }
                        else { tarsDockerContainers[i] = c; }
                        updated = true; break;
                    }
                }
                if (!updated && c.state !== "removed") { tarsDockerContainers.push(c); }
                renderDockerContainerList(tarsDockerContainers);
            }
            if (ev.type === "infra.network.summary") renderNetworkSummary(ev.data);
            if (ev.type === "infra.network.host") {
                const h = ev.data;
                let updated = false;
                for (let i = 0; i < tarsNetworkHosts.length; i++) {
                    if (tarsNetworkHosts[i].host === h.host) {
                        tarsNetworkHosts[i] = h;
                        updated = true; break;
                    }
                }
                if (!updated) { tarsNetworkHosts.push(h); }
                renderNetworkHostList(tarsNetworkHosts);
            }
        };
        document.addEventListener("tars-event", this._infraHandler);
    },

    renderSystem(el) {
        el.innerHTML =
            '<div class="tars-section">' +
                '<div class="tars-section-title">System</div>' +
                '<div class="tars-data-row"><span class="tars-data-label">TARS Face</span><span class="tars-data-value">v7.5</span></div>' +
                '<div class="tars-data-row"><span class="tars-data-label">Runtime Server</span><span class="tars-data-value" id="tars-sys-runtime">—</span></div>' +
                '<div class="tars-data-row"><span class="tars-data-label">Event Bus</span><span class="tars-data-value" id="tars-sys-events">—</span></div>' +
                '<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">' +
                    '<button class="btn btn-sm" data-action="open-dev-tool" data-tab="brain">🧠 Brain</button>' +
                    '<button class="btn btn-sm" data-action="open-dev-tool" data-tab="observatory">📊 Observatory</button>' +
                    '<button class="btn btn-sm" data-action="open-dev-tool" data-tab="journal">📜 Journal</button>' +
                    '<button class="btn btn-sm" data-action="open-dev-tool" data-tab="settings">⚙ Creator Console</button>' +
                '</div>' +
            '</div>';

        fetch("/health").then(r => r.json()).then(h => {
            const el2 = document.getElementById("tars-sys-runtime");
            if (el2) el2.textContent = "v0.1.0 · up " + Math.floor(h.uptime / 60) + "m";
            const el3 = document.getElementById("tars-sys-events");
            if (el3) el3.textContent = h.eventBus.published + " pub, " + h.eventBus.subscriberCount + " subs";
        }).catch(() => {
            const el2 = document.getElementById("tars-sys-runtime");
            if (el2) el2.textContent = "Offline";
        });
    }
};

// Chat API — placeholder, no LLM connection
window.TARS_CHAT = {
    history: [],
    send(msg) {
        if (!msg || !msg.trim()) return;
        this.history.push({ role: "user", text: msg, time: Date.now() });
        const container = document.getElementById("tars-chat-messages");
        if (container) {
            const el = document.createElement("div");
            el.className = "tars-msg user";
            el.textContent = msg;
            container.appendChild(el);
            container.scrollTop = container.scrollHeight;
        }
        console.log(`[TARS CHAT] User: ${msg}`);
        const reply = "🧠 TARS cognitive system offline. Message logged for future LLM connection.";
        setTimeout(() => {
            this.history.push({ role: "tars", text: reply, time: Date.now() });
            if (container) {
                const el = document.createElement("div");
                el.className = "tars-msg tars";
                el.textContent = reply;
                container.appendChild(el);
                container.scrollTop = container.scrollHeight;
            }
            console.log(`[TARS CHAT] TARS: ${reply}`);
        }, 600);
    }
};

// Wire up UI elements
function initObservatoryUI() {
    const toolbarBtns = document.querySelectorAll(".tars-tab-btn");
    toolbarBtns.forEach(btn => {
        btn.addEventListener("click", () => {
            TARS_UI.openTab(btn.dataset.tab);
        });
    });

    document.getElementById("tars-overlay-close").addEventListener("click", () => TARS_UI.closeOverlay());
    document.getElementById("tars-chat-close").addEventListener("click", () => TARS_UI.toggleChat());

    document.getElementById("tars-chat-send").addEventListener("click", () => {
        const input = document.getElementById("tars-chat-input-field");
        window.TARS_CHAT.send(input.value);
        input.value = "";
    });
    document.getElementById("tars-chat-input-field").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            document.getElementById("tars-chat-send").click();
        }
    });

    // Creator Console event delegation
    const overlayBody = document.getElementById("tars-overlay-body");
    overlayBody.addEventListener("click", (e) => {
        const fb = document.getElementById("creator-feedback");
        const setFb = (msg, color) => { if (fb) { fb.textContent = msg; fb.style.color = color || "#4ade80"; } };

        // Collapse toggle
        const header = e.target.closest(".tars-collapse-header");
        if (header) {
            const key = header.dataset.collapse;
            const body = document.getElementById("collapse-" + key);
            if (body) {
                body.classList.toggle("collapsed");
                const arrow = header.querySelector(".arrow");
                if (arrow) arrow.textContent = body.classList.contains("collapsed") ? "▶" : "▼";
                if (body.classList.contains("collapsed")) {
                    TARS_UI.collapsedSections.add(key);
                } else {
                    TARS_UI.collapsedSections.delete(key);
                }
            }
            return;
        }

        const action = e.target.dataset.action;
        if (!action) return;

        switch (action) {
            // System Controls
            case "pause":
                window.TARS_CONTROL.setMode("llm");
                setFb("⏸ Autonomy paused (LLM mode)", "#f87171");
                break;
            case "resume":
                window.TARS_CONTROL.setMode("autonomous");
                setFb("▶ Autonomy resumed", "#4ade80");
                break;
            case "force-decision":
                window.TARS_AUTONOMY.forceDecision();
                setFb("⚡ Decision cycle forced", "#5fd0ff");
                break;
            case "trigger-wander":
                worldState.tars.lastWanderTime = 0;
                window.TARS_AUTONOMY.setNeed("curiosity", 0.1);
                window.TARS_AUTONOMY.forceDecision();
                setFb("🧭 Wander primed + decision forced", "#a78bfa");
                break;
            case "reset-state":
                ["energy","curiosity","social","maintenance","comfort","hunger"].forEach(n => window.TARS_AUTONOMY.setNeed(n, 0.5));
                worldState.tars.activityFatigue = {};
                worldState.tars.continuationCount = 0;
                window.TARS_AUTONOMY.clearAutonomyHistory();
                setFb("🔄 State reset (needs→50%, fatigue cleared, history cleared)", "#fb923c");
                break;
            case "set-mode":
                if (window.TARS.setMode) window.TARS.setMode(e.target.dataset.mode);
                else console.warn("TARS.setMode not available");
                break;
            case "set-control":
                window.TARS_CONTROL.setMode(e.target.dataset.mode);
                break;
            case "release-control":
                if (window.TARS.releaseControl) window.TARS.releaseControl();
                else window.TARS_CONTROL.release();
                setFb("↩ Control released to autonomous", "#4ade80");
                break;

            // Environment Controls
            case "set-weather":
                TARS_setWeather(e.target.dataset.condition);
                setFb(`Weather: ${e.target.dataset.condition}`, "#5fd0ff");
                break;
            case "set-time":
                TARS_setTimeOfDay(e.target.dataset.preset);
                setFb(`Time: ${e.target.dataset.preset}`, "#5fd0ff");
                break;
            case "set-temp":
                TARS_setTemperature(parseFloat(e.target.dataset.delta));
                setFb(`Temperature adjusted`, "#5fd0ff");
                break;
            case "set-wind":
                TARS_setWind(e.target.dataset.intensity);
                setFb(`Wind: ${e.target.dataset.intensity}`, "#5fd0ff");
                break;

            // Rendering
            case "set-profile":
                TARS_setRenderProfile(e.target.dataset.profile);
                break;

            // Movement
            case "go-to":
                TARS_goTo(e.target.dataset.target);
                setFb(`Moving to: ${e.target.dataset.target}`, "#a78bfa");
                break;

            // Debug
            case "toggle-debug": {
                const lsKey = e.target.dataset.lskey;
                const feature = e.target.dataset.feature;
                TARS_toggleDebug(feature, lsKey);
                const isOn = localStorage.getItem(lsKey) === "true";
                setFb(`Debug: ${feature} → ${isOn ? "ON" : "OFF"}`, isOn ? "#4ade80" : "#f87171");
                break;
            }

            // Testing sections
            case "inject-need": {
                const need = e.target.dataset.need;
                const delta = parseFloat(e.target.dataset.delta);
                const cur = worldState.tars.needs[need] !== undefined ? worldState.tars.needs[need] : 0.5;
                const newVal = Math.max(0, Math.min(1, cur + delta));
                window.TARS_AUTONOMY.setNeed(need, newVal);
                const valEl = document.querySelector(`[data-need-val="${need}"]`);
                if (valEl) valEl.textContent = (newVal * 100).toFixed(0) + "%";
                setFb(`Need "${need}" → ${(newVal * 100).toFixed(0)}%`, "");
                break;
            }
            case "trigger-behavior":
                window.TARS.trigger(e.target.dataset.preset);
                setFb(`Behavior: ${e.target.dataset.preset}`, "");
                break;
            case "test-behavior": {
                const behaviorMap = {
                    excited: {emotion:"excited", intensity:0.8, energy:0.9, urgency:0.7, gesture:"pulse", gaze:"user"},
                    thinking: {emotion:"thinking", intensity:0.4, energy:0.3, urgency:0.1, gesture:"nod", gaze:"desk"},
                    warning: {emotion:"warning", intensity:0.9, energy:0.8, urgency:0.9, gesture:"expand", gaze:"rack-a"}
                };
                const b = behaviorMap[e.target.dataset.behavior];
                if (b && window.TARS.setBehavior) window.TARS.setBehavior(b);
                setFb(`LLM Intent: ${e.target.dataset.behavior}`, "");
                break;
            }
            case "trigger-gesture":
                window.TARS.triggerGesture(e.target.dataset.gesture);
                setFb(`Gesture: ${e.target.dataset.gesture}`, "");
                break;
            case "test-activity":
                if (window.setTARSActivity) {
                    window.setTARSActivity(e.target.dataset.activity, e.target.dataset.location, "test_injection");
                }
                setFb(`Activity: ${e.target.dataset.activity} @ ${e.target.dataset.location}`, "");
                break;
            case "look-at":
                window.TARS.lookAt(e.target.dataset.target, "test_injection");
                setFb(`Gaze: ${e.target.dataset.target}`, "");
                break;
            case "open-dev-tool":
                if (e.target.dataset.tab && window.TARS_UI) {
                    TARS_UI.openTab(e.target.dataset.tab);
                }
                break;
        }
        setTimeout(() => { if (fb) fb.textContent = ""; }, 3000);
    });

    // Journal entry expand/collapse toggle
    overlayBody.addEventListener("click", (e) => {
        const entry = e.target.closest(".tars-journal-entry");
        if (entry) {
            const detail = entry.querySelector(".tars-journal-detail");
            if (detail) detail.classList.toggle("open");
        }
    });

    TARS_UI.updateStatusHeader();

    // PHASE 7.4.5: Developer Observatory — F3 or Ctrl+Shift+D toggles the overlay.
    document.addEventListener("keydown", (e) => {
        const isObservatoryKey =
            e.key === "F3" ||
            (e.ctrlKey && e.shiftKey && (e.key === "D" || e.key === "d"));
        if (!isObservatoryKey) return;
        if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
        e.preventDefault();
        if (TARS_UI.activeTab === "observatory" && TARS_UI.overlayVisible) {
            TARS_UI.closeOverlay();
        } else {
            TARS_UI.openTab("observatory");
        }
    });

    console.log("[TARS OBSERVATORY] Phase 7.4 UI initialized. Press 🧠📊📜💬⚙ or F3 / Ctrl+Shift+D to open panels.");
}

// ============================================================
// [DEBUG] Creator Console Handler Functions
// Module-level functions for environment, movement, rendering, debug actions.
// ============================================================

function TARS_setWeather(condition) {
    worldState.environment.weather.condition = condition;
    worldState.environment.lastWeatherChange = Date.now();
    if (window.weatherVisualEngine && weatherVisualEngine.updateFromWeatherState) {
        weatherVisualEngine.updateFromWeatherState();
    }
}

function TARS_setTimeOfDay(preset) {
    const times = { dawn: 6, morning: 9, noon: 12, dusk: 18, night: 22 };
    const hour = times[preset] || 12;
    worldState.environment.timeOfDay = hour;
    if (typeof updateDayNight === "function") updateDayNight();
}

function TARS_setTemperature(delta) {
    const cur = worldState.environment.temperature || 22;
    worldState.environment.temperature = Math.max(-10, Math.min(50, cur + delta));
    const el = document.getElementById("env-temp");
    if (el) el.textContent = worldState.environment.temperature;
}

function TARS_setWind(intensity) {
    const speedMap = { calm: 0, light: 5, moderate: 15, strong: 30, gale: 55 };
    worldState.environment.weather.wind = { intensity, direction: 270, speed: speedMap[intensity] || 15 };
    if (window.weatherVisualEngine && weatherVisualEngine.applyWind) {
        weatherVisualEngine.applyWind(intensity);
    }
}

function TARS_setRenderProfile(profile) {
    localStorage.setItem("TARS_RENDER_PROFILE", profile);
    document.querySelectorAll(".tars-profile-opt").forEach(el => {
        el.classList.toggle("active", el.dataset.profile === profile);
    });
    const lbl = document.getElementById("render-profile-label");
    if (lbl) lbl.textContent = profile.replace("_", " ");
    window.location.reload();
}

function TARS_goTo(target) {
    const pos = TARGET_POSITIONS[target] || TARGET_POSITIONS.user;
    if (window.TARS && TARS.moveTo) {
        TARS.moveTo(pos.clone());
        TARS.lookAt(target, "creator_console");
    }
}

function TARS_toggleDebug(feature, lsKey) {
    const newVal = localStorage.getItem(lsKey) !== "true";
    localStorage.setItem(lsKey, newVal ? "true" : "false");
    if (feature === "collision-volumes" || feature === "zone-boundaries" || feature === "avoidance-vectors") {
        if (window.TARS_DEBUG && TARS_DEBUG.rebuild) {
            TARS_DEBUG.rebuild();
        } else {
            window.location.reload();
        }
    }
}

initObservatoryUI();

// Hook throttled UI refresh into animate loop via patched setInterval
// Instead of modifying animate(), we run a separate timer
setInterval(() => TARS_UI.throttledUpdate(Date.now()), 400);

// Phase 8.1 — Event Bus WebSocket Client
// Connects to TARS runtime server. Silently degrades if server is unavailable.
(function () {
    const WS_URL = (() => {
        const loc = window.location;
        const proto = loc.protocol === "https:" ? "wss:" : "ws:";
        return `${proto}//${loc.host}/ws`;
    })();
    let ws = null;
    let reconnectTimer = null;
    let connected = false;

    const RECONNECT_DELAYS = [1000, 2000, 5000, 10000, 30000];
    let reconnectAttempt = 0;

    function connect() {
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
        try {
            ws = new WebSocket(WS_URL);
        } catch (e) {
            scheduleReconnect();
            return;
        }
        ws.onopen = () => {
            connected = true;
            reconnectAttempt = 0;
            console.log("[TARS EVENTS] Connected to event bus");
            document.dispatchEvent(new CustomEvent("tars-events-connected"));
        };
        ws.onmessage = (msg) => {
            try {
                const event = JSON.parse(msg.data);
                if (event.type !== "system.heartbeat") {
                    console.log("[TARS EVENTS]", event.type, event.source, event.data);
                }
                document.dispatchEvent(new CustomEvent("tars-event", { detail: event }));
            } catch (e) {
                console.warn("[TARS EVENTS] Failed to parse message:", e);
            }
        };
        ws.onclose = () => {
            connected = false;
            ws = null;
            console.log("[TARS EVENTS] Disconnected");
            document.dispatchEvent(new CustomEvent("tars-events-disconnected"));
            scheduleReconnect();
        };
        ws.onerror = () => {
            // onclose will fire after onerror, triggering reconnect
        };
    }

    function scheduleReconnect() {
        if (reconnectTimer) return;
        const delay = RECONNECT_DELAYS[Math.min(reconnectAttempt, RECONNECT_DELAYS.length - 1)];
        reconnectAttempt++;
        reconnectTimer = setTimeout(() => {
            reconnectTimer = null;
            connect();
        }, delay);
    }

    window.TARS_EVENTS = {
        isConnected: () => connected,
        send(event) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(event));
                return true;
            }
            return false;
        },
        connect,
        disconnect() {
            if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
            if (ws) { ws.onclose = null; ws.close(); ws = null; }
            connected = false;
        }
    };

    if (window.location.host && window.location.host !== "") {
        connect();
    }
})();

// ── Connection Indicator ──
(function () {
    const dot = document.getElementById("tars-connection-dot");
    if (!dot) return;
    function set(state) {
        dot.className = state;
        dot.title = { connecting:"Connecting...", connected:"Event bus connected", disconnected:"Event bus disconnected", unknown:"No server" }[state] || "Unknown";
    }
    document.addEventListener("tars-events-connected", () => set("connected"));
    document.addEventListener("tars-events-disconnected", () => set("disconnected"));
    if (window.TARS_EVENTS && window.TARS_EVENTS.isConnected()) set("connected");
    else if (window.location.host) set("connecting");
})();

// ── Alert Count Badge ──
(function () {
    function update() {
        const badge = document.getElementById("tars-alert-count");
        if (!badge) return;
        fetch("/api/alerts?state=active").then(r => r.json()).then(alerts => {
            if (!Array.isArray(alerts)) return;
            const n = alerts.length;
            badge.textContent = n;
            if (n === 0) { badge.className = "empty"; return; }
            const hasCritical = alerts.some(a => a.severity === "critical");
            const hasWarning = alerts.some(a => a.severity === "warning");
            badge.className = hasCritical ? "critical" : hasWarning ? "warning" : "";
        }).catch(() => { badge.className = "empty"; });
    }
    document.addEventListener("tars-event", function (e) {
        if (e.detail && e.detail.type && e.detail.type.startsWith("alert.")) update();
    });
    update();
})();
