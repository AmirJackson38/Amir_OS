<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T.A.R.S. World v0.4 — Embodiment System</title>

<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070a;
        font-family: Arial, sans-serif;
    }

    #scene { position: fixed; inset: 0; }

    #hud {
        position: fixed;
        top: 20px;
        left: 24px;
        z-index: 10;
        color: rgba(210, 235, 255, 0.75);
        pointer-events: none;
        text-shadow: 0 0 12px rgba(80, 180, 255, 0.6);
    }

    #hud .title { font-size: 13px; letter-spacing: 5px; font-weight: bold; }
    #hud .status { margin-top: 8px; font-size: 10px; letter-spacing: 2px; opacity: 0.65; }

    #status {
        position: fixed;
        bottom: 20px;
        left: 24px;
        z-index: 10;
        color: rgba(170, 210, 235, 0.55);
        font-size: 10px;
        letter-spacing: 2px;
        pointer-events: none;
    }

    #hint {
        position: fixed;
        bottom: 20px;
        right: 24px;
        z-index: 10;
        color: rgba(170, 210, 235, 0.35);
        font-size: 9px;
        letter-spacing: 1px;
        pointer-events: none;
    }

    /* T.A.R.S. Interactive Control Console */
    #tars-controls {
        position: fixed;
        top: 20px;
        right: 24px;
        z-index: 20;
        background: rgba(10, 16, 24, 0.85);
        border: 1px solid rgba(80, 180, 255, 0.3);
        border-radius: 8px;
        padding: 14px;
        width: 310px;
        color: #d2ebff;
        font-size: 11px;
        backdrop-filter: blur(8px);
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        max-height: 90vh;
        overflow-y: auto;
    }

    #tars-controls h3 {
        margin: 0 0 10px 0;
        font-size: 12px;
        letter-spacing: 3px;
        color: #5fd0ff;
        border-bottom: 1px solid rgba(80, 180, 255, 0.2);
        padding-bottom: 6px;
    }

    .ctrl-group { margin-bottom: 10px; }
    .ctrl-group label { display: block; margin-bottom: 4px; color: rgba(210, 235, 255, 0.7); }

    .ctrl-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }

    .btn {
        background: rgba(20, 35, 50, 0.8);
        border: 1px solid rgba(80, 180, 255, 0.3);
        color: #9fe6ff;
        padding: 6px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 10px;
        letter-spacing: 1px;
        transition: all 0.2s ease;
    }

    .btn:hover {
        background: rgba(40, 80, 120, 0.9);
        border-color: #5fd0ff;
        color: #fff;
        box-shadow: 0 0 8px rgba(95, 208, 255, 0.4);
    }

    .btn.active {
        background: #1b5e8c;
        border-color: #5fd0ff;
        color: #ffffff;
        font-weight: bold;
    }

    input[type=range] {
        width: 100%;
        accent-color: #5fd0ff;
    }

    .status-badge {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 3px;
        font-weight: bold;
        background: rgba(0, 170, 255, 0.2);
        color: #5fd0ff;
        border: 1px solid rgba(0, 170, 255, 0.4);
    }
</style>
</head>

<body>

<div id="scene"></div>

<div id="hud">
    <div class="title">T.A.R.S. // WORLD</div>
    <div class="status">EMBODIMENT ENGINE // ACTIVE</div>
</div>

<div id="status">EMOTION: <span id="current-emotion" class="status-badge">IDLE</span> | MODE: <span id="current-mode" class="status-badge">LIVE</span></div>
<div id="hint">MOVE POINTER TO EXPLORE</div>

<!-- Developer / Live Controller Panel -->
<div id="tars-controls">
    <h3>T.A.R.S. BEHAVIOR CONSOLE</h3>
    
    <div class="ctrl-group">
        <label>SYSTEM MODE</label>
        <div class="ctrl-buttons">
            <button class="btn active" id="btn-mode-live" onclick="window.TARS.setMode('live')">LIVE MODE</button>
            <button class="btn" id="btn-mode-demo" onclick="window.TARS.setMode('demo')">DEMO FLIGHT</button>
        </div>
    </div>

    <div class="ctrl-group">
        <label>BEHAVIOR PRESETS</label>
        <div class="ctrl-buttons">
            <button class="btn" onclick="window.TARS.trigger('idle')">IDLE</button>
            <button class="btn" onclick="window.TARS.trigger('listen')">LISTEN</button>
            <button class="btn" onclick="window.TARS.trigger('think')">THINK</button>
            <button class="btn" onclick="window.TARS.trigger('speak')">SPEAK</button>
            <button class="btn" onclick="window.TARS.trigger('sarcastic')">SARCASTIC</button>
            <button class="btn" onclick="window.TARS.trigger('amused')">AMUSED</button>
            <button class="btn" onclick="window.TARS.trigger('confused')">CONFUSED</button>
            <button class="btn" onclick="window.TARS.trigger('serious')">SERIOUS</button>
            <button class="btn" onclick="window.TARS.trigger('warning')">WARNING</button>
            <button class="btn" onclick="window.TARS.trigger('critical')">CRITICAL</button>
            <button class="btn" onclick="window.TARS.trigger('celebrate')">CELEBRATE</button>
            <button class="btn" onclick="window.TARS.trigger('chill')">CHILL</button>
            <button class="btn" onclick="window.TARS.trigger('disapproving')">DISAPPROVING</button>
            <button class="btn" onclick="window.TARS.trigger('excited')">EXCITED</button>
        </div>
    </div>

    <div class="ctrl-group">
        <label>GAZE / ATTENTION TARGET</label>
        <div class="ctrl-buttons">
            <button class="btn" onclick="window.TARS.lookAt('user')">USER</button>
            <button class="btn" onclick="window.TARS.lookAt('desk')">DESK</button>
            <button class="btn" onclick="window.TARS.lookAt('rack-a')">RACK A</button>
            <button class="btn" onclick="window.TARS.lookAt('window_left')">WINDOW LEFT</button>
            <button class="btn" onclick="window.TARS.lookAt('window_right')">WINDOW RIGHT</button>
        </div>
    </div>

    <div class="ctrl-group">
        <label>SPEECH REACTIVITY</label>
        <div class="ctrl-buttons">
            <button class="btn" onclick="window.TARS.onSpeechStart()">SPEECH START</button>
            <button class="btn" onclick="window.TARS.onSpeechEnd()">SPEECH END</button>
        </div>
    </div>

    <div class="ctrl-group">
        <label>SPEECH AMPLITUDE: <span id="speech-amp-val">0</span></label>
        <input type="range" min="0" max="1" step="0.05" value="0" oninput="document.getElementById('speech-amp-val').innerText = this.value; window.TARS.setSpeechAmplitude(parseFloat(this.value));">
    </div>

<div class="ctrl-group">
        <label>SPEECH PITCH: <span id="speech-pitch-val">1.0</span></label>
        <input type="range" min="0.5" max="2" step="0.05" value="1" oninput="document.getElementById('speech-pitch-val').innerText = this.value; window.TARS.setSpeechPitch(parseFloat(this.value));">
    </div>

    <div class="ctrl-group">
        <label>ACTIVITY LOG</label>
        <div id="activity-log" style="max-height: 150px; overflow-y: auto; font-size: 11px; font-family: monospace; color: #8ab4f8;"></div>
    </div>
</div>

    <div class="ctrl-group">
        <label>GESTURE TESTS</label>
        <div class="ctrl-buttons">
            <button class="btn" onclick="window.TARS.triggerGesture('nod')">NOD</button>
            <button class="btn" onclick="window.TARS.triggerGesture('shake')">SHAKE</button>
            <button class="btn" onclick="window.TARS.triggerGesture('pulse')">PULSE</button>
            <button class="btn" onclick="window.TARS.triggerGesture('expand')">EXPAND</button>
            <button class="btn" onclick="window.TARS.triggerGesture('spin')">SPIN</button>
        </div>
    </div>

    <div class="ctrl-group">
        <label>CONTROL MODE: <span id="ctrl-mode-display">AUTO</span></label>
        <div class="ctrl-buttons">
            <button class="btn" onclick="window.TARS_CONTROL.setMode('autonomous'); document.getElementById('ctrl-mode-display').innerText='AUTO'">AUTO</button>
            <button class="btn" onclick="window.TARS_CONTROL.setMode('llm'); document.getElementById('ctrl-mode-display').innerText='LLM'">LLM</button>
            <button class="btn" onclick="window.TARS_CONTROL.release(); document.getElementById('ctrl-mode-display').innerText='AUTO'">RELEASE</button>
        </div>
    </div>

    <div class="ctrl-group">
        <label>LLM BEHAVIOR INTENT TEST</label>
        <div class="ctrl-buttons">
            <button class="btn" onclick="window.TARS.setBehavior({emotion:'excited', intensity:0.8, energy:0.9, urgency:0.7, gesture:'pulse', gaze:'user'})">EXCITED</button>
            <button class="btn" onclick="window.TARS.setBehavior({emotion:'thinking', intensity:0.4, energy:0.3, urgency:0.1, gesture:'nod', gaze:'desk'})">THINKING</button>
            <button class="btn" onclick="window.TARS.setBehavior({emotion:'warning', intensity:0.9, energy:0.8, urgency:0.9, gesture:'expand', gaze:'rack-a'})">WARNING</button>
        </div>
    </div>

    <div class="ctrl-group">
        <label>INTENSITY: <span id="intensity-val">0.5</span></label>
        <input type="range" min="0" max="1" step="0.05" value="0.5" oninput="document.getElementById('intensity-val').innerText = this.value; window.TARS.setIntensity(parseFloat(this.value));">
    </div>

    <div class="ctrl-group">
        <label>URGENCY: <span id="urgency-val">0.1</span></label>
        <input type="range" min="0" max="1" step="0.05" value="0.1" oninput="document.getElementById('urgency-val').innerText = this.value; window.TARS.setUrgency(parseFloat(this.value));">
    </div>
</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";

// ============================================================
// CORE
// ============================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020407);
scene.fog = new THREE.FogExp2(0x05080c, 0.035);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2.7, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.0));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById("scene").appendChild(renderer.domElement);

// ============================================================
// LIGHTING
// ============================================================

const ambientLight = new THREE.AmbientLight(0x263746, 1.2);
scene.add(ambientLight);

const blueLight = new THREE.PointLight(0x2d8cff, 18, 30);
blueLight.position.set(-3, 4, 2);
scene.add(blueLight);

const warmLight = new THREE.PointLight(0xff8b3d, 8, 12);
warmLight.position.set(2, 3, 1);
scene.add(warmLight);

const serverLight = new THREE.PointLight(0x00aaff, 10, 8);
serverLight.position.set(-4, 2, -2);
scene.add(serverLight);

// ============================================================
// HELPERS
// ============================================================

function material(color, roughness = 0.8, metalness = 0) {
    return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}

function glowMaterial(color) {
    return new THREE.MeshBasicMaterial({ color, toneMapped: false });
}

function makeCanvas(w, h) {
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    return { canvas, ctx: canvas.getContext("2d") };
}

function canvasTexture(draw, w = 512, h = 512) {
    const { canvas, ctx } = makeCanvas(w, h);
    draw(ctx, w, h);
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.needsUpdate = true;
    return tex;
}

function circleSpriteTexture() {
    return canvasTexture((ctx, w, h) => {
        const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
        g.addColorStop(0, "rgba(255,255,255,1)");
        g.addColorStop(0.4, "rgba(255,255,255,0.9)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
    }, 32, 32);
}
const dotSprite = circleSpriteTexture();

const animatedScreens = [];
function registerAnimatedScreen(w, h, drawFn, refreshRate = 0.12) {
    const { canvas, ctx } = makeCanvas(w, h);
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    const entry = { ctx, w, h, tex, drawFn, refreshRate, nextUpdate: 0 };
    animatedScreens.push(entry);
    return tex;
}

const room = new THREE.Group();
scene.add(room);

// ============================================================
// FLOOR / SIDE WALLS / CEILING
// ============================================================

const floor = new THREE.Mesh(new THREE.BoxGeometry(16, 0.3, 14), material(0x111820, 0.95));
floor.position.y = -0.15;
floor.receiveShadow = true;
room.add(floor);

const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 8, 14), material(0x0a1016, 0.95));
leftWall.position.set(-8, 4, 0);
leftWall.receiveShadow = true;
// REMOVED: solid leftWall - replaced by 4 segments with window opening below
// room.add(leftWall);

const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 8, 14), material(0x0a1016, 0.95));
rightWall.position.set(8, 4, 0);
rightWall.receiveShadow = true;
room.add(rightWall);

const ceiling = new THREE.Mesh(new THREE.BoxGeometry(16, 0.3, 14), material(0x070b10, 0.95));
ceiling.position.y = 8;
ceiling.receiveShadow = true;
room.add(ceiling);

// ============================================================
// BACK WALL WITH WINDOW OPENING
// ============================================================

const backWallMat = material(0x0c1219, 0.95);
const WIN_X = 2.5, WIN_Y = 4.2, WIN_W = 6, WIN_H = 4, WALL_Z = -6, WALL_THICK = 0.3;
const winLeft = WIN_X - WIN_W / 2;
const winRight = WIN_X + WIN_W / 2;
const winTop = WIN_Y + WIN_H / 2;
const winBottom = WIN_Y - WIN_H / 2;

// Left window constants
const LWIN_X = -7.5, LWIN_Y = 4.2, LWIN_W = 6, LWIN_H = 4, LEFT_WALL_X = -8, LEFT_WALL_THICK = 0.3;
const lwinLeft = LWIN_X - LWIN_W / 2;
const lwinRight = LWIN_X + LWIN_W / 2;
const lwinTop = LWIN_Y + LWIN_H / 2;
const lwinBottom = LWIN_Y - LWIN_H / 2;

const wallLeftSeg = new THREE.Mesh(new THREE.BoxGeometry(winLeft - (-8), 8, WALL_THICK), backWallMat);
wallLeftSeg.position.set((-8 + winLeft) / 2, 4, WALL_Z);
wallLeftSeg.receiveShadow = true;
room.add(wallLeftSeg);

const wallRightSeg = new THREE.Mesh(new THREE.BoxGeometry(8 - winRight, 8, WALL_THICK), backWallMat);
wallRightSeg.position.set((winRight + 8) / 2, 4, WALL_Z);
wallRightSeg.receiveShadow = true;
room.add(wallRightSeg);

const wallTopSeg = new THREE.Mesh(new THREE.BoxGeometry(WIN_W, 8 - winTop, WALL_THICK), backWallMat);
wallTopSeg.position.set(WIN_X, (winTop + 8) / 2, WALL_Z);
wallTopSeg.receiveShadow = true;
room.add(wallTopSeg);

const wallBottomSeg = new THREE.Mesh(new THREE.BoxGeometry(WIN_W, winBottom, WALL_THICK), backWallMat);
wallBottomSeg.position.set(WIN_X, winBottom / 2, WALL_Z);
wallBottomSeg.receiveShadow = true;
room.add(wallBottomSeg);

// ============================================================
// WINDOW FRAME + GLASS
// ============================================================

const windowFrame = new THREE.Group();
windowFrame.position.set(WIN_X, WIN_Y, WALL_Z + 0.22);
room.add(windowFrame);

const glass = new THREE.Mesh(
    new THREE.PlaneGeometry(WIN_W, WIN_H),
    new THREE.MeshPhysicalMaterial({
        color: 0x0b2233,
        transparent: true,
        opacity: 0.12,
        roughness: 0.03,
        metalness: 0.05,
        transmission: 0.9,
        side: THREE.DoubleSide
    })
);
windowFrame.add(glass);

const windowGlow = new THREE.PointLight(0x1679c9, 10, 15);
windowGlow.position.set(WIN_X, WIN_Y - 0.2, WALL_Z + 1);
scene.add(windowGlow);

const frameMaterial = material(0x101820, 0.6, 0.5);
const vFrame = new THREE.Mesh(new THREE.BoxGeometry(0.12, WIN_H + 0.3, 0.2), frameMaterial);
windowFrame.add(vFrame);
const hFrame = new THREE.Mesh(new THREE.BoxGeometry(WIN_W + 0.3, 0.12, 0.2), frameMaterial);
windowFrame.add(hFrame);
const trimMat = material(0x0d151c, 0.55, 0.4);
const trimTop = new THREE.Mesh(new THREE.BoxGeometry(WIN_W + 0.4, 0.15, 0.25), trimMat);
trimTop.position.y = WIN_H / 2 + 0.1;
windowFrame.add(trimTop);
const trimBottom = trimTop.clone();
trimBottom.position.y = -WIN_H / 2 - 0.1;
windowFrame.add(trimBottom);
const trimLeft = new THREE.Mesh(new THREE.BoxGeometry(0.15, WIN_H + 0.4, 0.25), trimMat);
trimLeft.position.x = -WIN_W / 2 - 0.1;
windowFrame.add(trimLeft);
const trimRight = trimLeft.clone();
trimRight.position.x = WIN_W / 2 + 0.1;
windowFrame.add(trimRight);

// ============================================================
// LEFT WALL WINDOW (window_left)
// ============================================================

// Left wall runs along Z axis at x = -8, from z = -7 to z = 7
// Window centered at x = -7.5, z = 0, width 6 (along Z), height 4 (along Y)
const lwinLeftZ = -3;   // LWIN_X is x offset, window spans Z from -3 to 3
const lwinRightZ = 3;
const lwinTopY = LWIN_Y + LWIN_H / 2;   // 6.2
const lwinBottomY = LWIN_Y - LWIN_H / 2; // 2.2

// Top wall segment (above window) - spans full Z
const lwallTopSeg = new THREE.Mesh(
    new THREE.BoxGeometry(LEFT_WALL_THICK, 8 - lwinTopY, 14), 
    backWallMat
);
lwallTopSeg.position.set(LEFT_WALL_X + LEFT_WALL_THICK/2, (lwinTopY + 8) / 2, 0);
lwallTopSeg.receiveShadow = true;
room.add(lwallTopSeg);

// Bottom wall segment (below window) - spans full Z
const lwallBottomSeg = new THREE.Mesh(
    new THREE.BoxGeometry(LEFT_WALL_THICK, lwinBottomY, 14), 
    backWallMat
);
lwallBottomSeg.position.set(LEFT_WALL_X + LEFT_WALL_THICK/2, lwinBottomY / 2, 0);
lwallBottomSeg.receiveShadow = true;
room.add(lwallBottomSeg);

// Left wall segment (left of window along Z)
const lwallLeftSeg = new THREE.Mesh(
    new THREE.BoxGeometry(LEFT_WALL_THICK, 8, lwinLeftZ - (-7)), 
    backWallMat
);
lwallLeftSeg.position.set(LEFT_WALL_X + LEFT_WALL_THICK/2, 4, (-7 + lwinLeftZ) / 2);
lwallLeftSeg.receiveShadow = true;
room.add(lwallLeftSeg);

// Right wall segment (right of window along Z)
const lwallRightSeg = new THREE.Mesh(
    new THREE.BoxGeometry(LEFT_WALL_THICK, 8, 7 - lwinRightZ), 
    backWallMat
);
lwallRightSeg.position.set(LEFT_WALL_X + LEFT_WALL_THICK/2, 4, (lwinRightZ + 7) / 2);
lwallRightSeg.receiveShadow = true;
room.add(lwallRightSeg);

// Left window frame + glass - rotated 90° on Y to face into room
const lwindowFrame = new THREE.Group();
lwindowFrame.position.set(LWIN_X, LWIN_Y, 0);  // centered at z=0 on the wall
lwindowFrame.rotation.y = -Math.PI / 2;  // face normal along +X into room
room.add(lwindowFrame);

const lglass = new THREE.Mesh(
    new THREE.PlaneGeometry(LWIN_W, LWIN_H),
    new THREE.MeshPhysicalMaterial({
        color: 0x0b2233,
        transparent: true,
        opacity: 0.12,
        roughness: 0.03,
        metalness: 0.05,
        transmission: 0.9,
        side: THREE.DoubleSide
    })
);
lwindowFrame.add(lglass);

// Left window glow - repositioned outside the wall along X
const lwindowGlow = new THREE.PointLight(0x1679c9, 10, 15);
lwindowGlow.position.set(LEFT_WALL_X - 1, LWIN_Y - 0.2, 0);
scene.add(lwindowGlow);

const lframeMaterial = material(0x101820, 0.6, 0.5);
const lvFrame = new THREE.Mesh(new THREE.BoxGeometry(0.12, LWIN_H + 0.3, 0.2), lframeMaterial);
lwindowFrame.add(lvFrame);
const lhFrame = new THREE.Mesh(new THREE.BoxGeometry(LWIN_W + 0.3, 0.12, 0.2), lframeMaterial);
lwindowFrame.add(lhFrame);
const ltrimMat = material(0x0d151c, 0.55, 0.4);
const ltrimTop = new THREE.Mesh(new THREE.BoxGeometry(LWIN_W + 0.4, 0.15, 0.25), ltrimMat);
ltrimTop.position.y = LWIN_H / 2 + 0.1;
lwindowFrame.add(ltrimTop);
const ltrimBottom = ltrimTop.clone();
ltrimBottom.position.y = -LWIN_H / 2 - 0.1;
lwindowFrame.add(ltrimBottom);
const ltrimLeft = new THREE.Mesh(new THREE.BoxGeometry(0.15, LWIN_H + 0.4, 0.25), ltrimMat);
ltrimLeft.position.x = -LWIN_W / 2 - 0.1;
lwindowFrame.add(ltrimLeft);
const ltrimRight = ltrimLeft.clone();
ltrimRight.position.x = LWIN_W / 2 + 0.1;
lwindowFrame.add(ltrimRight);

// Left window exterior - Bridge/River view (different from right window city view)
const lexterior = new THREE.Group();
// Position outside the left wall along X axis (LEFT_WALL_X = -8, so -11 is outside)
lexterior.position.set(LEFT_WALL_X - 3, 0, 0);  // x = -11, y = 0, z = 0
scene.add(lexterior);

// Left sky plane - larger for wider bridge view
const lskyPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 25),
    new THREE.MeshBasicMaterial({ color: 0x04070c, fog: false })
);
// Rotated to face the window (along -X axis)
lskyPlane.rotation.y = Math.PI / 2;
lskyPlane.position.set(-12, 7, 0);  // x=-12 (further out), y=7, z=0
lexterior.add(lskyPlane);

// Left celestial body (separate from right window)
const lcelestial = new THREE.Mesh(
    new THREE.CircleGeometry(0.6, 32),
    new THREE.MeshBasicMaterial({ color: 0xfff3d6, toneMapped: false, transparent: true })
);
lcelestial.rotation.y = Math.PI / 2;
lcelestial.position.set(-11.5, 6, -2);  // x=-11.5, y=6, z=-2
lexterior.add(lcelestial);

// Left stars
const lstarGeometry = new THREE.BufferGeometry();
const lstarCount = 150;
const lstarPositions = new Float32Array(lstarCount * 3);
for (let i = 0; i < lstarCount; i++) {
    lstarPositions[i * 3] = -11.8 - Math.random() * 3;  // x: further out
    lstarPositions[i * 3 + 1] = 2 + Math.random() * 18;  // y
    lstarPositions[i * 3 + 2] = (Math.random() - 0.5) * 35;  // z: spread along wall
}
lstarGeometry.setAttribute("position", new THREE.BufferAttribute(lstarPositions, 3));
const lstars = new THREE.Points(lstarGeometry, new THREE.PointsMaterial({
    color: 0xffffff, size: 0.05, map: dotSprite, transparent: true, opacity: 0.8, depthWrite: false
}));
lexterior.add(lstars);

// Left window building window texture function
function lbuildingWindowTex() {
    return canvasTexture((ctx, w, h) => {
        ctx.fillStyle = "#050a10";
        ctx.fillRect(0, 0, w, h);
        for (let y = 8; y < h; y += 14) {
            for (let x = 6; x < w; x += 14) {
                if (Math.random() > 0.5) {

// DAY / NIGHT CYCLE

const NIGHT_SKY = new THREE.Color(0x03050a);
const DAY_SKY = new THREE.Color(0x2f5a82);
const WARM_TINT = new THREE.Color(0xff9a52);
const MOON_COLOR = new THREE.Color(0xd8e8ff);
const SUN_COLOR = new THREE.Color(0xfff3d6);
const NIGHT_GLOW = new THREE.Color(0x1679c9);
const DAY_GLOW = new THREE.Color(0xcfe9ff);

function bell(hours, center, width) {
    const d = Math.abs(((hours - center + 12 + 24) % 24) - 12);
    return Math.max(0, 1 - d / width);
}

function updateDayNight() {
    const now = new Date();
    const hours = now.getHours() + now.getMinutes() / 60;
    const t = hours / 24;

    const dayFactor = Math.cos((t - 0.5) * Math.PI * 2) * 0.5 + 0.5;
    const dawn = bell(hours, 6.5, 2.2);
    const dusk = bell(hours, 19.5, 2.2);
    const warmth = Math.min(1, dawn + dusk);

    const sky = new THREE.Color().lerpColors(NIGHT_SKY, DAY_SKY, dayFactor).lerp(WARM_TINT, warmth * 0.35);
    skyPlane.material.color.copy(sky);
    lskyPlane.material.color.copy(sky.clone().lerp(new THREE.Color(0x081220), 0.3));

    const glow = new THREE.Color().lerpColors(NIGHT_GLOW, DAY_GLOW, dayFactor).lerp(WARM_TINT, warmth * 0.5);
    windowGlow.color.copy(glow);
    windowGlow.intensity = 6 + dayFactor * 8 + warmth * 4;
    lwindowGlow.color.copy(glow.clone().lerp(new THREE.Color(0x104a7c), 0.4));
    lwindowGlow.intensity = 4 + dayFactor * 6 + warmth * 3;

    ambientLight.intensity = 1.0 + dayFactor * 0.7;

    const angle = t * Math.PI * 2 - Math.PI / 2;
    celestial.position.x = Math.cos(angle) * 3.2;
    celestial.position.y = 4 + Math.sin(angle) * 5.5;
    const aboveHorizon = celestial.position.y > 0.5 ? 1 : 0;
    celestial.material.opacity = aboveHorizon * (0.6 + warmth * 0.4);
    celestial.material.color.copy(dayFactor > 0.5 ? SUN_COLOR : MOON_COLOR).lerp(WARM_TINT, warmth * 0.6);

    lcelestial.position.x = Math.cos(angle + 0.5) * 3.2;
    lcelestial.position.y = 4 + Math.sin(angle + 0.5) * 5.5;
    const laboveHorizon = lcelestial.position.y > 0.5 ? 1 : 0;
    lcelestial.material.opacity = laboveHorizon * (0.6 + warmth * 0.4);
    lcelestial.material.color.copy(dayFactor > 0.5 ? SUN_COLOR : MOON_COLOR).lerp(WARM_TINT, warmth * 0.6);

    stars.material.opacity = (1 - dayFactor) * 0.85;
    lstars.material.opacity = (1 - dayFactor) * 0.85;

    buildings.forEach(mat => { mat.emissiveIntensity = 0.15 + (1 - dayFactor) * 0.75; });
    lbuildings.forEach(mat => { mat.emissiveIntensity = 0.15 + (1 - dayFactor) * 0.75; });
    lfarBuildings.forEach(mat => { mat.emissiveIntensity = 0.1 + (1 - dayFactor) * 0.6; });

    // Car headlights/taillights intensity based on time of day
    lcarLights.forEach((lights, i) => {
        const isNight = dayFactor < 0.4;
        const intensity = isNight ? 1.0 : 0.1;
        lights.left.material.opacity = intensity;
        lights.right.material.opacity = intensity;
        lights.leftTail.material.opacity = intensity * 0.8;
        lights.rightTail.material.opacity = intensity * 0.8;
    });

    return dayFactor;
}

function drawSchematic(ctx, w, h) {
    ctx.fillStyle = "#050c14";
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "rgba(70,150,200,0.25)";
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 24) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = 0; y < h; y += 24) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    ctx.strokeStyle = "#5fd0ff";
    ctx.lineWidth = 3;
    ctx.strokeRect(w * 0.32, h * 0.15, w * 0.36, h * 0.6);
    for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(w * 0.32, h * (0.25 + i * 0.1));
        ctx.lineTo(w * 0.32 + w * 0.36, h * (0.25 + i * 0.1));
        ctx.stroke();
    }
    ctx.fillStyle = "#5fd0ff";
    for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc(w * (0.15 + i * 0.14), h * 0.85, 4, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.font = "12px monospace";
    ctx.fillStyle = "rgba(150,210,240,0.6)";
    ctx.fillText("UNIT// SCHEMATIC 07-A", w * 0.08, h * 0.92);
}

function drawNebula(ctx, w, h) {
    const grad = ctx.createRadialGradient(w * 0.4, h * 0.4, 10, w * 0.4, h * 0.4, w * 0.7);
    grad.addColorStop(0, "#5a2d8f");
    grad.addColorStop(0.4, "#22376b");
    grad.addColorStop(1, "#020409");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 180; i++) {
        ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.8})`;
        ctx.beginPath();
        ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 1.4, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawCircuit(ctx, w, h) {
    ctx.fillStyle = "#07131a";
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "#e0a752";
    ctx.lineWidth = 2;
    let x = 20, y = h * 0.5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    for (let i = 0; i < 14; i++) {
        x += 20 + Math.random() * 20;
        y += (Math.random() - 0.5) * 60;
        y = Math.max(20, Math.min(h - 20, y));
        ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = "#5fd0ff";
    for (let i = 0; i < 20; i++) {
        ctx.beginPath();
        ctx.arc(Math.random() * w, Math.random() * h, 2.5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function createFramedArt({ x, y, z, rotY = 0, width = 1.6, height = 1.1, draw, glow = 0.2 }) {
    const group = new THREE.Group();
    group.position.set(x, y, z);
    group.rotation.y = rotY;
    room.add(group);

    const tex = canvasTexture(draw);
    const artMat = new THREE.MeshStandardMaterial({
        map: tex, roughness: 0.7, emissive: 0x223344, emissiveMap: tex, emissiveIntensity: glow
    });
    const artPlane = new THREE.Mesh(new THREE.PlaneGeometry(width, height), artMat);
    group.add(artPlane);

    const frameMat = material(0x1a1410, 0.6, 0.3);
    const t = 0.07;
    const topBar = new THREE.Mesh(new THREE.BoxGeometry(width + t * 2, t, 0.06), frameMat);
    topBar.position.set(0, height / 2 + t / 2, -0.02);
    group.add(topBar);
    const botBar = topBar.clone();
    botBar.position.y = -height / 2 - t / 2;
    group.add(botBar);
    const leftBar = new THREE.Mesh(new THREE.BoxGeometry(t, height, 0.06), frameMat);
    leftBar.position.set(-width / 2 - t / 2, 0, -0.02);
    group.add(leftBar);
    const rightBar = leftBar.clone();
    rightBar.position.x = width / 2 + t / 2;
    group.add(rightBar);

    return group;
}

function drawTerminal(ctx, w, h, time) {
    ctx.fillStyle = "#040d14";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#4fd6ff";
    ctx.font = "13px monospace";
    const load = Math.floor(4 + Math.sin(time * 0.6) * 3 + 4);
    const loadBar = "|".repeat(Math.max(1, load)) + ".".repeat(Math.max(0, 10 - load));
    const cursor = Math.floor(time * 2) % 2 === 0 ? "_" : " ";
    const lines = [
        "> tars.core.status()",
        "SYS  : nominal",
        "PWR  : " + (95 + Math.sin(time * 0.4) * 3).toFixed(1) + "%",
        "TEMP : " + (40 + Math.sin(time * 0.9) * 2).toFixed(0) + "C",
        "NET  : " + (1.1 + Math.sin(time * 1.3) * 0.2).toFixed(1) + "gbps",
        "LOAD : " + loadBar,
        "> awaiting input" + cursor
    ];
    lines.forEach((l, i) => ctx.fillText(l, 14, 30 + i * 22));
    ctx.strokeStyle = "rgba(79,214,255,0.4)";
    ctx.strokeRect(2, 2, w - 4, h - 4);
}

function drawWaveform(ctx, w, h, time) {
    ctx.fillStyle = "#050a12";
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "#5fd0ff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x < w; x++) {
        const y = h / 2 + Math.sin(x * 0.05 + time * 2) * 20 * Math.sin(x * 0.003 + time * 0.5) + (Math.random() - 0.5) * 6;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = "#ff8b6b";
    for (let i = 0; i < 8; i++) {
        const bx = 20 + i * (w / 9);
        const bh = 10 + (Math.sin(time * 3 + i) * 0.5 + 0.5) * (h - 30);
        ctx.fillRect(bx, h - bh, 10, bh);
    }
}

// TARS OS Interface - shows when TARS is at desk
function drawTARSOS(ctx, w, h, time) {
    ctx.fillStyle = "#02060a";
    ctx.fillRect(0, 0, w, h);
    
    // Scanline effect
    ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
    for (let y = 0; y < h; y += 3) {
        ctx.fillRect(0, y + (time * 30) % 3, w, 1);
    }
    
    // Header bar
    const headerH = 36;
    const grad = ctx.createLinearGradient(0, 0, 0, headerH);
    grad.addColorStop(0, "rgba(30, 50, 80, 0.9)");
    grad.addColorStop(1, "rgba(10, 20, 40, 0.95)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, headerH);
    ctx.strokeStyle = "rgba(95, 208, 255, 0.3)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, headerH);
    ctx.lineTo(w, headerH);
    ctx.stroke();
    
    // TARS logo
    ctx.fillStyle = "#5fd0ff";
    ctx.font = "bold 16px monospace";
    ctx.fillText("T.A.R.S. OS v0.9", 16, 24);
    
    // Status indicator
    const statusColor = currentState.emotion === "critical" ? "#ff2200" :
                        currentState.emotion === "warning" ? "#ff8800" :
                        currentState.emotion === "celebrate" ? "#00ff44" :
                        currentState.emotion === "speak" ? "#00d2ff" : "#4fe07a";
    ctx.fillStyle = statusColor;
    ctx.beginPath();
    ctx.arc(w - 28, headerH / 2, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.font = "11px monospace";
    ctx.fillText(currentState.emotion.toUpperCase(), w - 120, headerH / 2 + 4);
    
    // Main content area
    const contentY = headerH + 20;
    const lineH = 22;
    
    // System metrics
    ctx.fillStyle = "#5fd0ff";
    ctx.font = "12px monospace";
    const metrics = [
        `CORE TEMP: ${(42 + Math.sin(time * 0.7) * 3).toFixed(1)}°C`,
        `POWER: ${(94 + Math.sin(time * 0.5) * 2).toFixed(1)}%`,
        `NETWORK: ${(1.2 + Math.sin(time * 1.1) * 0.15).toFixed(2)} GB/s`,
        `MEMORY: ${Math.floor(65 + Math.sin(time * 0.3) * 5)}%`,
        `PROCESSES: ${Math.floor(47 + Math.sin(time * 0.4) * 3)}`,
        `UPTIME: ${Math.floor(time / 3600)}h ${Math.floor((time % 3600) / 60)}m ${Math.floor(time % 60)}s`
    ];
    
    metrics.forEach((m, i) => {
        ctx.fillText(m, 20, contentY + i * lineH);
    });
    
    // Activity log
    ctx.fillStyle = "rgba(95, 208, 255, 0.6)";
    ctx.fillText("ACTIVITY LOG:", 20, contentY + 7 * lineH);
    
    const activities = [
        "> neural_net.optimize()",
        "> memory.consolidate()", 
        "> sensors.poll()",
        "> network.sync()",
        "> idle.monitor()"
    ];
    
    ctx.font = "11px monospace";
    activities.forEach((a, i) => {
        const alpha = 0.3 + 0.7 * Math.sin(time * 2 + i) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(95, 208, 255, ${alpha})`;
        ctx.fillText(a, 28, contentY + 8.5 * lineH + i * 18);
    });
    
    // Bottom bar
    ctx.fillStyle = "rgba(10, 20, 40, 0.9)";
    ctx.fillRect(0, h - 30, w, 30);
    ctx.strokeStyle = "rgba(95, 208, 255, 0.2)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, h - 30);
    ctx.lineTo(w, h - 30);
    ctx.stroke();
    
    ctx.fillStyle = "#5fd0ff";
    ctx.font = "10px monospace";
    const cursor = Math.floor(time * 2) % 2 === 0 ? "_" : " ";
    ctx.fillText(`tars@desktop:~$ awaiting input${cursor}`, 16, h - 12);
    
    // Border
    ctx.strokeStyle = "rgba(95, 208, 255, 0.3)";
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, w - 2, h - 2);
}

let monitor1State = 'terminal'; // 'terminal' | 'tarsOS' | 'matrix' | 'starfield' | 'syslogs' | 'codeReview' | 'logCleanup'
let monitor2State = 'waveform'; // 'waveform' | 'matrix' | 'starfield' | 'syslogs'
let monitorIdleTimer = 0;
let monitorIdleTimeout = 8000; // 8 seconds to screensaver

function setMonitorState(monitor, state) {
    if (monitor === 1) {
        monitor1State = state;
    } else if (monitor === 2) {
        monitor2State = state;
    }
    updateMonitorDrawFunctions();
}

function updateMonitorDrawFunctions() {
    const m1 = animatedScreens.find(s => s.drawFn === drawTerminal || s.drawFn === drawTARSOS || s.drawFn === drawMatrix || s.drawFn === drawStarfield || s.drawFn === drawSysLogs || s.drawFn === drawCodeReview || s.drawFn === drawLogCleanup);
    const m2 = animatedScreens.find(s => s.drawFn === drawWaveform || s.drawFn === drawMatrix || s.drawFn === drawStarfield || s.drawFn === drawSysLogs);
    if (!m1 || !m2) return;
    
    // Monitor 1
    switch (monitor1State) {
        case 'terminal': m1.drawFn = drawTerminal; break;
        case 'tarsOS': m1.drawFn = drawTARSOS; break;
        case 'matrix': m1.drawFn = drawMatrix; break;
        case 'starfield': m1.drawFn = drawStarfield; break;
        case 'syslogs': m1.drawFn = drawSysLogs; break;
        case 'codeReview': m1.drawFn = drawCodeReview; break;
        case 'logCleanup': m1.drawFn = drawLogCleanup; break;
    }
    
    // Monitor 2
    switch (monitor2State) {
        case 'waveform': m2.drawFn = drawWaveform; break;
        case 'matrix': m2.drawFn = drawMatrix; break;
        case 'starfield': m2.drawFn = drawStarfield; break;
        case 'syslogs': m2.drawFn = drawSysLogs; break;
    }
}

function drawMatrix(ctx, w, h, time) {
    ctx.fillStyle = "rgba(0,10,0,0.15)";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#0f0";
    ctx.font = "14px monospace";
    if (!drawMatrix.drops) drawMatrix.drops = Array(40).fill(0).map(() => Math.random() * -300);
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()";
    for (let i = 0; i < drawMatrix.drops.length; i++) {
        const char = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(char, i * 20, drawMatrix.drops[i]);
        drawMatrix.drops[i] += 20;
        if (drawMatrix.drops[i] > h) drawMatrix.drops[i] = Math.random() * -100;
    }
}

function drawStarfield(ctx, w, h, time) {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#fff";
    if (!drawStarfield.stars) drawStarfield.stars = Array(100).fill(0).map(() => ({
        x: Math.random(), y: Math.random(), z: Math.random(), speed: 0.01 + Math.random() * 0.02
    }));
    drawStarfield.stars.forEach(s => {
        s.z -= s.speed;
        if (s.z <= 0) s.z = 1;
        const sx = (s.x - 0.5) / s.z * w + w/2;
        const sy = (s.y - 0.5) / s.z * h + h/2;
        const size = (1 - s.z) * 3;
        if (sx > 0 && sx < w && sy > 0 && sy < h) {
            ctx.fillRect(sx, sy, size, size);
        }
    });
}

function drawSysLogs(ctx, w, h, time) {
    ctx.fillStyle = "#040d14";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#4fd6ff";

}

function updateMonitorIdle(dt) {
    // If at desk, reset idle timer and show active states
    if (currentState.atDesk) {
        monitorIdleTimer = 0;
        const screensaverStates = ['matrix', 'starfield', 'syslogs', 'codeReview', 'logCleanup'];
        if (screensaverStates.includes(monitor1State)) {
            setMonitorState(1, 'tarsOS');
        }
        if (screensaverStates.includes(monitor2State)) {
            setMonitorState(2, 'waveform');
        }
    } else {
        // Away from desk - start idle timer
        monitorIdleTimer += dt * 1000;
        if (monitorIdleTimer > monitorIdleTimeout) {
            // Cycle through screensaver states
            if (monitor1State === 'terminal' || monitor1State === 'tarsOS' || monitor1State === 'codeReview' || monitor1State === 'logCleanup') {
                setMonitorState(1, 'matrix');
            } else if (monitor1State === 'matrix') {
                setMonitorState(1, 'starfield');
            } else if (monitor1State === 'starfield') {
                setMonitorState(1, 'syslogs');
            } else if (monitor1State === 'syslogs') {
                setMonitorState(1, 'matrix');
            }
            if (monitor2State === 'waveform') {
                setMonitorState(2, 'matrix');
            } else if (monitor2State === 'matrix') {
                setMonitorState(2, 'starfield');
            } else if (monitor2State === 'starfield') {
                setMonitorState(2, 'syslogs');
            } else if (monitor2State === 'syslogs') {
                setMonitorState(2, 'waveform');
            }
        }
    }
}

function buildRack(originX, originZ, unitTypes) {
    const rack = new THREE.Group();
    rack.position.set(originX, 0, originZ);
    rack.castShadow = true;
    room.add(rack);

    const rackHeight = 0.7 + unitTypes.length * UNIT_PITCH;
    const shellMat = material(0x090d12, 0.6, 0.55);
    const shellThick = 0.08;
    const shellDepth = 1.3;
    const shellTop = new THREE.Mesh(new THREE.BoxGeometry(1.6, shellThick, shellDepth), shellMat);
    shellTop.position.set(0, rackHeight, 0);
    shellTop.castShadow = true;
    rack.add(shellTop);
    const shellBottom = new THREE.Mesh(new THREE.BoxGeometry(1.6, shellThick, shellDepth), shellMat);
    shellBottom.position.set(0, 0, 0);
    rack.add(shellBottom);
    const shellLeft = new THREE.Mesh(new THREE.BoxGeometry(shellThick, rackHeight, shellDepth), shellMat);
    shellLeft.position.set(-0.8, rackHeight / 2, 0);
    shellLeft.castShadow = true;
    rack.add(shellLeft);
    const shellRight = shellLeft.clone();
    shellRight.position.x = 0.8;
    rack.add(shellRight);
    const shellBack = new THREE.Mesh(new THREE.BoxGeometry(1.6, rackHeight, shellThick), shellMat);
    shellBack.position.set(0, rackHeight / 2, -0.65 + shellThick / 2);
    rack.add(shellBack);

    for (const rx of [-0.78, 0.78]) {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(0.05, rackHeight, 1.32), material(0x14191f, 0.4, 0.5));
        rail.position.set(rx, rackHeight / 2, 0);
        rack.add(rail);
    }

    unitTypes.forEach((type, i) => {
        const unitY = 0.5 + i * UNIT_PITCH;
        if (type === "patch") buildPatchPanelUnit(rack, unitY);
        else if (type === "switch") buildSwitchUnit(rack, unitY, i === 0 ? "UBNT US-24-250W" : "UBNT US-24");
        else if (type === "filler") buildFillerUnit(rack, unitY);
        else buildServerUnit(rack, unitY);
    });

    const screenLabel = "NODE " + Math.floor(Math.random() * 90 + 10);
    const screenTex = registerAnimatedScreen(256, 96, (ctx, w, h) => drawRackScreen(ctx, w, h, screenLabel), 0.3);
    const statusScreen = new THREE.Mesh(
        new THREE.PlaneGeometry(0.9, 0.3),
        new THREE.MeshStandardMaterial({ map: screenTex, emissiveMap: screenTex, emissive: 0xffffff, emissiveIntensity: 0.9 })
    );
    statusScreen.position.set(0, rackHeight - 0.35, 0.646);
    rack.add(statusScreen);

    for (const fx of [-0.4, 0.4]) {
        const fan = createFan(0.18);
        fan.position.set(fx, rackHeight + 0.02, 0);
        fan.rotation.x = -Math.PI / 2;
        rack.add(fan);
    }

    for (let c = 0; c < 3; c++) {
        const cx = -0.5 + c * 0.5;
        const cable = makeCable([
            new THREE.Vector3(cx, 0.5, -0.6),
            new THREE.Vector3(cx + 0.1, 0.25, -0.4),
            new THREE.Vector3(cx + 0.15, 0.02, -0.1)
        ]);
        rack.add(cable);
    }

    const rackGlow = new THREE.PointLight(0x2ec8ff, 3.5, 4.5);
    rackGlow.position.set(0, rackHeight * 0.55, 0.5);
    rack.add(rackGlow);

    return rack;
}

function getAvoidanceVector(pos, target, dt) {
    const avoid = new THREE.Vector3();
    const radius = 0.8; // TARS body radius + margin
    
    for (const obs of OBSTACLES) {
        const dx = pos.x - obs.x;
        const dz = pos.z - obs.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        const dangerDist = obs.radius + radius + 0.5;
        
        if (dist < dangerDist) {
            // Repulsion force
            const force = (dangerDist - dist) / dangerDist;
            const pushX = (dx / dist) * force * 0.15;
            const pushZ = (dz / dist) * force * 0.15;
            avoid.x += pushX;
            avoid.z += pushZ;
        }
    }
    
    // Room bounds
    const margin = 1.0;
    if (pos.x < ROOM_BOUNDS.xMin + margin) avoid.x += (ROOM_BOUNDS.xMin + margin - pos.x) * 0.05;
    if (pos.x > ROOM_BOUNDS.xMax - margin) avoid.x += (ROOM_BOUNDS.xMax - margin - pos.x) * 0.05;
    if (pos.z < ROOM_BOUNDS.zMin + margin) avoid.z += (ROOM_BOUNDS.zMin + margin - pos.z) * 0.05;
    if (pos.z > ROOM_BOUNDS.zMax - margin) avoid.z += (ROOM_BOUNDS.zMax - margin - pos.z) * 0.05;
    
    return avoid;
}

const TARS_SAVE_VERSION = 1;
const STORAGE_KEY = "tars_world_state_v1";
const SAVE_INTERVAL_MS = 30000;

const WorldPersistence = {
    capture() {
        return {
            version: TARS_SAVE_VERSION,
            savedAt: Date.now(),
            savedAtISO: new Date().toISOString(),
            tars: {
                location: worldState.tars.location,
                activity: worldState.tars.activity,
                activityStartedAt: worldState.tars.activityStartedAt,
                activityReason: worldState.tars.activityReason,
                previousActivity: worldState.tars.previousActivity,
                mood: worldState.tars.mood,
                energy: worldState.tars.energy,
                needs: { ...(worldState.tars.needs || {}) },
                preferences: JSON.parse(JSON.stringify(worldState.tars.preferences))
            },
            environment: {
                weather: { ...worldState.environment.weather },
                timeOfDay: worldState.environment.timeOfDay,
                temperature: worldState.environment.temperature
            },
            worldMemory: (worldState.worldMemory || []).slice()
        };
    },

    save() {
        try {
            const snapshot = this.capture();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
            return true;
        } catch (e) {
            console.warn("[WorldPersistence] Save failed:", e.message);
            return false;
        }
    },

    load() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return null;
            const data = JSON.parse(raw);
            if (!this.validate(data)) return null;
            return data;
        } catch (e) {
            console.warn("[WorldPersistence] Load failed:", e.message);
            return null;
        }
    },

    validate(data) {
        if (!data || typeof data !== "object") return false;
        if (data.version !== TARS_SAVE_VERSION) return false;
        if (!data.tars || typeof data.tars !== "object") return false;
        if (!data.environment || typeof data.environment !== "object") return false;
        return true;
    },

    applyToState(data) {
        if (!data) return false;
        const t = data.tars;
        worldState.tars.location = t.location || "spawn";
        worldState.tars.activity = t.activity || "idle";
        worldState.tars.activityStartedAt = t.activityStartedAt || Date.now();
        worldState.tars.activityReason = t.activityReason || "session_restore";
        worldState.tars.previousActivity = t.previousActivity || null;
        worldState.tars.mood = t.mood || "neutral";
        worldState.tars.energy = typeof t.energy === "number" ? t.energy : 0.7;
        worldState.tars.controlMode = "autonomous";
        if (t.needs) worldState.tars.needs = { ...t.needs };
        if (t.preferences) worldState.tars.preferences = JSON.parse(JSON.stringify(t.preferences));
        const e = data.environment;
        if (e.weather) worldState.environment.weather = { ...e.weather };
        if (e.timeOfDay !== undefined) worldState.environment.timeOfDay = e.timeOfDay;
        if (e.temperature !== undefined) worldState.environment.temperature = e.temperature;
        if (data.worldMemory && Array.isArray(data.worldMemory)) {
            worldState.worldMemory = data.worldMemory;
        }
        worldState.session.previousSessionEnd = data.savedAt || null;
        const elapsedMs = Date.now() - (data.savedAt || Date.now());
        worldState.session.totalElapsed = elapsedMs;
        console.log(`[WorldPersistence] Restored from ${data.savedAtISO} (${(elapsedMs / 1000).toFixed(0)}s elapsed)`);
        return true;
    }
};

// Log an event to both runtime activityLog and persistent worldMemory
function persistWorldEvent(event) {
    if (!worldState.worldMemory) worldState.worldMemory = [];
    worldState.worldMemory.push(event);
    if (worldState.worldMemory.length > worldState.maxWorldMemorySize) {
        worldState.worldMemory.shift();
    }
}

// Log a curated event (activityLog + worldMemory)
function logWorldEvent(eventType, activity, location, reason, metadata = {}) {
    const event = logActivityEvent(eventType, activity, location, reason, metadata);
    persistWorldEvent(event);
    return event;
}

// Helper: Log a meaningful activity event
function logActivityEvent(eventType, activity, location, reason, metadata = {}) {
    const event = {
        id: `evt_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
        timestamp: new Date().toISOString(),
        eventType,
        activity,
        location,
        reason,
        metadata
    };
    worldState.activityLog.push(event);
    if (worldState.activityLog.length > worldState.maxActivityLogSize) {
        worldState.activityLog.shift();
    }
    console.log(`[ActivityLog] ${eventType}: ${activity} at ${location} (${reason})`, metadata);
    return event;
}

// Helper: Update TARS activity state
function setTARSActivity(activity, location, reason, metadata = {}) {
    const now = Date.now();
    if (worldState.tars.activity !== "idle" && worldState.tars.activity !== activity) {
        worldState.tars.previousActivity = {
            activity: worldState.tars.activity,
            location: worldState.tars.location,
            duration: now - worldState.tars.activityStartedAt,
            endedAt: now
        };
    }
    worldState.tars.activity = activity;
    worldState.tars.location = location;
    worldState.tars.activityStartedAt = now;
    worldState.tars.activityReason = reason;
    logActivityEvent("activity_started", activity, location, reason, metadata);
    WorldPersistence.save();
}

// Helper: Get current activity summary for LLM queries
function getTARSActivitySummary() {
    return {
        controlMode: worldState.tars.controlMode,
        location: worldState.tars.location,
        activity: worldState.tars.activity,
        activityStartedAt: new Date(worldState.tars.activityStartedAt).toISOString(),

        previousActivity: worldState.tars.previousActivity,
        environment: {
            weather: worldState.environment.weather,
            timeOfDay: worldState.environment.timeOfDay
        }
    };
}

// Helper: Update activity log display in UI

    const recent = worldState.activityLog.slice(-10).reverse();

        return `<div class="log-entry">[${time}] ${e.activity || e.state || e.type} @ ${e.location || ""}</div>`;

}

        heavy_rain: { rain: { intensity: "heavy" }, snow: false, fog: { density: 0.3 }, lightning: false, wind: { intensity: "strong" } },
        thunderstorm: { rain: { intensity: "heavy" }, snow: false, fog: { density: 0.3 }, lightning: true, wind: { intensity: "strong" } },
        snow: { rain: false, snow: { intensity: "moderate" }, fog: { density: 0.4 }, lightning: false, wind: { intensity: "light" } },
        fog: { rain: false, snow: false, fog: { density: 0.8 }, lightning: false, wind: { intensity: "light" } },
        foggy: { rain: false, snow: false, fog: { density: 0.6 }, lightning: false, wind: { intensity: "light" } },
        windy: { rain: false, snow: false, fog: false, lightning: false, wind: { intensity: "strong" } },
        storm: { rain: { intensity: "heavy" }, snow: false, fog: { density: 0.4 }, lightning: true, wind: { intensity: "severe" } }
    },
    
    updateFromWeatherState() {
        const weather = worldState.environment.weather;
        const conditionKey = weather.condition === "thunderstorm" ? "thunderstorm" :
                            weather.condition === "heavy_rain" ? "heavy_rain" :
                            weather.condition;
        this.currentCondition = conditionKey;
        this.applyEffects(this.effectConfigs[conditionKey] || this.effectConfigs.clear);
    },
    
    applyEffects(config) {
        // Rain
        if (config.rain) {
            rainGroup.visible = true;
            rainCount = config.rain.intensity === "heavy" ? 500 : 200;
            rainSpeeds = new Float32Array(rainCount);
            const positions = rain.geometry.attributes.position.array;
            for (let i = 0; i < rainCount; i++) {
                positions[i * 3] = winLeft + Math.random() * WIN_W;
                positions[i * 3 + 1] = winBottom + Math.random() * (WIN_H + 2);
                positions[i * 3 + 2] = -Math.random() * 2.5;
                rainSpeeds[i] = (config.rain.intensity === "heavy" ? 0.06 : 0.04) + Math.random() * 0.03;
            }
            rain.geometry.attributes.position.needsUpdate = true;
            rain.material.opacity = config.rain.intensity === "heavy" ? 0.8 : 0.7;
            // Left window rain
            lrainGroup.visible = true;
            const lCount = config.rain.intensity === "heavy" ? 500 : 200;
            if (lCount !== lrainCount) {
                lrainCount = lCount;
                lrainSpeeds = new Float32Array(lrainCount);
                const lpos = lrain.geometry.attributes.position.array;
                const newLpos = new Float32Array(lrainCount * 3);
                for (let i = 0; i < lrainCount; i++) {
                    newLpos[i * 3] = lwinLeft + Math.random() * LWIN_W;
                    newLpos[i * 3 + 1] = lwinBottom + Math.random() * (LWIN_H + 2);
                    newLpos[i * 3 + 2] = -Math.random() * 2.5;
                    lrainSpeeds[i] = (config.rain.intensity === "heavy" ? 0.06 : 0.04) + Math.random() * 0.03;
                }
                lrain.geometry.setAttribute("position", new THREE.BufferAttribute(newLpos, 3));
            } else {
                const lpos = lrain.geometry.attributes.position.array;
                for (let i = 0; i < lrainCount; i++) {
                    lpos[i * 3 + 1] = lwinBottom + Math.random() * (LWIN_H + 2);
                    lrainSpeeds[i] = (config.rain.intensity === "heavy" ? 0.06 : 0.04) + Math.random() * 0.03;
                }
                lrain.geometry.attributes.position.needsUpdate = true;
            }
            lrain.material.opacity = config.rain.intensity === "heavy" ? 0.8 : 0.7;
        } else {
            rainGroup.visible = false;
            lrainGroup.visible = false;
        }
        
        // Fog (adjust scene fog)
        if (config.fog) {
            scene.fog.density = config.fog.density * 0.035;
            scene.fog.color = new THREE.Color(0x05080c);
        } else {
            scene.fog.density = 0.035;
        }
        
        // Lightning
        if (config.lightning) {
            this.startLightning();
        } else {
            this.stopLightning();
        }
        
        // Wind (affects rain angle, particles, etc.)
        if (config.wind) {
            this.applyWind(config.wind.intensity);
        }
    },
    
    lightningInterval: null,
    startLightning() {
        if (this.lightningInterval) return;
        this.lightningInterval = setInterval(() => {
            if (Math.random() < 0.3) {
                const flashIntensity = 30 + Math.random() * 40;
                windowGlow.intensity = flashIntensity;
                setTimeout(() => { windowGlow.intensity = 10; }, 50);
                // Brief ambient flash
                ambientLight.intensity = 3;
                setTimeout(() => { ambientLight.intensity = 1.2; }, 100);
            }
        }, 2000 + Math.random() * 3000);
    },
    
    stopLightning() {
        if (this.lightningInterval) {
            clearInterval(this.lightningInterval);
            this.lightningInterval = null;
        }
    },
    
    applyWind(intensity) {
        const windStrength = { light: 0.5, moderate: 1.0, strong: 2.0, severe: 3.0 }[intensity] || 1.0;
        // Wind affects rain angle - handled in rain update
        this.windStrength = windStrength;
    }
};

// Face animation state
let faceState = {
    eyeBlink: 0,
    blinkTimer: 0,
    expression: "neutral",
    expressionTimer: 0,
    eyebrowOffset: 0,
    mouthOffset: 0,
    squint: 0,
    lookDir: { x: 0, y: 0 },
    pupilDilation: 1.0
};

function drawFace(time) {
    const ctx = faceCtx;
    const w = faceCanvas.width, h = faceCanvas.height;
    ctx.clearRect(0, 0, w, h);
    
    const emotion = currentState.emotion;
    const intensity = currentState.intensity;
    const pulse = Math.sin(time * currentState.pulseSpeed) * 0.5 + 0.5;
    
    // Update face state
    faceState.blinkTimer -= 1/60;
    if (faceState.blinkTimer <= 0) {
        faceState.eyeBlink = 1;
        faceState.blinkTimer = 2 + Math.random() * 4;
    }
    if (faceState.eyeBlink > 0) {
        faceState.eyeBlink = Math.max(0, faceState.eyeBlink - 0.15);
    }
    
    faceState.expressionTimer -= 1/60;
    if (faceState.expressionTimer <= 0) {
        faceState.expression = ["neutral", "curious", "focused", "amused"][Math.floor(Math.random() * 4)];
        faceState.expressionTimer = 3 + Math.random() * 5;
    }
    
    // Emotion-driven face parameters
    const preset = BEHAVIOR_PRESETS[emotion] || BEHAVIOR_PRESETS.idle;
    const faceColor = new THREE.Color(preset.color);
    const r = Math.floor(faceColor.r * 255);
    const g = Math.floor(faceColor.g * 255);
    const b = Math.floor(faceColor.b * 255);
    
    // Base face glow
    const glowAlpha = 0.2 + pulse * 0.3 + intensity * 0.2;
    ctx.fillStyle = `rgba(${r},${g},${b},${glowAlpha})`;
    ctx.beginPath();
    ctx.arc(w/2, h/2, 110, 0, Math.PI * 2);
    ctx.fill();
    
    // Face shape
    ctx.fillStyle = `rgba(${Math.min(255, r+30)},${Math.min(255, g+30)},${Math.min(255, b+30)},0.15)`;
    ctx.beginPath();
    ctx.ellipse(w/2, h/2 + 10, 90, 100, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // ========== EYEBROWS ==========
    ctx.strokeStyle = `rgb(${r},${g},${b})`;
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    const browY = h/2 - 55;
    const browW = 35;
    
    // Left eyebrow
    ctx.beginPath();
    if (emotion === "critical" || emotion === "warning" || emotion === "serious" || emotion === "disapproving") {
        // Angry/down
        ctx.moveTo(w/2 - 45, browY + faceState.eyebrowOffset);
        ctx.lineTo(w/2 - 10, browY - 8 + faceState.eyebrowOffset);
    } else if (emotion === "confused") {
        // Uneven
        ctx.moveTo(w/2 - 45, browY - 5 + faceState.eyebrowOffset);
        ctx.lineTo(w/2 - 10, browY + 3 + faceState.eyebrowOffset);
    } else if (emotion === "amused" || emotion === "celebrate" || emotion === "excited") {
        // Raised happy
        ctx.moveTo(w/2 - 45, browY - 8 + faceState.eyebrowOffset);
        ctx.quadraticCurveTo(w/2 - 27, browY - 15 + faceState.eyebrowOffset, w/2 - 10, browY - 5 + faceState.eyebrowOffset);
    } else if (emotion === "sarcastic") {
        // One up, one down
        ctx.moveTo(w/2 - 45, browY - 10 + faceState.eyebrowOffset);
        ctx.lineTo(w/2 - 10, browY + 5 + faceState.eyebrowOffset);
    } else {
        // Neutral/relaxed
        ctx.moveTo(w/2 - 45, browY + faceState.eyebrowOffset);
        ctx.quadraticCurveTo(w/2 - 27, browY - 5 + faceState.eyebrowOffset, w/2 - 10, browY + faceState.eyebrowOffset);
    }
    ctx.stroke();
    
    // Right eyebrow
    ctx.beginPath();
    if (emotion === "critical" || emotion === "warning" || emotion === "serious" || emotion === "disapproving") {
        ctx.moveTo(w/2 + 10, browY - 8 - faceState.eyebrowOffset);
        ctx.lineTo(w/2 + 45, browY - faceState.eyebrowOffset);
    } else if (emotion === "confused") {
        ctx.moveTo(w/2 + 10, browY + 3 - faceState.eyebrowOffset);
        ctx.lineTo(w/2 + 45, browY - 5 - faceState.eyebrowOffset);
    } else if (emotion === "sarcastic") {
        ctx.moveTo(w/2 + 10, browY + 5 - faceState.eyebrowOffset);
        ctx.lineTo(w/2 + 45, browY - 10 - faceState.eyebrowOffset);
    } else {
        ctx.moveTo(w/2 + 10, browY - faceState.eyebrowOffset);
        ctx.quadraticCurveTo(w/2 + 27, browY - 5 - faceState.eyebrowOffset, w/2 + 45, browY - faceState.eyebrowOffset);
    }
    ctx.stroke();
    
    // ========== EYES ==========
    const eyeY = h/2 - 20;
    const eyeW = 28 - faceState.squint * 10;
    const eyeH = (32 - faceState.squint * 16) * (1 - faceState.eyeBlink);
    const pupilSize = (10 + intensity * 6) * faceState.pupilDilation;
    
    // Eye whites / base
    ctx.fillStyle = `rgba(${r},${g},${b},0.9)`;
    
    // Left eye
    ctx.beginPath();
    ctx.ellipse(w/2 - 35 + faceState.lookDir.x * 5, eyeY + faceState.lookDir.y * 3, eyeW, eyeH, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Right eye
    ctx.beginPath();
    ctx.ellipse(w/2 + 35 + faceState.lookDir.x * 5, eyeY + faceState.lookDir.y * 3, eyeW, eyeH, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Pupils (track look direction)
    ctx.fillStyle = `rgb(${Math.max(0, r-80)},${Math.max(0, g-80)},${Math.max(0, b-80)})`;
    const pupilOffsetX = faceState.lookDir.x * 8;
    const pupilOffsetY = faceState.lookDir.y * 6;
    
    // Left pupil
    ctx.beginPath();
    ctx.ellipse(w/2 - 35 + pupilOffsetX, eyeY + pupilOffsetY, pupilSize, pupilSize * 1.2, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Right pupil
    ctx.beginPath();
    ctx.ellipse(w/2 + 35 + pupilOffsetX, eyeY + pupilOffsetY, pupilSize, pupilSize * 1.2, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Eye highlights (life!)
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath();
    ctx.ellipse(w/2 - 35 + pupilOffsetX - 4, eyeY + pupilOffsetY - 4, 4, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(w/2 + 35 + pupilOffsetX - 4, eyeY + pupilOffsetY - 4, 4, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Eyelids (blink/squint)
    if (faceState.eyeBlink > 0.5 || faceState.squint > 0.5) {
        ctx.fillStyle = `rgba(10,20,40,${faceState.eyeBlink * 0.8 + faceState.squint * 0.5})`;
        ctx.beginPath();
        ctx.ellipse(w/2 - 35, eyeY, eyeW + 4, eyeH * (faceState.eyeBlink + faceState.squint) * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(w/2 + 35, eyeY, eyeW + 4, eyeH * (faceState.eyeBlink + faceState.squint) * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // ========== MOUTH ==========
    const mouthY = h/2 + 40;
    const mouthW = 30 + intensity * 15;
    const baseMouthH = 8;
    
    ctx.strokeStyle = `rgb(${r},${g},${b})`;
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    
    if (emotion === "speak" || currentState.speaking) {
        // Speaking - mouth opens with amplitude
        const mouthOpen = 4 + currentState.speechAmplitude * 25 * (0.5 + 0.5 * Math.sin(time * 15));
        ctx.fillStyle = `rgba(${r},${g},${b},0.9)`;
        ctx.beginPath();
        ctx.ellipse(w/2, mouthY, mouthW * 0.6, mouthOpen, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    } else if (emotion === "amused" || emotion === "celebrate" || emotion === "excited") {
        // Big smile
        ctx.beginPath();
        ctx.moveTo(w/2 - mouthW, mouthY);
        ctx.quadraticCurveTo(w/2, mouthY - 20 - faceState.mouthOffset, w/2 + mouthW, mouthY);
        ctx.stroke();
        
        // Dimples
        ctx.fillStyle = `rgba(${r},${g},${b},0.5)`;
        ctx.beginPath();
        ctx.arc(w/2 - mouthW * 0.7, mouthY - 5, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(w/2 + mouthW * 0.7, mouthY - 5, 4, 0, Math.PI * 2);
        ctx.fill();
    } else if (emotion === "critical" || emotion === "warning") {
        // Grimace / teeth grit
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(w/2 - mouthW * 0.6, mouthY - 3, mouthW * 1.2, 6);
        // Teeth lines
        ctx.strokeStyle = "rgba(255,255,255,0.3)";
        ctx.lineWidth = 1;
        for (let i = -2; i <= 2; i++) {
            ctx.beginPath();
            ctx.moveTo(w/2 + i * 8, mouthY - 3);
            ctx.lineTo(w/2 + i * 8, mouthY + 3);
            ctx.stroke();
        }
    } else if (emotion === "sarcastic") {
        // Smirk - one side up
        ctx.beginPath();
        ctx.moveTo(w/2 - mouthW, mouthY + 3);
        ctx.quadraticCurveTo(w/2, mouthY - 8, w/2 + mouthW, mouthY + 5);
        ctx.stroke();
    } else if (emotion === "confused") {
        // Wavy uncertain mouth
        ctx.beginPath();
        for (let x = -mouthW; x <= mouthW; x += 3) {
            const y = mouthY + Math.sin(x * 0.15 + time * 2) * 4;
            if (x === -mouthW) ctx.moveTo(w/2 + x, y); else ctx.lineTo(w/2 + x, y);
        }
        ctx.stroke();
    } else if (emotion === "disapproving" || emotion === "serious") {
        // Flat line
        ctx.beginPath();
        ctx.moveTo(w/2 - mouthW * 0.7, mouthY);
        ctx.lineTo(w/2 + mouthW * 0.7, mouthY);
        ctx.stroke();
    } else if (emotion === "think") {
        // Slight pursed / thinking
        ctx.beginPath();
        ctx.moveTo(w/2 - mouthW * 0.4, mouthY);
        ctx.quadraticCurveTo(w/2, mouthY - 5, w/2 + mouthW * 0.4, mouthY);
        ctx.stroke();
    } else {
        // Neutral slight curve
        ctx.beginPath();
        ctx.moveTo(w/2 - mouthW * 0.5, mouthY);
        ctx.quadraticCurveTo(w/2, mouthY + 3, w/2 + mouthW * 0.5, mouthY);
        ctx.stroke();
    }
    
    // ========== CHEEK BLUSH (for happy) ==========
    if (emotion === "amused" || emotion === "celebrate" || emotion === "excited") {
        ctx.fillStyle = `rgba(${Math.min(255, r+60)},${Math.max(0, g-20)},${Math.max(0, b-20)},0.2)`;
        ctx.beginPath();
        ctx.arc(w/2 - 70, h/2 + 10, 25, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(w/2 + 70, h/2 + 10, 25, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // ========== FOREHEAD WRINKLES (for thinking/concern) ==========
    if (emotion === "think" || emotion === "confused" || emotion === "critical" || emotion === "warning") {
        ctx.strokeStyle = `rgba(${r},${g},${b},0.4)`;
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(w/2 - 30, h/2 - 75 + i * 6);
            ctx.quadraticCurveTo(w/2, h/2 - 80 + i * 6, w/2 + 30, h/2 - 75 + i * 6);
            ctx.stroke();
        }
    }
    
    faceTexture.needsUpdate = true;
}

const fxParticlePositions = new Float32Array(fxParticleCount * 3);
const fxParticleVelocities = new Float32Array(fxParticleCount * 3);

// FX state
let fxState = { type: "none", timer: 0, color: new THREE.Color(0x5fd0ff) };

function triggerFX(type, color = 0x5fd0ff, count = 40) {
    fxState.type = type;
    fxState.timer = 0;
    fxState.color.setHex(color);
    
    const positions = fxParticleGeo.attributes.position.array;
    const velocities = fxParticleVelocities;
    const lifes = fxParticleLifes;
    const colors = fxParticleGeo.attributes.color.array;
    const sizes = fxParticleGeo.attributes.size.array;
    
    for (let i = 0; i < count; i++) {
        const idx = i * 3;
        // Spawn at entity center
        positions[idx] = 0;
        positions[idx + 1] = 0;
        positions[idx + 2] = 0;
        
        // Random velocity based on FX type
        let speed, spread;
        if (type === "burst") {
            speed = 0.8 + Math.random() * 1.2;
            spread = 1.0;
        } else if (type === "strobe_red" || type === "strobe_orange") {
            speed = 0.3 + Math.random() * 0.5;
            spread = 0.5;
        } else {
            speed = 0.4 + Math.random() * 0.6;
            spread = 0.8;
        }
        
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        velocities[idx] = Math.sin(phi) * Math.cos(theta) * speed;
        velocities[idx + 1] = Math.cos(phi) * speed;
        velocities[idx + 2] = Math.sin(phi) * Math.sin(theta) * speed;
        
        lifes[i] = 1.5 + Math.random() * 1.0; // life in seconds
        
        colors[idx] = fxState.color.r;
        colors[idx + 1] = fxState.color.g;
        colors[idx + 2] = fxState.color.b;
        
        sizes[i] = 0.05 + Math.random() * 0.08;
    }
    fxParticleGeo.attributes.position.needsUpdate = true;
    fxParticleGeo.attributes.color.needsUpdate = true;
    fxParticleGeo.attributes.size.needsUpdate = true;
}

// Emotion Mixer - blends between states smoothly
class EmotionMixer {
    constructor() {
        this.current = { ...BEHAVIOR_PRESETS.idle };
        this.target = { ...BEHAVIOR_PRESETS.idle };
        this.lerpSpeed = 0.08;
        this.gesturePhase = 0;
        // Use THREE.Color for proper lerping
        this.current.color = new THREE.Color(BEHAVIOR_PRESETS.idle.color);
        this.target.color = new THREE.Color(BEHAVIOR_PRESETS.idle.color);
    }

    setTarget(presetName, intensity = 1.0) {
        const preset = BEHAVIOR_PRESETS[presetName];
        if (!preset) return;
        this.target = { ...preset };
        // Apply intensity modifier
        this.target.deformation *= intensity;
        this.target.energy *= intensity;
        this.target.pulseSpeed *= (0.5 + intensity * 0.5);
        this.target.orbitSpeed *= (0.5 + intensity * 0.5);
        // Convert color to THREE.Color
        this.target.color = new THREE.Color(preset.color);
    }

    blend(presetA, presetB, factor) {
        const result = {};
        const keys = ['pulseSpeed', 'deformation', 'energy', 'asymmetry', 'leanZ', 'orbitSpeed'];
        for (const key of keys) {
            const a = presetA[key];
            const b = presetB[key];
            result[key] = a + (b - a) * factor;
        }
        // Color lerp
        result.color = new THREE.Color(presetA.color).lerp(new THREE.Color(presetB.color), factor);
        result.gesture = factor > 0.5 ? presetB.gesture : presetA.gesture;
        return result;
    }

    update(dt) {
        // Smooth lerp towards target
        const keys = ['pulseSpeed', 'deformation', 'energy', 'asymmetry', 'leanZ', 'orbitSpeed'];
        for (const key of keys) {
            this.current[key] += (this.target[key] - this.current[key]) * this.lerpSpeed * dt * 60;
        }
        // Color lerp
        this.current.color.lerp(this.target.color, this.lerpSpeed * dt * 60);
        
        this.gesturePhase += dt * this.current.orbitSpeed * 0.5;
    }

    getCurrent() {
        return this.current;
    }

    getMixedState() {
        // Return with color as THREE.Color for proper lerping in animation loop
        return {
            color: this.current.color.clone(),
            pulseSpeed: this.current.pulseSpeed,
            deformation: this.current.deformation,
            asymmetry: this.current.asymmetry,
            leanZ: this.current.leanZ,
            orbitSpeed: this.current.orbitSpeed,
            energy: this.current.energy,
            gesture: this.current.gesture
        };
    }

    getGesture() {
        return this.current.gesture;
    }
    
    setIntensity(intensity) {
        // Adjust target deformation and energy based on intensity
        const basePreset = Object.values(BEHAVIOR_PRESETS).find(p => p.color === this.target.color.getHex()) || BEHAVIOR_PRESETS.idle;
        this.target.deformation = basePreset.deformation * intensity;
        this.target.energy = basePreset.energy * intensity;
    }
}

            currentState.targetPos.copy(TARGET_POSITIONS[targetKey]);

            const dx = targetVec.x - tarsEntityGroup.position.x;
            const dz = targetVec.z - tarsEntityGroup.position.z;
            const angle = Math.atan2(dx, dz);
            tarsEntityGroup.rotation.y = angle;
            
            triggerLocationBehavior(targetKey);
            
            const activityMap = {
                "window_left": "weather_observation",
                "window_right": "weather_observation", 
                "desk": "computer_work",
                "rack-a": "server_check",
                "user": "user_interaction"
            };

            setTARSActivity(activity, targetKey, reason);
        }
    },

        currentState.targetPos.copy(pos);
        console.log(`[TARS] Move to:`, pos);
    },
    // Accepts behavioral intent JSON from LLM: { emotion, intensity, energy, urgency, gesture, movement, gaze, target }
    setBehavior(obj) {
        console.log(`[TARS] setBehavior:`, obj);
        if (obj.emotion) this.setEmotion(obj.emotion, obj.intensity || 0.5);
        if (obj.energy !== undefined) {
            currentState.energy = obj.energy;
            worldState.tars.energy = obj.energy;
        }
        if (obj.urgency !== undefined) this.setUrgency(obj.urgency);
        if (obj.gaze) this.lookAt(obj.gaze, "llm_intent");
        if (obj.movement && obj.target && TARGET_POSITIONS[obj.target]) {
            this.moveTo(TARGET_POSITIONS[obj.target]);
        }
        if (obj.gesture) {
            this.triggerGesture(obj.gesture);
        }
        // LLM intent takes control, start auto-release timer
        worldState.tars.controlMode = "llm";
        clearTimeout(window._llmReleaseTimer);
        window._llmReleaseTimer = setTimeout(() => {
            if (worldState.tars.controlMode === "llm") {
                worldState.tars.controlMode = "autonomous";
                console.log(`[TARS Control] Auto-release to autonomous (60s timeout)`);
            }
        }, 60000);
    },
    releaseControl() {
        worldState.tars.controlMode = "autonomous";
        clearTimeout(window._llmReleaseTimer);
        console.log(`[TARS Control] Explicit release to autonomous`);
    },
    triggerGesture(gesture) {
        console.log(`[TARS] Gesture: ${gesture}`);
        const gestures = {
            "nod": () => { currentState.leanZ = -0.2; setTimeout(() => currentState.leanZ = 0, 300); },
            "shake": () => { currentState.asymmetry = 0.4; setTimeout(() => currentState.asymmetry = 0, 400); },
            "pulse": () => { currentState.pulseSpeed *= 3; setTimeout(() => currentState.pulseSpeed /= 3, 200); },
            "expand": () => { currentState.scale = 1.3; setTimeout(() => currentState.scale = 1.0, 500); },
            "spin": () => { currentState.orbitSpeed *= 4; setTimeout(() => currentState.orbitSpeed /= 4, 600); }
        };
        if (gestures[gesture]) gestures[gesture]();
    }
};

// Initialize needs if not present
if (!worldState.tars.lastDecisionTime) worldState.tars.lastDecisionTime = 0;
if (!worldState.tars.currentGoal) worldState.tars.currentGoal = null;

// Set initial location to "user" (center) so time-at-location penalty works
if (worldState.tars.location === "spawn") {
    worldState.tars.location = "user";
    worldState.tars.activityStartedAt = Date.now();
}

const NEED_DECAY_RATES = {
    energy: 0.00005,        // ~6%/min - faster drain to drive movement
    curiosity: 0.00003,
    social: 0.00004,
    maintenance: 0.00002,
    comfort: 0.00003
};

const NEED_RESTORATION = {
    desk: { energy: 0.001, curiosity: 0.0005 },
    "rack-a": { energy: 0.0015, maintenance: 0.002 },
    "window_right": { curiosity: 0.002, comfort: 0.001 },
    "window_left": { curiosity: 0.0025, comfort: 0.0015 }, // Bridge view more interesting
    user: { social: 0.003, energy: 0.0005 }
};

const LOCATIONS = ["desk", "rack-a", "window_right", "window_left", "user"];

function updateNeeds(dt) {
    // Decay all needs
    for (const [need, rate] of Object.entries(NEED_DECAY_RATES)) {
        worldState.tars.needs[need] = Math.max(0, worldState.tars.needs[need] - rate * dt * 60);
    }
    
    // Restore needs based on current location
    const loc = worldState.tars.location;
    if (NEED_RESTORATION[loc]) {
        for (const [need, amount] of Object.entries(NEED_RESTORATION[loc])) {
            worldState.tars.needs[need] = Math.min(1, worldState.tars.needs[need] + amount * dt * 60);
        }
    }
    
    // Time-of-day modifiers
    const hour = new Date().getHours();
    const isNight = hour < 6 || hour > 22;
    if (isNight) {
        worldState.tars.needs.energy = Math.max(0, worldState.tars.needs.energy - 0.00005 * dt * 60);
        worldState.tars.needs.comfort = Math.max(0, worldState.tars.needs.comfort - 0.00003 * dt * 60);
    }
    
    // Weather modifiers
    const weather = worldState.environment.weather.condition;
    if (weather === "thunderstorm" || weather === "heavy_rain") {
        worldState.tars.needs.curiosity = Math.min(1, worldState.tars.needs.curiosity + 0.0001 * dt * 60);
        worldState.tars.needs.comfort = Math.max(0, worldState.tars.needs.comfort - 0.0001 * dt * 60);
    }
}

function scoreLocation(location) {
    let score = 0;
    const needs = worldState.tars.needs;
    const prefs = worldState.tars.preferences;
    const currentLoc = worldState.tars.location;
    
    // Need satisfaction potential
    const restoration = NEED_RESTORATION[location] || {};
    for (const [need, amount] of Object.entries(restoration)) {
        const deficit = 1 - needs[need];
        score += deficit * amount * 100;
    }
    
    // Location preference
    score += (prefs.locations[location] || 0.5) * 10;
    
    // Activity preference for likely activity at location
    const activityMap = {
        desk: "computer_work",
        "rack-a": "server_check",
        "window_right": "weather_observation",
        "window_left": "weather_observation",
        user: "user_interaction"
    };
    const activity = activityMap[location];
    if (activity) score += (prefs.activities[activity] || 0.5) * 10;
    
    // Weather affinity for windows
    if (location.includes("window")) {
        const weather = worldState.environment.weather.condition;
        score += (prefs.conditions[weather] || 0.5) * 15;
    }
    
    // Routine bonus
    const hour = new Date().getHours();
    const currentWeather = worldState.environment.weather.condition;
    if (hour >= 6 && hour < 10 && location === "rack-a") score += prefs.routines.morning_check * 20;
    if (hour >= 18 && hour < 22 && location === "desk") score += prefs.routines.evening_wind_down * 15;
    if (currentWeather === "thunderstorm" && location.includes("window")) score += prefs.routines.storm_watch * 25;
    
    // Avoid staying in same place too long
    if (location === currentLoc) {
        const timeHere = Date.now() - worldState.tars.activityStartedAt;
        if (timeHere > 30000) score -= 30; // Penalty after 30 sec
        if (timeHere > 90000) score -= 50; // Stronger penalty after 90 sec
    }
    
    // Distance penalty (prefer closer locations but not too strong)
    const currentPos = tarsEntityGroup.position;
    const targetPos = TARGET_POSITIONS[location];
    if (targetPos) {
        const dist = currentPos.distanceTo(targetPos);
        score -= dist * 1;  // Reduced from 2
    }
    
    // Add some randomness for organic behavior
    score += (Math.random() - 0.5) * 15;
    
    return score;
}

function makeAutonomousDecision() {
    const now = Date.now();
    // Only decide every 1-3 seconds (faster for testing)
    if (now - worldState.tars.lastDecisionTime < 1000 + Math.random() * 2000) return;
    
    // Defer to LLM control — autonomy reads needs but does not move
    if (worldState.tars.controlMode === "llm") return;
    
    // Don't interrupt active one-shot FX states (not ambient emotions)
    const blockingFx = ["strobe_orange", "strobe_red", "strobe", "bounce", "expansive"];
    if (currentState.fx && blockingFx.includes(currentState.fx)) return;
    
    // Score all locations
    const scores = LOCATIONS.map(loc => ({ location: loc, score: scoreLocation(loc) }));
    scores.sort((a, b) => b.score - a.score);
    
    const best = scores[0];
    const current = worldState.tars.location;
    
    // Always log scores for debugging
    console.log(`[TARS Autonomy] Scores:`, scores.map(s => `${s.location}:${s.score.toFixed(1)}`).join(" | "));
    
    // Only switch if significantly better or current is very poor
    const currentScore = scoreLocation(current);
    if (best.location !== current && (best.score > currentScore + 3 || currentScore < 40)) {
        worldState.tars.lastDecisionTime = now;
        worldState.tars.currentGoal = best.location;
        
        console.log(`[TARS Autonomy] MOVING: ${best.location} (${best.score.toFixed(1)}) vs ${current} (${currentScore.toFixed(1)})`);
        console.log(`[TARS Autonomy] Needs:`, Object.entries(worldState.tars.needs).map(([k,v]) => `${k}:${(v*100).toFixed(0)}%`).join(" "));
        
        // Trigger move
        window.TARS.lookAt(best.location);
        
        // Set emotion based on activity
        const emotionMap = {
            desk: "think",
            "rack-a": "listen",
            "window_right": "think",
            "window_left": "chill",
            user: "listen"
        };
        if (emotionMap[best.location]) {
            window.TARS.setEmotion(emotionMap[best.location], 0.5 + Math.random() * 0.3);
        }
    }
}

// Expose autonomy for debugging
