<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T.A.R.S. World v0.4 — Embodiment System</title>

<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070a;
        font-family: Arial, sans-serif;
    }

    #scene { position: fixed; inset: 0; }

    #hud {
        position: fixed;
        top: 20px;
        left: 24px;
        z-index: 10;
        color: rgba(210, 235, 255, 0.75);
        pointer-events: none;
        text-shadow: 0 0 12px rgba(80, 180, 255, 0.6);
    }

    #hud .title { font-size: 13px; letter-spacing: 5px; font-weight: bold; }
    #hud .status { margin-top: 8px; font-size: 10px; letter-spacing: 2px; opacity: 0.65; }

    #status {
        position: fixed;
        bottom: 20px;
        left: 24px;
        z-index: 10;
        color: rgba(170, 210, 235, 0.55);
        font-size: 10px;
        letter-spacing: 2px;
        pointer-events: none;
    }

    #hint {
        position: fixed;
        bottom: 20px;
        right: 24px;
        z-index: 10;
        color: rgba(170, 210, 235, 0.35);
        font-size: 9px;
        letter-spacing: 1px;
        pointer-events: none;
    }

    /* T.A.R.S. Interactive Control Console */
    .btn {
        background: rgba(20, 35, 50, 0.8);
        border: 1px solid rgba(80, 180, 255, 0.3);
        color: #9fe6ff;
        padding: 6px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 10px;
        letter-spacing: 1px;
        transition: all 0.2s ease;
    }

    .btn:hover {
        background: rgba(40, 80, 120, 0.9);
        border-color: #5fd0ff;
        color: #fff;
        box-shadow: 0 0 8px rgba(95, 208, 255, 0.4);
    }

    .status-badge {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 3px;
        font-weight: bold;
        background: rgba(0, 170, 255, 0.2);
        color: #5fd0ff;
        border: 1px solid rgba(0, 170, 255, 0.4);
    }

    /* ===== TARS OBSERVATORY UI SYSTEM — Phase 7.4 ===== */
    #tars-status-header {
        position: fixed; top: 0; left: 0; right: 0; z-index: 30;
        height: 28px; background: rgba(5,8,12,0.85); backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(80,180,255,0.2);
        display: flex; align-items: center; padding: 0 14px;
        font-size: 10px; letter-spacing: 1px; color: rgba(210,235,255,0.6);
        pointer-events: none;
    }
    #tars-status-header > * { pointer-events: auto; }
    .status-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }
    .status-dot.online { background:#4ade80; box-shadow:0 0 6px rgba(74,222,128,0.6); }
    .status-divider { margin:0 8px; opacity:0.3; }
    #tars-status-activity { color:#5fd0ff; }
    #tars-status-badge { margin-left:auto; font-size:9px; opacity:0.5; }

    #tars-toolbar {
        position: fixed; right: 20px; top: 50%; transform: translateY(-50%); z-index: 40;
        display: flex; flex-direction: column; gap: 6px;
    }
    .tars-tab-btn {
        width: 48px; height: 48px; border-radius: 10px;
        background: rgba(10,16,24,0.8); backdrop-filter: blur(8px);
        border: 1px solid rgba(80,180,255,0.25);
        color: rgba(210,235,255,0.6); font-size: 18px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.2s;
        -webkit-tap-highlight-color: transparent;
    }
    .tars-tab-btn:hover, .tars-tab-btn.active { background: rgba(30,60,90,0.9); border-color: #5fd0ff; color: #fff; box-shadow: 0 0 12px rgba(95,208,255,0.3); }

    #tars-overlay {
        position: fixed; right: 80px; top: 44px; bottom: 16px; z-index: 35;
        width: min(420px, 45vw); display: none;
        background: rgba(8,14,22,0.92); backdrop-filter: blur(16px);
        border: 1px solid rgba(80,180,255,0.2); border-radius: 12px;
        box-shadow: 0 4px 32px rgba(0,0,0,0.6);
        pointer-events: auto; overflow: hidden;
    }
    #tars-overlay.visible { display: flex; flex-direction: column; }
    #tars-overlay-header {
        display: flex; align-items: center; padding: 12px 16px;
        border-bottom: 1px solid rgba(80,180,255,0.15);
        font-size: 11px; letter-spacing: 2px; color: #5fd0ff; flex-shrink: 0;
    }
    #tars-overlay-close {
        margin-left: auto; background: none; border: none;
        color: rgba(210,235,255,0.4); font-size: 16px; cursor: pointer; padding: 4px 8px;
    }
    #tars-overlay-body {
        flex: 1; overflow-y: auto; padding: 12px 16px;
        font-size: 11px; color: rgba(210,235,255,0.8);
    }
    #tars-overlay-body::-webkit-scrollbar { width: 4px; }
    #tars-overlay-body::-webkit-scrollbar-thumb { background: rgba(80,180,255,0.3); border-radius: 2px; }

    .tars-data-row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid rgba(80,180,255,0.06); }
    .tars-data-label { color: rgba(210,235,255,0.5); }
    .tars-data-value { color: #8ab4f8; font-weight: bold; }
    .tars-section { margin-bottom: 14px; }
    .tars-section-title { font-size: 9px; letter-spacing: 2px; color: rgba(95,208,255,0.5); margin-bottom: 6px; text-transform: uppercase; }
    .tars-need-bar { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
    .tars-need-bar label { width: 70px; font-size: 10px; color: rgba(210,235,255,0.6); flex-shrink: 0; }
    .tars-need-track { flex: 1; height: 6px; background: rgba(80,180,255,0.1); border-radius: 3px; overflow: hidden; }
    .tars-need-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
    .tars-need-fill.energy { background: #facc15; }
    .tars-need-fill.curiosity { background: #5fd0ff; }
    .tars-need-fill.social { background: #a78bfa; }
    .tars-need-fill.maintenance { background: #4ade80; }
    .tars-need-fill.comfort { background: #fb923c; }
    .tars-need-fill.hunger { background: #f87171; }
    .tars-need-pct { width: 32px; text-align: right; font-size: 10px; color: rgba(210,235,255,0.5); }

    /* Journal timeline */
    .tars-journal-entry { padding: 4px 0; border-bottom: 1px solid rgba(80,180,255,0.06); font-size: 10px; }
    .tars-journal-time { color: rgba(210,235,255,0.35); margin-right: 6px; }
    .tars-journal-act { color: #5fd0ff; }
    .tars-journal-loc { color: rgba(210,235,255,0.4); }
    .tars-journal-reason { color: rgba(210,235,255,0.3); font-style: italic; }

    /* Chat panel */
    #tars-chat {
        position: fixed; bottom: 16px; right: 16px; z-index: 45;
        width: min(340px, 85vw); max-height: 60vh;
        background: rgba(8,14,22,0.94); backdrop-filter: blur(16px);
        border: 1px solid rgba(80,180,255,0.2); border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        display: none; flex-direction: column; overflow: hidden;
    }
    #tars-chat.visible { display: flex; }
    #tars-chat-header {
        display: flex; align-items: center; padding: 10px 14px;
        border-bottom: 1px solid rgba(80,180,255,0.12);
        font-size: 10px; letter-spacing: 1px; color: #5fd0ff; flex-shrink: 0;
    }
    #tars-chat-close { margin-left: auto; background: none; border: none; color: rgba(210,235,255,0.4); cursor: pointer; font-size: 14px; padding: 2px 6px; }
    #tars-chat-messages { flex: 1; overflow-y: auto; padding: 10px 14px; min-height: 80px; max-height: 35vh; font-size: 11px; }
    #tars-chat-messages::-webkit-scrollbar { width: 3px; }
    #tars-chat-messages::-webkit-scrollbar-thumb { background: rgba(80,180,255,0.2); border-radius: 2px; }
    .tars-msg { padding: 6px 10px; margin-bottom: 6px; border-radius: 8px; max-width: 85%; word-wrap: break-word; }
    .tars-msg.system { background: rgba(80,180,255,0.08); color: rgba(210,235,255,0.5); align-self: flex-start; }
    .tars-msg.user { background: rgba(95,208,255,0.12); color: #8ab4f8; margin-left: auto; }
    .tars-msg.tars { background: rgba(20,50,80,0.3); color: #5fd0ff; }
    #tars-chat-input { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid rgba(80,180,255,0.1); flex-shrink: 0; }
    #tars-chat-input-field { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(80,180,255,0.15); border-radius: 6px; padding: 8px 10px; color: #d2ebff; font-size: 12px; outline: none; min-height: 36px; }
    #tars-chat-input-field::placeholder { color: rgba(210,235,255,0.25); }
    #tars-chat-send { background: rgba(95,208,255,0.15); border: 1px solid rgba(95,208,255,0.3); border-radius: 6px; color: #5fd0ff; font-size: 11px; cursor: pointer; padding: 8px 14px; min-height: 36px; white-space: nowrap; }

    /* Empty state */
    .tars-empty { text-align: center; padding: 30px 0; color: rgba(210,235,255,0.25); font-size: 11px; letter-spacing: 1px; }

    /* ===== CREATOR CONSOLE — Phase 7.4 Correction ===== */
    .tars-creator-section { margin-bottom: 14px; }
    .tars-creator-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
    .tars-creator-stat { padding: 4px 0; font-size: 10px; border-bottom: 1px solid rgba(80,180,255,0.06); }
    .tars-creator-stat .label { color: rgba(210,235,255,0.45); }
    .tars-creator-stat .value { color: #5fd0ff; font-weight: bold; float: right; }
    .tars-creator-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .tars-creator-actions .btn { min-height: 38px; font-size: 10px; padding: 6px 10px; flex: 1 0 auto; min-width: 70px; }
    .tars-creator-actions .btn-sm { min-height: 30px; font-size: 9px; padding: 4px 8px; flex: 0 0 auto; }

    /* Collapsible sections */
    .tars-collapse-section { border: 1px solid rgba(80,180,255,0.1); border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
    .tars-collapse-header { display: flex; align-items: center; gap: 6px; padding: 8px 10px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: rgba(95,208,255,0.55); cursor: pointer; user-select: none; background: rgba(80,180,255,0.04); }
    .tars-collapse-header:hover { background: rgba(80,180,255,0.08); }
    .tars-collapse-header .arrow { color: rgba(95,208,255,0.35); font-size: 8px; transition: transform 0.2s; }
    .tars-collapse-header .badge { font-size: 8px; color: rgba(210,235,255,0.2); font-weight: normal; letter-spacing: 0; }
    .tars-collapse-body { padding: 8px 10px; border-top: 1px solid rgba(80,180,255,0.06); }
    .tars-collapse-body.collapsed { display: none; }

    /* Inject buttons (+10/-10) */
    .tars-inject-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .tars-inject-row { display: flex; align-items: center; gap: 6px; min-height: 34px; }
    .tars-inject-row label { width: 56px; font-size: 10px; color: rgba(210,235,255,0.6); flex-shrink: 0; text-transform: capitalize; }
    .tars-inject-btn { min-height: 28px; min-width: 40px; font-size: 10px; padding: 2px 8px; border: 1px solid rgba(80,180,255,0.15); border-radius: 4px; background: rgba(80,180,255,0.08); color: #8ab4f8; cursor: pointer; text-align: center; }
    .tars-inject-btn:active { background: rgba(80,180,255,0.2); }
    .tars-inject-btn.plus { color: #4ade80; border-color: rgba(74,222,128,0.2); }
    .tars-inject-btn.minus { color: #f87171; border-color: rgba(248,113,113,0.2); }
    .tars-inject-val { font-size: 10px; color: rgba(210,235,255,0.35); width: 20px; text-align: center; }

    /* Telemetry + Memory (unchanged) */
    .tars-console { background: rgba(0,0,0,0.3); border-radius: 6px; border: 1px solid rgba(80,180,255,0.08); padding: 6px; max-height: 180px; overflow-y: auto; font-size: 9px; font-family: monospace; }
    .tars-console::-webkit-scrollbar { width: 3px; }
    .tars-console::-webkit-scrollbar-thumb { background: rgba(80,180,255,0.15); border-radius: 2px; }
    .tars-console-entry { padding: 2px 4px; border-bottom: 1px solid rgba(80,180,255,0.04); color: rgba(210,235,255,0.5); line-height: 1.5; }
    .tars-console-entry .ts { color: rgba(210,235,255,0.25); }
    .tars-console-entry .act { color: #5fd0ff; }
    .tars-console-entry .action { color: #a78bfa; }
    .tars-console-entry .loc { color: rgba(210,235,255,0.35); }

    .tars-memory-card { background: rgba(0,0,0,0.2); border-radius: 6px; padding: 8px; margin: 4px 0; font-size: 10px; }
    .tars-memory-card .mem-row { display: flex; justify-content: space-between; padding: 2px 0; color: rgba(210,235,255,0.5); }
    .tars-memory-card .mem-row .val { color: #8ab4f8; }

    .tars-feedback { font-size: 9px; color: #4ade80; padding: 2px 0; min-height: 14px; transition: opacity 0.3s; }

    /* Expandable journal entries */
    .tars-journal-entry { cursor: pointer; transition: background 0.15s; border-radius: 3px; padding: 3px 4px; }
    .tars-journal-entry:hover { background: rgba(80,180,255,0.06); }
    .tars-journal-detail { display: none; margin: 4px 0 4px 8px; padding: 4px 6px; border-left: 1px solid rgba(80,180,255,0.12); font-size: 9px; }
    .tars-journal-detail.open { display: block; }
    .tars-journal-detail .comp-row { display: flex; justify-content: space-between; padding: 1px 8px; }
    .tars-journal-detail .comp-row .cl { color: rgba(210,235,255,0.45); }
    .tars-journal-detail .comp-row .cv { text-align: right; }
    .tars-journal-detail .comp-total { border-top: 1px solid rgba(80,180,255,0.1); margin-top: 2px; padding-top: 2px; font-weight: bold; }
    .tars-journal-detail .alt-row { display: flex; justify-content: space-between; padding: 1px 8px; color: rgba(210,235,255,0.35); font-size: 8px; }

    /* Phase 8.2 — TARS OS Navigation Shell */
    #tars-nav-bar {
        position: fixed; bottom: 0; left: 0; right: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(8, 12, 20, 0.85);
        backdrop-filter: blur(6px);
        border-top: 1px solid rgba(80, 180, 255, 0.08);
        padding: 4px env(safe-area-inset-right, 8px) 4px env(safe-area-inset-left, 8px);
        z-index: 800;
        gap: 2px;
        min-height: 52px;
    }
    .tars-nav-btn {
        flex: 1; max-width: 100px;
        background: transparent;
        border: 1px solid transparent;
        color: rgba(210, 235, 255, 0.35);
        font-size: 9px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 8px 4px;
        cursor: pointer;
        border-radius: 4px;
        transition: color 0.2s, border-color 0.2s, background 0.2s;
        text-align: center;
        min-height: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        line-height: 1.2;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
    }
    .tars-nav-btn:hover { color: rgba(210, 235, 255, 0.6); background: rgba(80, 180, 255, 0.04); }
    .tars-nav-btn:active { background: rgba(80, 180, 255, 0.08); }
    .tars-nav-btn.active { color: #5fd0ff; border-color: rgba(95, 208, 255, 0.2); background: rgba(95, 208, 255, 0.06); }
    .tars-nav-btn .nav-icon { font-size: 14px; line-height: 1; }

    #tars-screen-container {
        position: fixed; top: 0; left: 0; right: 0;
        bottom: 56px;
        z-index: 750;
        pointer-events: none;
        overflow: hidden;
    }
    #tars-screen-container.active {
        pointer-events: auto;
    }
    .tars-screen {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        overflow-y: auto;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
        padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
    }
    .tars-screen.active {
        opacity: 1;
        pointer-events: auto;
    }
    .tars-screen-inner {
        max-width: 600px;
        margin: 0 auto;
    }

    /* World screen — minimal overlay */
    .tars-world-screen {
        pointer-events: none;
    }
    .tars-world-screen .tars-world-badge {
        display: inline-block;
        background: rgba(8, 12, 20, 0.6);
        border: 1px solid rgba(80, 180, 255, 0.1);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 10px;
        color: rgba(210, 235, 255, 0.5);
    }

    /* Dashboard screens — semi-transparent overlay panels */
    .tars-dashboard {
        background: rgba(8, 12, 20, 0.7);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(80, 180, 255, 0.06);
        border-radius: 8px;
        padding: 12px;
    }
    .tars-dashboard-title {
        font-size: 10px;
        letter-spacing: 2px;
        color: rgba(95, 208, 255, 0.5);
        text-transform: uppercase;
        margin-bottom: 10px;
    }
    .tars-dashboard-row {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        font-size: 10px;
        border-bottom: 1px solid rgba(80, 180, 255, 0.04);
    }
    .tars-dashboard-row:last-child { border-bottom: none; }
    .tars-dashboard-row .label { color: rgba(210, 235, 255, 0.4); }
    .tars-dashboard-row .value { color: #d2ebff; font-variant-numeric: tabular-nums; }

    /* Connection indicator */
    #tars-connection-dot {
        display: inline-block;
        width: 8px; height: 8px;
        border-radius: 50%;
        margin: 0 6px;
        transition: background 0.3s, box-shadow 0.3s;
        flex-shrink: 0;
    }
    #tars-connection-dot.connecting { background: #fb923c; box-shadow: 0 0 4px #fb923c; }
    #tars-connection-dot.connected { background: #4ade80; box-shadow: 0 0 4px #4ade80; }
    #tars-connection-dot.disconnected { background: #f87171; box-shadow: 0 0 4px #f87171; }
    #tars-connection-dot.unknown { background: rgba(210, 235, 255, 0.15); }

    #tars-alert-count {
        display: inline-block;
        font-size: 8px;
        font-weight: bold;
        color: #f87171;
        background: rgba(248, 113, 113, 0.1);
        border: 1px solid rgba(248, 113, 113, 0.2);
        border-radius: 8px;
        padding: 0 5px;
        min-width: 14px;
        text-align: center;
        line-height: 14px;
        margin: 0 4px;
        flex-shrink: 0;
        transition: opacity 0.3s;
    }
    #tars-alert-count.empty { opacity: 0; pointer-events: none; }
    #tars-alert-count.warning { color: #eab308; border-color: rgba(234, 179, 8, 0.3); background: rgba(234, 179, 8, 0.08); }
    #tars-alert-count.critical { color: #f87171; border-color: rgba(248, 113, 113, 0.3); background: rgba(248, 113, 113, 0.1); }

    /* Placeholder screen */
    .tars-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 200px;
        color: rgba(210, 235, 255, 0.2);
        font-size: 11px;
        text-align: center;
        gap: 8px;
    }
    .tars-placeholder .icon { font-size: 28px; opacity: 0.3; }
    .tars-placeholder .desc { font-size: 9px; color: rgba(210, 235, 255, 0.15); max-width: 280px; }

</head>

<body>

<div id="scene"></div>

<div id="hud">
    <div class="title">T.A.R.S. // WORLD</div>
    <div class="status">EMBODIMENT ENGINE // ACTIVE</div>
</div>

<div id="status">EMOTION: <span id="current-emotion" class="status-badge">IDLE</span> | MODE: <span id="current-mode" class="status-badge">LIVE</span></div>
<div id="hint">MOVE POINTER TO EXPLORE</div>



<!-- ===== TARS OBSERVATORY UI — Phase 7.4 ===== -->
<div id="tars-status-header">
    <span class="status-dot online" id="tars-status-dot"></span>
    <span id="tars-status-label">AUTONOMY</span>
    <span class="status-divider">|</span>
    <span id="tars-status-activity">initializing</span>
    <span class="status-divider">|</span>
    <span id="tars-status-location">—</span>
    <span id="tars-status-badge">🧠 OFFLINE</span>
</div>

<div id="tars-toolbar">
    <button class="tars-tab-btn" data-tab="brain" title="Cognitive State">🧠</button>
    <button class="tars-tab-btn" data-tab="observatory" title="Developer Observatory">📊</button>
    <button class="tars-tab-btn" data-tab="journal" title="Activity Journal">📜</button>
    <button class="tars-tab-btn" data-tab="conversation" title="Conversation">💬</button>
    <button class="tars-tab-btn" data-tab="settings" title="Settings">⚙</button>
</div>

<div id="tars-overlay">
    <div id="tars-overlay-header">
        <span id="tars-overlay-title">OBSERVATORY</span>
        <button id="tars-overlay-close">✕</button>
    </div>
    <div id="tars-overlay-body"></div>
</div>

<div id="tars-chat">
    <div id="tars-chat-header">
        <span>💬 TARS // COMMS</span>
        <button id="tars-chat-close">✕</button>
    </div>
    <div id="tars-chat-messages"></div>
    <div id="tars-chat-input">
        <input type="text" id="tars-chat-input-field" placeholder="Message TARS..." autocomplete="off">
        <button id="tars-chat-send">SEND</button>
    </div>
</div>

<!-- Phase 8.2 — TARS OS Navigation Shell -->
<div id="tars-screen-container"></div>
<div id="tars-nav-bar">
    <button class="tars-nav-btn" data-screen="world" title="TARS World">
        <span class="nav-icon">⊙</span> TARS

// ============================================================
// HELPERS
// ============================================================

function material(color, roughness = 0.8, metalness = 0) {
    return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}

function glowMaterial(color) {
    return new THREE.MeshBasicMaterial({ color, toneMapped: false });
}

function makeCanvas(w, h) {
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    return { canvas, ctx: canvas.getContext("2d") };
}

function canvasTexture(draw, w = 512, h = 512) {
    const { canvas, ctx } = makeCanvas(w, h);
    draw(ctx, w, h);
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.needsUpdate = true;
    return tex;
}

function circleSpriteTexture() {
    return canvasTexture((ctx, w, h) => {
        const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
        g.addColorStop(0, "rgba(255,255,255,1)");
        g.addColorStop(0.4, "rgba(255,255,255,0.9)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
    }, 32, 32);
}
const dotSprite = circleSpriteTexture();

const animatedScreens = [];
function registerAnimatedScreen(w, h, drawFn, refreshRate = 0.12) {
    const { canvas, ctx } = makeCanvas(w, h);
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    const entry = { ctx, w, h, tex, drawFn, refreshRate, nextUpdate: 0 };
    animatedScreens.push(entry);
    return tex;
}

const room = new THREE.Group();

// ============================================================

// Left window exterior - Bridge/River view (different from right window city view)
const lexterior = new THREE.Group();

// Left window building window texture function
function lbuildingWindowTex() {
    return canvasTexture((ctx, w, h) => {
        ctx.fillStyle = "#050a10";
        ctx.fillRect(0, 0, w, h);
        for (let y = 8; y < h; y += 14) {
            for (let x = 6; x < w; x += 14) {
                if (Math.random() > 0.5) {
                    ctx.fillStyle = Math.random() > 0.5 ? "#ffcd8a" : "#8fd0ff";
                    ctx.fillRect(x, y, 6, 8);
                }
            }
        }
    }, 128, 256);
}

// --- Parallax Bridge Layers ---
const lbridgeLayers = [];

// Layer 1: Distant hills/mountains (furthest)
const lhillsGeo = new THREE.PlaneGeometry(50, 12);
const lhillsTex = canvasTexture((ctx, w, h) => {
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, "#0a121a");
    grad.addColorStop(0.5, "#0f1a2a");
    grad.addColorStop(1, "#142335");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    // Distant mountain silhouettes
    ctx.fillStyle = "#0d1826";
    for (let i = 0; i < 8; i++) {
        const mx = (Math.random() - 0.5) * w * 0.9;
        const mw = 40 + Math.random() * 80;
        const mh = 20 + Math.random() * 40;
        ctx.beginPath();
        ctx.moveTo(mx, h);
        ctx.lineTo(mx - mw/2, h - mh);
        ctx.lineTo(mx + mw/2, h - mh);
        ctx.closePath();
        ctx.fill();
    }
}, 256, 128);
const lhillsMat = new THREE.MeshBasicMaterial({ map: lhillsTex, transparent: true, opacity: 0.7, fog: false });

}

// DAY / NIGHT CYCLE
// ============================================================

const NIGHT_SKY = new THREE.Color(0x03050a);
const DAY_SKY = new THREE.Color(0x2f5a82);
const WARM_TINT = new THREE.Color(0xff9a52);
const MOON_COLOR = new THREE.Color(0xd8e8ff);
const SUN_COLOR = new THREE.Color(0xfff3d6);
const NIGHT_GLOW = new THREE.Color(0x1679c9);
const DAY_GLOW = new THREE.Color(0xcfe9ff);

function bell(hours, center, width) {
    const d = Math.abs(((hours - center + 12 + 24) % 24) - 12);
    return Math.max(0, 1 - d / width);
}

function updateDayNight() {
    const now = new Date();
    const hours = now.getHours() + now.getMinutes() / 60;
    const t = hours / 24;

    const dayFactor = Math.cos((t - 0.5) * Math.PI * 2) * 0.5 + 0.5;
    const dawn = bell(hours, 6.5, 2.2);
    const dusk = bell(hours, 19.5, 2.2);
    const warmth = Math.min(1, dawn + dusk);

    const sky = new THREE.Color().lerpColors(NIGHT_SKY, DAY_SKY, dayFactor).lerp(WARM_TINT, warmth * 0.35);
    skyPlane.material.color.copy(sky);
    lskyPlane.material.color.copy(sky.clone().lerp(new THREE.Color(0x081220), 0.3));

    const glow = new THREE.Color().lerpColors(NIGHT_GLOW, DAY_GLOW, dayFactor).lerp(WARM_TINT, warmth * 0.5);
    windowGlow.color.copy(glow);
    windowGlow.intensity = 6 + dayFactor * 8 + warmth * 4;
    lwindowGlow.color.copy(glow.clone().lerp(new THREE.Color(0x104a7c), 0.4));
    lwindowGlow.intensity = 4 + dayFactor * 6 + warmth * 3;

    ambientLight.intensity = 1.0 + dayFactor * 0.7;

    const angle = t * Math.PI * 2 - Math.PI / 2;
    celestial.position.x = Math.cos(angle) * 3.2;
    celestial.position.y = 4 + Math.sin(angle) * 5.5;
    const aboveHorizon = celestial.position.y > 0.5 ? 1 : 0;
    celestial.material.opacity = aboveHorizon * (0.6 + warmth * 0.4);
    celestial.material.color.copy(dayFactor > 0.5 ? SUN_COLOR : MOON_COLOR).lerp(WARM_TINT, warmth * 0.6);

    lcelestial.position.x = Math.cos(angle + 0.5) * 3.2;
    lcelestial.position.y = 4 + Math.sin(angle + 0.5) * 5.5;
    const laboveHorizon = lcelestial.position.y > 0.5 ? 1 : 0;
    lcelestial.material.opacity = laboveHorizon * (0.6 + warmth * 0.4);
    lcelestial.material.color.copy(dayFactor > 0.5 ? SUN_COLOR : MOON_COLOR).lerp(WARM_TINT, warmth * 0.6);

    stars.material.opacity = (1 - dayFactor) * 0.85;
    lstars.material.opacity = (1 - dayFactor) * 0.85;

    buildings.forEach(mat => { mat.emissiveIntensity = 0.15 + (1 - dayFactor) * 0.75; });
    lbuildings.forEach(mat => { mat.emissiveIntensity = 0.15 + (1 - dayFactor) * 0.75; });
    lfarBuildings.forEach(mat => { mat.emissiveIntensity = 0.1 + (1 - dayFactor) * 0.6; });

    // Car headlights/taillights intensity based on time of day
    lcarLights.forEach((lights, i) => {
        const isNight = dayFactor < 0.4;
        const intensity = isNight ? 1.0 : 0.1;
        lights.left.material.opacity = intensity;
        lights.right.material.opacity = intensity;
        lights.leftTail.material.opacity = intensity * 0.8;
        lights.rightTail.material.opacity = intensity * 0.8;
    });

    return dayFactor;
}

function drawSchematic(ctx, w, h) {
    ctx.fillStyle = "#050c14";
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "rgba(70,150,200,0.25)";
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 24) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = 0; y < h; y += 24) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    ctx.strokeStyle = "#5fd0ff";
    ctx.lineWidth = 3;
    ctx.strokeRect(w * 0.32, h * 0.15, w * 0.36, h * 0.6);
    for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(w * 0.32, h * (0.25 + i * 0.1));
        ctx.lineTo(w * 0.32 + w * 0.36, h * (0.25 + i * 0.1));
        ctx.stroke();
    }
    ctx.fillStyle = "#5fd0ff";
    for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc(w * (0.15 + i * 0.14), h * 0.85, 4, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.font = "12px monospace";
    ctx.fillStyle = "rgba(150,210,240,0.6)";
    ctx.fillText("UNIT// SCHEMATIC 07-A", w * 0.08, h * 0.92);
}

function drawNebula(ctx, w, h) {
    const grad = ctx.createRadialGradient(w * 0.4, h * 0.4, 10, w * 0.4, h * 0.4, w * 0.7);
    grad.addColorStop(0, "#5a2d8f");
    grad.addColorStop(0.4, "#22376b");
    grad.addColorStop(1, "#020409");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 180; i++) {
        ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.8})`;
        ctx.beginPath();
        ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 1.4, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawCircuit(ctx, w, h) {
    ctx.fillStyle = "#07131a";
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "#e0a752";
    ctx.lineWidth = 2;
    let x = 20, y = h * 0.5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    for (let i = 0; i < 14; i++) {
        x += 20 + Math.random() * 20;
        y += (Math.random() - 0.5) * 60;
        y = Math.max(20, Math.min(h - 20, y));
        ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = "#5fd0ff";
    for (let i = 0; i < 20; i++) {
        ctx.beginPath();
        ctx.arc(Math.random() * w, Math.random() * h, 2.5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function createFramedArt({ x, y, z, rotY = 0, width = 1.6, height = 1.1, draw, glow = 0.2 }) {
    const group = new THREE.Group();
    group.position.set(x, y, z);
    group.rotation.y = rotY;
    room.add(group);

    const tex = canvasTexture(draw);
    const artMat = new THREE.MeshStandardMaterial({
        map: tex, roughness: 0.7, emissive: 0x223344, emissiveMap: tex, emissiveIntensity: glow
    });
    const artPlane = new THREE.Mesh(new THREE.PlaneGeometry(width, height), artMat);
    group.add(artPlane);

    const frameMat = material(0x1a1410, 0.6, 0.3);
    const t = 0.07;
    const topBar = new THREE.Mesh(new THREE.BoxGeometry(width + t * 2, t, 0.06), frameMat);
    topBar.position.set(0, height / 2 + t / 2, -0.02);
    group.add(topBar);
    const botBar = topBar.clone();
    botBar.position.y = -height / 2 - t / 2;
    group.add(botBar);
    const leftBar = new THREE.Mesh(new THREE.BoxGeometry(t, height, 0.06), frameMat);
    leftBar.position.set(-width / 2 - t / 2, 0, -0.02);
    group.add(leftBar);
    const rightBar = leftBar.clone();
    rightBar.position.x = width / 2 + t / 2;
    group.add(rightBar);

    return group;
}

function drawTerminal(ctx, w, h, time) {
    ctx.fillStyle = "#040d14";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#4fd6ff";
    ctx.font = "13px monospace";
    const load = Math.floor(4 + Math.sin(time * 0.6) * 3 + 4);
    const loadBar = "|".repeat(Math.max(1, load)) + ".".repeat(Math.max(0, 10 - load));
    const cursor = Math.floor(time * 2) % 2 === 0 ? "_" : " ";
    const lines = [
        "> tars.core.status()",
        "SYS  : nominal",
        "PWR  : " + (95 + Math.sin(time * 0.4) * 3).toFixed(1) + "%",
        "TEMP : " + (40 + Math.sin(time * 0.9) * 2).toFixed(0) + "C",
        "NET  : " + (1.1 + Math.sin(time * 1.3) * 0.2).toFixed(1) + "gbps",
        "LOAD : " + loadBar,
        "> awaiting input" + cursor
    ];
    lines.forEach((l, i) => ctx.fillText(l, 14, 30 + i * 22));
    ctx.strokeStyle = "rgba(79,214,255,0.4)";
    ctx.strokeRect(2, 2, w - 4, h - 4);
}

function drawWaveform(ctx, w, h, time) {
    ctx.fillStyle = "#050a12";
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "#5fd0ff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x < w; x++) {
        const y = h / 2 + Math.sin(x * 0.05 + time * 2) * 20 * Math.sin(x * 0.003 + time * 0.5) + (Math.random() - 0.5) * 6;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = "#ff8b6b";
    for (let i = 0; i < 8; i++) {
        const bx = 20 + i * (w / 9);
        const bh = 10 + (Math.sin(time * 3 + i) * 0.5 + 0.5) * (h - 30);
        ctx.fillRect(bx, h - bh, 10, bh);
    }
}

// TARS OS Interface - shows when TARS is at desk
function drawTARSOS(ctx, w, h, time) {
    ctx.fillStyle = "#02060a";
    ctx.fillRect(0, 0, w, h);
    
    // Scanline effect
    ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
    for (let y = 0; y < h; y += 3) {
        ctx.fillRect(0, y + (time * 30) % 3, w, 1);
    }
    
    // Header bar
    const headerH = 36;
    const grad = ctx.createLinearGradient(0, 0, 0, headerH);
    grad.addColorStop(0, "rgba(30, 50, 80, 0.9)");
    grad.addColorStop(1, "rgba(10, 20, 40, 0.95)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, headerH);
    ctx.strokeStyle = "rgba(95, 208, 255, 0.3)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, headerH);
    ctx.lineTo(w, headerH);
    ctx.stroke();
    
    // TARS logo
    ctx.fillStyle = "#5fd0ff";
    ctx.font = "bold 16px monospace";
    ctx.fillText("T.A.R.S. OS v0.9", 16, 24);
    
    // Status indicator
    const statusColor = currentState.emotion === "critical" ? "#ff2200" :
                        currentState.emotion === "warning" ? "#ff8800" :
                        currentState.emotion === "celebrate" ? "#00ff44" :
                        currentState.emotion === "speak" ? "#00d2ff" : "#4fe07a";
    ctx.fillStyle = statusColor;
    ctx.beginPath();
    ctx.arc(w - 28, headerH / 2, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.font = "11px monospace";
    ctx.fillText(currentState.emotion.toUpperCase(), w - 120, headerH / 2 + 4);
    
    // Main content area
    const contentY = headerH + 20;
    const lineH = 22;
    
    // System metrics
    ctx.fillStyle = "#5fd0ff";
    ctx.font = "12px monospace";
    const metrics = [
        `CORE TEMP: ${(42 + Math.sin(time * 0.7) * 3).toFixed(1)}°C`,
        `POWER: ${(94 + Math.sin(time * 0.5) * 2).toFixed(1)}%`,
        `NETWORK: ${(1.2 + Math.sin(time * 1.1) * 0.15).toFixed(2)} GB/s`,
        `MEMORY: ${Math.floor(65 + Math.sin(time * 0.3) * 5)}%`,
        `PROCESSES: ${Math.floor(47 + Math.sin(time * 0.4) * 3)}`,
        `UPTIME: ${Math.floor(time / 3600)}h ${Math.floor((time % 3600) / 60)}m ${Math.floor(time % 60)}s`
    ];
    
    metrics.forEach((m, i) => {
        ctx.fillText(m, 20, contentY + i * lineH);
    });
    
    // Activity log
    ctx.fillStyle = "rgba(95, 208, 255, 0.6)";
    ctx.fillText("ACTIVITY LOG:", 20, contentY + 7 * lineH);
    
    const activities = [
        "> neural_net.optimize()",
        "> memory.consolidate()", 
        "> sensors.poll()",
        "> network.sync()",
        "> idle.monitor()"
    ];
    
    ctx.font = "11px monospace";
    activities.forEach((a, i) => {
        const alpha = 0.3 + 0.7 * Math.sin(time * 2 + i) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(95, 208, 255, ${alpha})`;
        ctx.fillText(a, 28, contentY + 8.5 * lineH + i * 18);
    });
    
    // Bottom bar
    ctx.fillStyle = "rgba(10, 20, 40, 0.9)";
    ctx.fillRect(0, h - 30, w, 30);
    ctx.strokeStyle = "rgba(95, 208, 255, 0.2)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, h - 30);
    ctx.lineTo(w, h - 30);
    ctx.stroke();
    
    ctx.fillStyle = "#5fd0ff";
    ctx.font = "10px monospace";
    const cursor = Math.floor(time * 2) % 2 === 0 ? "_" : " ";

let monitor1State = 'terminal'; // 'terminal' | 'tarsOS' | 'matrix' | 'starfield' | 'syslogs' | 'codeReview' | 'logCleanup'
let monitor2State = 'waveform'; // 'waveform' | 'matrix' | 'starfield' | 'syslogs'
let monitorIdleTimer = 0;
let monitorIdleTimeout = 8000; // 8 seconds to screensaver

function setMonitorState(monitor, state) {
    if (monitor === 1) {
        monitor1State = state;
    } else if (monitor === 2) {
        monitor2State = state;
    }
    updateMonitorDrawFunctions();
}

function updateMonitorDrawFunctions() {
    const m1 = animatedScreens.find(s => s.drawFn === drawTerminal || s.drawFn === drawTARSOS || s.drawFn === drawMatrix || s.drawFn === drawStarfield || s.drawFn === drawSysLogs || s.drawFn === drawCodeReview || s.drawFn === drawLogCleanup);
    const m2 = animatedScreens.find(s => s.drawFn === drawWaveform || s.drawFn === drawMatrix || s.drawFn === drawStarfield || s.drawFn === drawSysLogs);
    if (!m1 || !m2) return;
    
    // Monitor 1
    switch (monitor1State) {
        case 'terminal': m1.drawFn = drawTerminal; break;
        case 'tarsOS': m1.drawFn = drawTARSOS; break;
        case 'matrix': m1.drawFn = drawMatrix; break;
        case 'starfield': m1.drawFn = drawStarfield; break;
        case 'syslogs': m1.drawFn = drawSysLogs; break;
        case 'codeReview': m1.drawFn = drawCodeReview; break;
        case 'logCleanup': m1.drawFn = drawLogCleanup; break;
    }
    
    // Monitor 2
    switch (monitor2State) {
        case 'waveform': m2.drawFn = drawWaveform; break;
        case 'matrix': m2.drawFn = drawMatrix; break;
        case 'starfield': m2.drawFn = drawStarfield; break;
        case 'syslogs': m2.drawFn = drawSysLogs; break;
    }
}

function drawMatrix(ctx, w, h, time) {
    ctx.fillStyle = "rgba(0,10,0,0.15)";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#0f0";
    ctx.font = "14px monospace";
    if (!drawMatrix.drops) drawMatrix.drops = Array(40).fill(0).map(() => Math.random() * -300);
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()";
    for (let i = 0; i < drawMatrix.drops.length; i++) {
        const char = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(char, i * 20, drawMatrix.drops[i]);
        drawMatrix.drops[i] += 20;
        if (drawMatrix.drops[i] > h) drawMatrix.drops[i] = Math.random() * -100;
    }
}

function drawStarfield(ctx, w, h, time) {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#fff";
    if (!drawStarfield.stars) drawStarfield.stars = Array(100).fill(0).map(() => ({
        x: Math.random(), y: Math.random(), z: Math.random(), speed: 0.01 + Math.random() * 0.02
    }));
    drawStarfield.stars.forEach(s => {
        s.z -= s.speed;
        if (s.z <= 0) s.z = 1;
        const sx = (s.x - 0.5) / s.z * w + w/2;
        const sy = (s.y - 0.5) / s.z * h + h/2;
        const size = (1 - s.z) * 3;
        if (sx > 0 && sx < w && sy > 0 && sy < h) {
            ctx.fillRect(sx, sy, size, size);
        }
    });
}

function drawSysLogs(ctx, w, h, time) {
    ctx.fillStyle = "#040d14";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#4fd6ff";
    ctx.font = "12px monospace";
    const logs = [
        "[SYS] Memory scrub complete",
        "[NET] Connection pool refreshed",
        "[FS] Integrity check: OK",
        "[GPU] Temp: 42C, Load: 12%",
        "[AI] Dream cycle: processing...",
        "[PWR] Battery: 99.2%",
        "[SEC] No intrusions detected"
    ];
    logs.forEach((l, i) => {
        const alpha = 0.3 + 0.7 * Math.abs(Math.sin(time * 0.5 + i));
        ctx.fillStyle = `rgba(79,214,255,${alpha})`;
        ctx.fillText(l, 14, 30 + i * 22);
    });
}

function drawCodeReview(ctx, w, h, time) {
    ctx.fillStyle = "#050c14";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "rgba(0,255,136,0.8)";

}

function drawLogCleanup(ctx, w, h, time) {

function updateMonitorIdle(dt) {
    // If at desk, reset idle timer and show active states
    if (currentState.atDesk) {
        monitorIdleTimer = 0;
        const screensaverStates = ['matrix', 'starfield', 'syslogs', 'codeReview', 'logCleanup'];
        if (screensaverStates.includes(monitor1State)) {
            setMonitorState(1, 'tarsOS');
        }
        if (screensaverStates.includes(monitor2State)) {
            setMonitorState(2, 'waveform');
        }
    } else {
        // Away from desk - start idle timer
        monitorIdleTimer += dt * 1000;
        if (monitorIdleTimer > monitorIdleTimeout) {
            // Cycle through screensaver states
            if (monitor1State === 'terminal' || monitor1State === 'tarsOS' || monitor1State === 'codeReview' || monitor1State === 'logCleanup') {
                setMonitorState(1, 'matrix');
            } else if (monitor1State === 'matrix') {
                setMonitorState(1, 'starfield');
            } else if (monitor1State === 'starfield') {
                setMonitorState(1, 'syslogs');
            } else if (monitor1State === 'syslogs') {
                setMonitorState(1, 'matrix');
            }
            if (monitor2State === 'waveform') {
                setMonitorState(2, 'matrix');
            } else if (monitor2State === 'matrix') {
                setMonitorState(2, 'starfield');
            } else if (monitor2State === 'starfield') {
                setMonitorState(2, 'syslogs');
            } else if (monitor2State === 'syslogs') {
                setMonitorState(2, 'waveform');
            }
        }
    }
}

function createFan(radius = 0.16) {
    const fanGroup = new THREE.Group();
    const ring = new THREE.Mesh(new THREE.RingGeometry(radius * 0.75, radius, 24), material(0x0c1013, 0.5, 0.3));
    fanGroup.add(ring);
    const blades = new THREE.Group();
    for (let i = 0; i < 5; i++) {
        const blade = new THREE.Mesh(new THREE.PlaneGeometry(radius * 0.55, radius * 0.16), material(0x1a2126, 0.4, 0.3));
        blade.position.x = radius * 0.35;
        blade.rotation.z = (i / 5) * Math.PI * 2;
        blades.add(blade);
    }
    fanGroup.add(blades);
    const hub = new THREE.Mesh(new THREE.CircleGeometry(radius * 0.15, 12), glowMaterial(0xff3b3b));
    hub.position.z = 0.01;
    fanGroup.add(hub);
    rackFans.push(blades);
    return fanGroup;
}

function addUnitLEDs(parent, unitY, count, palette, spread = 1.15) {

        const color = palette[Math.floor(Math.random() * palette.length)];

        led.position.set(-spread / 2 + (j / (count - 1 || 1)) * spread, unitY, 0.62);
        parent.add(led);
        serverLEDs.push({ mesh: led, phase: Math.random() * Math.PI * 2, speed: 2 + Math.random() * 4 });
    }
}

function buildRack(originX, originZ, unitTypes) {
    const rack = new THREE.Group();
    rack.position.set(originX, 0, originZ);
    rack.castShadow = true;
    room.add(rack);

    const rackHeight = 0.7 + unitTypes.length * UNIT_PITCH;
    const shellMat = material(0x090d12, 0.6, 0.55);
    const shellThick = 0.08;
    const shellDepth = 1.3;
    const shellTop = new THREE.Mesh(new THREE.BoxGeometry(1.6, shellThick, shellDepth), shellMat);
    shellTop.position.set(0, rackHeight, 0);
    shellTop.castShadow = true;
    rack.add(shellTop);
    const shellBottom = new THREE.Mesh(new THREE.BoxGeometry(1.6, shellThick, shellDepth), shellMat);
    shellBottom.position.set(0, 0, 0);
    rack.add(shellBottom);
    const shellLeft = new THREE.Mesh(new THREE.BoxGeometry(shellThick, rackHeight, shellDepth), shellMat);
    shellLeft.position.set(-0.8, rackHeight / 2, 0);
    shellLeft.castShadow = true;
    rack.add(shellLeft);
    const shellRight = shellLeft.clone();
    shellRight.position.x = 0.8;
    rack.add(shellRight);
    const shellBack = new THREE.Mesh(new THREE.BoxGeometry(1.6, rackHeight, shellThick), shellMat);
    shellBack.position.set(0, rackHeight / 2, -0.65 + shellThick / 2);
    rack.add(shellBack);

    for (const rx of [-0.78, 0.78]) {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(0.05, rackHeight, 1.32), material(0x14191f, 0.4, 0.5));
        rail.position.set(rx, rackHeight / 2, 0);
        rack.add(rail);
    }

    unitTypes.forEach((type, i) => {
        const unitY = 0.5 + i * UNIT_PITCH;
        if (type === "patch") buildPatchPanelUnit(rack, unitY);
        else if (type === "switch") buildSwitchUnit(rack, unitY, i === 0 ? "UBNT US-24-250W" : "UBNT US-24");
        else if (type === "filler") buildFillerUnit(rack, unitY);
        else buildServerUnit(rack, unitY);
    });

    const screenLabel = "NODE " + Math.floor(Math.random() * 90 + 10);
    const screenTex = registerAnimatedScreen(256, 96, (ctx, w, h) => drawRackScreen(ctx, w, h, screenLabel), 0.3);
    const statusScreen = new THREE.Mesh(
        new THREE.PlaneGeometry(0.9, 0.3),
        new THREE.MeshStandardMaterial({ map: screenTex, emissiveMap: screenTex, emissive: 0xffffff, emissiveIntensity: 0.9 })
    );
    statusScreen.position.set(0, rackHeight - 0.35, 0.646);
    rack.add(statusScreen);

    for (const fx of [-0.4, 0.4]) {
        const fan = createFan(0.18);
        fan.position.set(fx, rackHeight + 0.02, 0);
        fan.rotation.x = -Math.PI / 2;
        rack.add(fan);
    }

    for (let c = 0; c < 3; c++) {
        const cx = -0.5 + c * 0.5;
        const cable = makeCable([
            new THREE.Vector3(cx, 0.5, -0.6),
            new THREE.Vector3(cx + 0.1, 0.25, -0.4),
            new THREE.Vector3(cx + 0.15, 0.02, -0.1)
        ]);
        rack.add(cable);
    }

    const rackGlow = new THREE.PointLight(0x2ec8ff, 3.5, 4.5);
    rackGlow.position.set(0, rackHeight * 0.55, 0.5);
    rack.add(rackGlow);

    return rack;
}

function getAvoidanceVector(pos, target, dt) {
    const avoid = new THREE.Vector3();
    const radius = 0.8; // TARS body radius + margin
    
    for (const obs of OBSTACLES) {
        const dx = pos.x - obs.x;
        const dz = pos.z - obs.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        const dangerDist = obs.radius + radius + 0.5;
        
        if (dist < dangerDist) {
            // Repulsion force
            const force = (dangerDist - dist) / dangerDist;
            const pushX = (dx / dist) * force * 0.15;
            const pushZ = (dz / dist) * force * 0.15;
            avoid.x += pushX;
            avoid.z += pushZ;
        }
    }
    
    // Room bounds
    const margin = 1.0;
    if (pos.x < ROOM_BOUNDS.xMin + margin) avoid.x += (ROOM_BOUNDS.xMin + margin - pos.x) * 0.05;
    if (pos.x > ROOM_BOUNDS.xMax - margin) avoid.x += (ROOM_BOUNDS.xMax - margin - pos.x) * 0.05;
    if (pos.z < ROOM_BOUNDS.zMin + margin) avoid.z += (ROOM_BOUNDS.zMin + margin - pos.z) * 0.05;
    if (pos.z > ROOM_BOUNDS.zMax - margin) avoid.z += (ROOM_BOUNDS.zMax - margin - pos.z) * 0.05;
    
    return avoid;
}

const TARS_SAVE_VERSION = 2;
const STORAGE_KEY = "tars_world_state_v1";
const SAVE_INTERVAL_MS = 30000;

const WorldPersistence = {
    capture() {
        return {
            version: TARS_SAVE_VERSION,
            savedAt: Date.now(),
            savedAtISO: new Date().toISOString(),
            tars: {
                location: worldState.tars.location,
                activity: worldState.tars.activity,
                activityStartedAt: worldState.tars.activityStartedAt,
                activityEndsAt: worldState.tars.activityEndsAt,
                activityReason: worldState.tars.activityReason,
                locationRecency: { ...worldState.tars.locationRecency },
                activityRecency: { ...worldState.tars.activityRecency },
                previousActivity: worldState.tars.previousActivity,
                mood: worldState.tars.mood,
                energy: worldState.tars.energy,
                needs: { ...(worldState.tars.needs || {}) },
                activityFatigue: { ...(worldState.tars.activityFatigue || {}) },
                experienceBuffer: (worldState.tars.experienceBuffer || []).slice(-100),
                preferences: JSON.parse(JSON.stringify(worldState.tars.preferences))
            },
            environment: {
                weather: { ...worldState.environment.weather },
                timeOfDay: worldState.environment.timeOfDay,
                temperature: worldState.environment.temperature
            },
            worldMemory: (worldState.worldMemory || []).slice()
        };
    },

    save() {
        try {
            const snapshot = this.capture();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
            return true;
        } catch (e) {
            console.warn("[WorldPersistence] Save failed:", e.message);
            return false;
        }
    },

    load() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return null;
            const data = JSON.parse(raw);
            if (!this.validate(data)) return null;
            return data;
        } catch (e) {
            console.warn("[WorldPersistence] Load failed:", e.message);
            return null;
        }
    },

    validate(data) {
        if (!data || typeof data !== "object") return false;
        if (data.version < 1 || data.version > TARS_SAVE_VERSION) return false;
        if (!data.tars || typeof data.tars !== "object") return false;
        if (!data.environment || typeof data.environment !== "object") return false;
        return true;
    },

    applyToState(data) {
        if (!data) return false;
        const t = data.tars;
        worldState.tars.location = t.location || "spawn";
        worldState.tars.activity = t.activity || "idle";
        worldState.tars.activityStartedAt = t.activityStartedAt || Date.now();
        worldState.tars.activityReason = t.activityReason || "session_restore";
        worldState.tars.previousActivity = t.previousActivity || null;
        worldState.tars.mood = t.mood || "neutral";
        worldState.tars.energy = typeof t.energy === "number" ? t.energy : 0.7;
        worldState.tars.controlMode = "autonomous";
        if (t.needs) worldState.tars.needs = { ...t.needs };
        if (t.preferences) worldState.tars.preferences = JSON.parse(JSON.stringify(t.preferences));
        if (t.activityFatigue) worldState.tars.activityFatigue = { ...t.activityFatigue };
        if (t.experienceBuffer && Array.isArray(t.experienceBuffer)) {
            worldState.tars.experienceBuffer = t.experienceBuffer.slice(-100);
        }
        // Persist activityEndsAt — if the original end time hasn't passed yet in real time, keep it
        if (t.activityEndsAt) {
            worldState.tars.activityEndsAt = Math.max(t.activityEndsAt, Date.now());
        } else {
            worldState.tars.activityEndsAt = Date.now() + 5000;
        }
        // Persist locationRecency — shift timestamps forward by elapsed offline time
        if (t.locationRecency && data.savedAt) {
            const elapsed = Date.now() - data.savedAt;
            worldState.tars.locationRecency = {};
            for (const [loc, ts] of Object.entries(t.locationRecency)) {
                worldState.tars.locationRecency[loc] = ts + elapsed;
            }
        }
        // Persist activityRecency — shift timestamps forward by elapsed offline time
        if (t.activityRecency && data.savedAt) {
            const elapsed = Date.now() - data.savedAt;
            worldState.tars.activityRecency = {};
            for (const [act, ts] of Object.entries(t.activityRecency)) {
                worldState.tars.activityRecency[act] = ts + elapsed;
            }
        }
        const e = data.environment;
        if (e.weather) worldState.environment.weather = { ...e.weather };
        if (e.timeOfDay !== undefined) worldState.environment.timeOfDay = e.timeOfDay;
        if (e.temperature !== undefined) worldState.environment.temperature = e.temperature;
        if (data.worldMemory && Array.isArray(data.worldMemory)) {
            worldState.worldMemory = data.worldMemory;
        }
        worldState.session.previousSessionEnd = data.savedAt || null;
        const elapsedMs = Date.now() - (data.savedAt || Date.now());
        worldState.session.totalElapsed = elapsedMs;
        console.log(`[WorldPersistence] Restored from ${data.savedAtISO} (${(elapsedMs / 1000).toFixed(0)}s elapsed)`);
        return true;
    }
};

// Log an event to both runtime activityLog and persistent worldMemory
function persistWorldEvent(event) {
    if (!worldState.worldMemory) worldState.worldMemory = [];
    worldState.worldMemory.push(event);
    if (worldState.worldMemory.length > worldState.maxWorldMemorySize) {
        worldState.worldMemory.shift();
    }
}

// Log a curated event (activityLog + worldMemory)
function logWorldEvent(eventType, activity, location, reason, metadata = {}) {
    const event = logActivityEvent(eventType, activity, location, reason, metadata);
    persistWorldEvent(event);
    return event;
}

// Offline need change rates (compressed — per hour of elapsed time, not per frame)
const OFFLINE_NEED_RATES_PER_HOUR = {
    energy: 0.08,        // recovers ~8%/hour while offline (resting)
    curiosity: 0.12,     // rises ~12%/hour (misses stimulation)
    social: 0.15,        // rises ~15%/hour (misses interaction)
    maintenance: 0.06,   // rises ~6%/hour
    comfort: 0.10,       // rises ~10%/hour
    hunger: 0.20         // rises ~20%/hour (no food source offline)
};

function processOfflineElapsed() {
    const elapsedMs = worldState.session.totalElapsed;
    if (!elapsedMs || elapsedMs < 60000) return; // skip if <1 min

    const hours = elapsedMs / 3600000;
    const clampedHours = Math.min(hours, 168); // cap at 1 week

    const previousNeeds = { ...worldState.tars.needs };
    const needs = worldState.tars.needs;

    for (const [need, ratePerHour] of Object.entries(OFFLINE_NEED_RATES_PER_HOUR)) {
        const delta = ratePerHour * clampedHours;
        if (need === "energy") {
            needs[need] = Math.min(1, (needs[need] || 0.5) + delta);
        } else {
            needs[need] = Math.max(0, Math.min(1, (needs[need] || 0.5) + delta));
        }
    }

    const durationStr = hours >= 24
        ? `${(hours / 24).toFixed(1)}d`
        : `${hours.toFixed(1)}h`;

    console.log(`[Offline] ${durationStr} elapsed:`, Object.entries(needs).map(([k, v]) =>
        `${k}:${(v * 100).toFixed(0)}% (was ${(previousNeeds[k] * 100).toFixed(0)}%)`
    ).join(" "));

    worldState._offlineEvent = {
        eventType: "offline_elapsed",
        durationMs: elapsedMs,
        durationHours: hours,
        durationLabel: durationStr,
        previousNeeds,
        resultingNeeds: { ...needs }
    };
}

// Session return context
function getSessionReturnContext() {
    const elapsed = worldState.session.totalElapsed || 0;
    const prevEnd = worldState.session.previousSessionEnd;
    const hours = elapsed / 3600000;

    let absenceCategory = "first_session";
    if (prevEnd) {
        if (hours < 0.5) absenceCategory = "brief";
        else if (hours < 4) absenceCategory = "moderate";
        else if (hours < 24) absenceCategory = "extended";
        else absenceCategory = "long_absence";
    }

    return {
        sessionId: worldState.session.id,
        previousSessionEnd: prevEnd ? new Date(prevEnd).toISOString() : null,
        awayDurationMs: elapsed,
        awayDurationLabel: hours >= 24
            ? `${(hours / 24).toFixed(1)} days`
            : `${hours.toFixed(1)} hours`,
        absenceCategory,
        needs: { ...worldState.tars.needs },
        previousActivity: worldState.tars.previousActivity,
        currentLocation: worldState.tars.location,
        currentActivity: worldState.tars.activity,
        environment: {
            weather: worldState.environment.weather.condition,
            timeOfDay: worldState.environment.timeOfDay
        },
        offlineEvent: worldState._offlineEvent || null
    };
}

// LLM-ready context API
const EMOTION_VALUES = ["idle", "listen", "think", "speak", "sarcastic", "amused", "confused", "serious", "warning", "critical", "celebrate", "chill", "disapproving", "excited"];
const GESTURE_VALUES = ["nod", "shake", "pulse", "expand", "spin"];
const TARGET_VALUES = ["window_left", "window_right", "desk", "rack-a", "user"];
const MOVEMENT_VALUES = ["walk", "drift", "rush"];

function getTARSContext() {
    const session = getSessionReturnContext();
    const hour = new Date().getHours();
    const isNight = hour < 6 || hour > 22;
    const history = worldState.tars.autonomyHistory || [];

    // Behavioral summary from decision history
    const activityCounts = {};
    for (const d of history) {
        const a = d.selectedActivity || "?";
        activityCounts[a] = (activityCounts[a] || 0) + 1;
    }
    const totalDecisions = history.length;
    const sortedActivities = Object.entries(activityCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(([id, count]) => ({ id, count, proportion: totalDecisions > 0 ? +(count / totalDecisions).toFixed(3) : 0 }));

    // Recent decisions with score context (deep copied)
    const recentDecisions = history.slice(-10).reverse().map(d => ({
        timestamp: d.timestamp,
        action: d.decisionAction,
        activity: d.selectedActivity,
        location: d.selectedLocation,
        reason: d.decisionReason,
        score: d.decisionScore !== undefined ? +d.decisionScore.toFixed(2) : null,
        scoreComponents: d.scoreComponents ? { ...d.scoreComponents } : null,
        alternatives: d.alternatives ? d.alternatives.map(a => ({ id: a.id, score: a.score })) : null
    }));

    return {
        currentState: {
            location: worldState.tars.location,
            activity: worldState.tars.activity,
            activityReason: worldState.tars.activityReason,
            mood: worldState.tars.mood,
            energy: worldState.tars.energy,
            controlMode: worldState.tars.controlMode
        },
        internalNeeds: { ...worldState.tars.needs },
        currentActivity: {
            id: worldState.tars.activity,
            location: worldState.tars.location,
            startedAt: worldState.tars.activityStartedAt,
            reason: worldState.tars.activityReason,
            duration: Date.now() - worldState.tars.activityStartedAt
        },
        recentEvents: (worldState.activityLog || []).slice(-10).reverse().map(e => ({
            activity: e.activity || e.type,
            location: e.location,
            reason: e.reason,
            time: e.timestamp
        })),
        recentDecisions,
        behavioralSummary: {
            totalDecisions,
            mostFrequent: sortedActivities,
            tendency: {
                exploration: totalDecisions > 0
                    ? +(sortedActivities.filter(a => ["weather_observation","idle"].includes(a.id)).reduce((s, a) => s + a.proportion, 0)).toFixed(3)
                    : 0,
                maintenance: totalDecisions > 0
                    ? +(sortedActivities.filter(a => a.id === "server_check").reduce((s, a) => s + a.proportion, 0)).toFixed(3)
                    : 0,
                social: totalDecisions > 0
                    ? +(sortedActivities.filter(a => a.id === "user_interaction").reduce((s, a) => s + a.proportion, 0)).toFixed(3)
                    : 0,
                rest: totalDecisions > 0
                    ? +(sortedActivities.filter(a => ["tv_watching","idle"].includes(a.id)).reduce((s, a) => s + a.proportion, 0)).toFixed(3)
                    : 0
            }
        },
        environment: {
            weather: worldState.environment.weather.condition,
            timeOfDay: worldState.environment.timeOfDay,
            temperature: worldState.environment.temperature,
            isNight
        },
        sessionReturn: {
            awayDurationLabel: session.awayDurationLabel,
            absenceCategory: session.absenceCategory,
            offlineNeedsChange: session.offlineEvent ? {
                previous: { ...(session.offlineEvent.previousNeeds || {}) },
                resulting: { ...(session.offlineEvent.resultingNeeds || {}) }
            } : null
        },
        preferences: JSON.parse(JSON.stringify(worldState.tars.preferences)),
        availableActions: {
            emotions: [...EMOTION_VALUES],
            gestures: [...GESTURE_VALUES],
            gazeTargets: [...TARGET_VALUES],
            movements: [...MOVEMENT_VALUES],
            activities: Object.keys(ACTIVITY_REGISTRY)
        },
        locations: Object.fromEntries(
            Object.entries(worldState.room?.locations || {}).map(([k, v]) => [k, { x: v.x, z: v.z }])
        )
    };

// Phase 6: Event interruption system — external events can queue to influence behavior
const pendingEvents = [];

function queueWorldEvent(label, priority, metadata = {}) {
    const event = {
        id: `evt_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`,
        label,
        priority,
        metadata,
        queuedAt: Date.now()
    };
    pendingEvents.push(event);
    console.log(`[WorldEvent] Queued: "${label}" (priority ${priority})`);
    return event;
}

function processWorldEvents() {
    if (pendingEvents.length === 0) return;
    if (worldState.tars.controlMode === "llm") {
        // LLM is active — queue events for later, don't interrupt
        return;
    }
    // Sort by priority descending, take highest
    pendingEvents.sort((a, b) => b.priority - a.priority);
    const top = pendingEvents[pendingEvents.length - 1];
    if (!top) return;

    const currentActivity = ACTIVITY_REGISTRY[worldState.tars.activity];
    const currentPriority = currentActivity ? currentActivity.priority : PRIORITY.LOW;

    if (top.priority > currentPriority) {
        console.log(`[WorldEvent] Interrupting for: "${top.label}" (pri ${top.priority} > ${currentPriority})`);
        const evt = pendingEvents.pop();
        persistWorldEvent({
            eventType: "world_event",
            label: evt.label,
            priority: evt.priority,
            metadata: evt.metadata,
            timestamp: new Date().toISOString()
        });
        worldState.activityLog.push({
            type: "interruption",
            activity: "interruption_" + evt.label,
            location: evt.metadata?.gazeTarget || null,
            reason: "world_event",
            timestamp: new Date().toISOString(),
            event: evt.label,
            priority: evt.priority,
            interruptedActivity: worldState.tars.activity
        });
        if (worldState.activityLog.length > worldState.maxActivityLogSize) {
            worldState.activityLog.shift();
        }
        // Set TARS to investigate — gaze toward relevant location if specified
        if (evt.metadata?.gazeTarget) {
            window.TARS.lookAt(evt.metadata.gazeTarget, "environmental_event");
        } else {
            window.TARS.lookAt("user", "environmental_event");
        }
    } else {
        // Event not important enough to interrupt — drain it silently
        pendingEvents.pop();
    }
}

// Expose for external systems
window.queueWorldEvent = queueWorldEvent;
window.pendingEvents = pendingEvents;

// Helper: Log a meaningful activity event
function logActivityEvent(eventType, activity, location, reason, metadata = {}) {
    const event = {
        id: `evt_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
        timestamp: new Date().toISOString(),
        eventType,
        activity,
        location,
        reason,
        metadata
    };
    worldState.activityLog.push(event);
    if (worldState.activityLog.length > worldState.maxActivityLogSize) {
        worldState.activityLog.shift();
    }
    console.log(`[ActivityLog] ${eventType}: ${activity} at ${location} (${reason})`, metadata);
    return event;
}

// Helper: Update TARS activity state
function setTARSActivity(activity, location, reason, metadata = {}) {
    const now = Date.now();
    const prevActivity = worldState.tars.activity;
    const prevLocation = worldState.tars.location;
    const isNewActivity = prevActivity !== "idle" && prevActivity !== activity;
    const isNewLocation = prevLocation !== location;

    if (isNewActivity) {
        worldState.tars.previousActivity = {
            activity: prevActivity,
            location: prevLocation,
            duration: now - worldState.tars.activityStartedAt,
            endedAt: now
        };
    }

    if (isNewLocation && prevLocation && prevLocation !== "spawn") {
        worldState.tars.locationRecency[prevLocation] = now;
    }

    if (isNewActivity && prevActivity && prevActivity !== "idle") {
        worldState.tars.activityRecency[prevActivity] = now;
    }

    // Phase 7.2A: Record activity transition telemetry (lightweight, not a decision)
    if (isNewActivity || isNewLocation) {
        if (AUTONOMY_TELEMETRY_DEBUG) {
            const transitionType = isNewActivity ? "activity_start" : "location_change";
            console.log(`[TARS TRANSITION] ${transitionType}: ${prevActivity}@${prevLocation} → ${activity}@${location} (${reason})`);
        }
    }

    worldState.tars.activity = activity;
    worldState.tars.location = location;
    worldState.tars.activityStartedAt = now;
    worldState.tars.activityReason = reason;

    // Compute natural activity end time from registry metadata
    const reg = ACTIVITY_REGISTRY[activity];
    if (reg && reg.minDuration !== undefined) {
        const durSec = reg.minDuration + Math.random() * (reg.maxDuration - reg.minDuration);
        worldState.tars.activityEndsAt = now + durSec * 1000;
    } else {
        worldState.tars.activityEndsAt = now + 15000;
    }

    logActivityEvent("activity_started", activity, location, reason, metadata);
    if (isNewActivity && worldState.tars.previousActivity) {
        logActivityEvent("activity_completed", prevActivity, prevLocation, reason, {
            duration: worldState.tars.previousActivity.duration
        });
        // Apply completion effects for previous activity
        const prevEffects = ACTIVITY_EFFECTS[prevActivity];
        if (prevEffects && prevEffects.onCompletion) {
            for (const [need, amount] of Object.entries(prevEffects.onCompletion)) {
                worldState.tars.needs[need] = Math.max(0, Math.min(1, worldState.tars.needs[need] + amount));
            }
        }
    }
    debugLog("Activity set:", { activity, location, reason, previousActivity: worldState.tars.previousActivity?.activity, endsAt: new Date(worldState.tars.activityEndsAt).toISOString() });
    logStateChange("activity_set", { activity, location, reason });
    WorldPersistence.save();
}

// Helper: Get current activity summary for LLM queries
function getTARSActivitySummary() {
    return {
        controlMode: worldState.tars.controlMode,
        location: worldState.tars.location,
        activity: worldState.tars.activity,
        activityStartedAt: new Date(worldState.tars.activityStartedAt).toISOString(),
        activityReason: worldState.tars.activityReason,
        mood: worldState.tars.mood,

        previousActivity: worldState.tars.previousActivity,
        environment: {
            weather: worldState.environment.weather,
            timeOfDay: worldState.environment.timeOfDay
        }
    };
}

            rain.material.opacity = config.rain.intensity === "heavy" ? 0.8 : 0.7;
            // Left window rain
            lrainGroup.visible = true;
            const lCount = config.rain.intensity === "heavy" ? 500 : 200;
            if (lCount !== lrainCount) {
                lrainCount = lCount;
                lrainSpeeds = new Float32Array(lrainCount);
                const lpos = lrain.geometry.attributes.position.array;
                const newLpos = new Float32Array(lrainCount * 3);

                    newLpos[i * 3] = lwinLeft + Math.random() * LWIN_W;
                    newLpos[i * 3 + 1] = lwinBottom + Math.random() * (LWIN_H + 2);
                    newLpos[i * 3 + 2] = -Math.random() * 2.5;
                    lrainSpeeds[i] = (config.rain.intensity === "heavy" ? 0.06 : 0.04) + Math.random() * 0.03;

const faceCanvas = document.createElement("canvas");

const faceCtx = faceCanvas.getContext("2d");
const faceTexture = new THREE.CanvasTexture(faceCanvas);
faceTexture.colorSpace = THREE.SRGBColorSpace;

// Face animation state
let faceState = {
    eyeBlink: 0,
    blinkTimer: 0,
    expression: "neutral",
    expressionTimer: 0,
    eyebrowOffset: 0,
    mouthOffset: 0,
    squint: 0,
    lookDir: { x: 0, y: 0 },
    pupilDilation: 1.0
};

function drawFace(time) {
    const ctx = faceCtx;
    const w = faceCanvas.width, h = faceCanvas.height;
    ctx.clearRect(0, 0, w, h);
    
    const emotion = currentState.emotion;
    const intensity = currentState.intensity;
    const pulse = Math.sin(time * currentState.pulseSpeed) * 0.5 + 0.5;
    
    // Update face state
    faceState.blinkTimer -= 1/60;
    if (faceState.blinkTimer <= 0) {
        faceState.eyeBlink = 1;
        faceState.blinkTimer = 2 + Math.random() * 4;
    }
    if (faceState.eyeBlink > 0) {
        faceState.eyeBlink = Math.max(0, faceState.eyeBlink - 0.15);
    }
    
    faceState.expressionTimer -= 1/60;
    if (faceState.expressionTimer <= 0) {
        faceState.expression = ["neutral", "curious", "focused", "amused"][Math.floor(Math.random() * 4)];
        faceState.expressionTimer = 3 + Math.random() * 5;
    }
    
    // Emotion-driven face parameters
    const preset = BEHAVIOR_PRESETS[emotion] || BEHAVIOR_PRESETS.idle;
    const faceColor = new THREE.Color(preset.color);
    const r = Math.floor(faceColor.r * 255);
    const g = Math.floor(faceColor.g * 255);
    const b = Math.floor(faceColor.b * 255);
    
    // Base face glow
    const glowAlpha = 0.2 + pulse * 0.3 + intensity * 0.2;
    ctx.fillStyle = `rgba(${r},${g},${b},${glowAlpha})`;
    ctx.beginPath();
    ctx.arc(w/2, h/2, 110, 0, Math.PI * 2);
    ctx.fill();
    
    // Face shape
    ctx.fillStyle = `rgba(${Math.min(255, r+30)},${Math.min(255, g+30)},${Math.min(255, b+30)},0.15)`;
    ctx.beginPath();
    ctx.ellipse(w/2, h/2 + 10, 90, 100, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // ========== EYEBROWS ==========
    ctx.strokeStyle = `rgb(${r},${g},${b})`;
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    const browY = h/2 - 55;
    const browW = 35;
    
    // Left eyebrow
    ctx.beginPath();
    if (emotion === "critical" || emotion === "warning" || emotion === "serious" || emotion === "disapproving") {
        // Angry/down
        ctx.moveTo(w/2 - 45, browY + faceState.eyebrowOffset);
        ctx.lineTo(w/2 - 10, browY - 8 + faceState.eyebrowOffset);
    } else if (emotion === "confused") {
        // Uneven
        ctx.moveTo(w/2 - 45, browY - 5 + faceState.eyebrowOffset);
        ctx.lineTo(w/2 - 10, browY + 3 + faceState.eyebrowOffset);
    } else if (emotion === "amused" || emotion === "celebrate" || emotion === "excited") {
        // Raised happy
        ctx.moveTo(w/2 - 45, browY - 8 + faceState.eyebrowOffset);
        ctx.quadraticCurveTo(w/2 - 27, browY - 15 + faceState.eyebrowOffset, w/2 - 10, browY - 5 + faceState.eyebrowOffset);
    } else if (emotion === "sarcastic") {
        // One up, one down
        ctx.moveTo(w/2 - 45, browY - 10 + faceState.eyebrowOffset);
        ctx.lineTo(w/2 - 10, browY + 5 + faceState.eyebrowOffset);
    } else {
        // Neutral/relaxed
        ctx.moveTo(w/2 - 45, browY + faceState.eyebrowOffset);
        ctx.quadraticCurveTo(w/2 - 27, browY - 5 + faceState.eyebrowOffset, w/2 - 10, browY + faceState.eyebrowOffset);
    }
    ctx.stroke();
    
    // Right eyebrow
    ctx.beginPath();
    if (emotion === "critical" || emotion === "warning" || emotion === "serious" || emotion === "disapproving") {
        ctx.moveTo(w/2 + 10, browY - 8 - faceState.eyebrowOffset);
        ctx.lineTo(w/2 + 45, browY - faceState.eyebrowOffset);
    } else if (emotion === "confused") {
        ctx.moveTo(w/2 + 10, browY + 3 - faceState.eyebrowOffset);
        ctx.lineTo(w/2 + 45, browY - 5 - faceState.eyebrowOffset);
    } else if (emotion === "sarcastic") {
        ctx.moveTo(w/2 + 10, browY + 5 - faceState.eyebrowOffset);
        ctx.lineTo(w/2 + 45, browY - 10 - faceState.eyebrowOffset);
    } else {
        ctx.moveTo(w/2 + 10, browY - faceState.eyebrowOffset);
        ctx.quadraticCurveTo(w/2 + 27, browY - 5 - faceState.eyebrowOffset, w/2 + 45, browY - faceState.eyebrowOffset);
    }
    ctx.stroke();
    
    // ========== EYES ==========
    const eyeY = h/2 - 20;
    const eyeW = 28 - faceState.squint * 10;
    const eyeH = (32 - faceState.squint * 16) * (1 - faceState.eyeBlink);
    const pupilSize = (10 + intensity * 6) * faceState.pupilDilation;
    
    // Eye whites / base
    ctx.fillStyle = `rgba(${r},${g},${b},0.9)`;
    
    // Left eye
    ctx.beginPath();
    ctx.ellipse(w/2 - 35 + faceState.lookDir.x * 5, eyeY + faceState.lookDir.y * 3, eyeW, eyeH, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Right eye
    ctx.beginPath();
    ctx.ellipse(w/2 + 35 + faceState.lookDir.x * 5, eyeY + faceState.lookDir.y * 3, eyeW, eyeH, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Pupils (track look direction)
    ctx.fillStyle = `rgb(${Math.max(0, r-80)},${Math.max(0, g-80)},${Math.max(0, b-80)})`;
    const pupilOffsetX = faceState.lookDir.x * 8;
    const pupilOffsetY = faceState.lookDir.y * 6;
    
    // Left pupil
    ctx.beginPath();
    ctx.ellipse(w/2 - 35 + pupilOffsetX, eyeY + pupilOffsetY, pupilSize, pupilSize * 1.2, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Right pupil
    ctx.beginPath();
    ctx.ellipse(w/2 + 35 + pupilOffsetX, eyeY + pupilOffsetY, pupilSize, pupilSize * 1.2, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Eye highlights (life!)
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath();
    ctx.ellipse(w/2 - 35 + pupilOffsetX - 4, eyeY + pupilOffsetY - 4, 4, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(w/2 + 35 + pupilOffsetX - 4, eyeY + pupilOffsetY - 4, 4, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Eyelids (blink/squint)
    if (faceState.eyeBlink > 0.5 || faceState.squint > 0.5) {
        ctx.fillStyle = `rgba(10,20,40,${faceState.eyeBlink * 0.8 + faceState.squint * 0.5})`;
        ctx.beginPath();
        ctx.ellipse(w/2 - 35, eyeY, eyeW + 4, eyeH * (faceState.eyeBlink + faceState.squint) * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(w/2 + 35, eyeY, eyeW + 4, eyeH * (faceState.eyeBlink + faceState.squint) * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // ========== MOUTH ==========
    const mouthY = h/2 + 40;
    const mouthW = 30 + intensity * 15;
    const baseMouthH = 8;
    
    ctx.strokeStyle = `rgb(${r},${g},${b})`;
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    
    if (emotion === "speak" || currentState.speaking) {
        // Speaking - mouth opens with amplitude
        const mouthOpen = 4 + currentState.speechAmplitude * 25 * (0.5 + 0.5 * Math.sin(time * 15));
        ctx.fillStyle = `rgba(${r},${g},${b},0.9)`;
        ctx.beginPath();
        ctx.ellipse(w/2, mouthY, mouthW * 0.6, mouthOpen, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    } else if (emotion === "amused" || emotion === "celebrate" || emotion === "excited") {
        // Big smile
        ctx.beginPath();
        ctx.moveTo(w/2 - mouthW, mouthY);
        ctx.quadraticCurveTo(w/2, mouthY - 20 - faceState.mouthOffset, w/2 + mouthW, mouthY);
        ctx.stroke();
        
        // Dimples
        ctx.fillStyle = `rgba(${r},${g},${b},0.5)`;
        ctx.beginPath();
        ctx.arc(w/2 - mouthW * 0.7, mouthY - 5, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(w/2 + mouthW * 0.7, mouthY - 5, 4, 0, Math.PI * 2);
        ctx.fill();
    } else if (emotion === "critical" || emotion === "warning") {
        // Grimace / teeth grit
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(w/2 - mouthW * 0.6, mouthY - 3, mouthW * 1.2, 6);
        // Teeth lines
        ctx.strokeStyle = "rgba(255,255,255,0.3)";
        ctx.lineWidth = 1;
        for (let i = -2; i <= 2; i++) {
            ctx.beginPath();
            ctx.moveTo(w/2 + i * 8, mouthY - 3);
            ctx.lineTo(w/2 + i * 8, mouthY + 3);
            ctx.stroke();
        }
    } else if (emotion === "sarcastic") {
        // Smirk - one side up
        ctx.beginPath();
        ctx.moveTo(w/2 - mouthW, mouthY + 3);
        ctx.quadraticCurveTo(w/2, mouthY - 8, w/2 + mouthW, mouthY + 5);
        ctx.stroke();
    } else if (emotion === "confused") {
        // Wavy uncertain mouth
        ctx.beginPath();
        for (let x = -mouthW; x <= mouthW; x += 3) {
            const y = mouthY + Math.sin(x * 0.15 + time * 2) * 4;
            if (x === -mouthW) ctx.moveTo(w/2 + x, y); else ctx.lineTo(w/2 + x, y);
        }
        ctx.stroke();
    } else if (emotion === "disapproving" || emotion === "serious") {
        // Flat line
        ctx.beginPath();
        ctx.moveTo(w/2 - mouthW * 0.7, mouthY);
        ctx.lineTo(w/2 + mouthW * 0.7, mouthY);
        ctx.stroke();
    } else if (emotion === "think") {
        // Slight pursed / thinking
        ctx.beginPath();
        ctx.moveTo(w/2 - mouthW * 0.4, mouthY);
        ctx.quadraticCurveTo(w/2, mouthY - 5, w/2 + mouthW * 0.4, mouthY);
        ctx.stroke();
    } else {
        // Neutral slight curve
        ctx.beginPath();
        ctx.moveTo(w/2 - mouthW * 0.5, mouthY);
        ctx.quadraticCurveTo(w/2, mouthY + 3, w/2 + mouthW * 0.5, mouthY);
        ctx.stroke();
    }
    
    // ========== CHEEK BLUSH (for happy) ==========
    if (emotion === "amused" || emotion === "celebrate" || emotion === "excited") {
        ctx.fillStyle = `rgba(${Math.min(255, r+60)},${Math.max(0, g-20)},${Math.max(0, b-20)},0.2)`;
        ctx.beginPath();
        ctx.arc(w/2 - 70, h/2 + 10, 25, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(w/2 + 70, h/2 + 10, 25, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // ========== FOREHEAD WRINKLES (for thinking/concern) ==========
    if (emotion === "think" || emotion === "confused" || emotion === "critical" || emotion === "warning") {
        ctx.strokeStyle = `rgba(${r},${g},${b},0.4)`;
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(w/2 - 30, h/2 - 75 + i * 6);
            ctx.quadraticCurveTo(w/2, h/2 - 80 + i * 6, w/2 + 30, h/2 - 75 + i * 6);
            ctx.stroke();
        }
    }
    
    faceTexture.needsUpdate = true;
}
