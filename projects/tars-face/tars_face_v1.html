    // Screen 2: Home — placeholder + event bus status
    registerScreen("home", "Home", "⊞", function (el) {
        const connState = connectionDot.className;
        const labels = { connecting:"Connecting...", connected:"Connected", disconnected:"Disconnected", unknown:"No server" };
        el.innerHTML =
            '<div class="tars-dashboard">' +
                '<div class="tars-dashboard-title">Home Operations</div>' +
                '<div class="tars-placeholder" style="min-height:120px">' +
                    '<div class="icon">⊞</div>' +
                    '<div>Home Assistant integration pending</div>' +
                    '<div class="desc">Phase 8.3 will connect IoT devices, sensors, and automations.</div>' +
                '</div>' +
                '<div class="tars-dashboard-row">' +
                    '<span class="label">Event Bus</span>' +
                    '<span class="value" id="tars-home-conn">' + (labels[connState] || "Unknown") + '</span>' +
                '</div>' +
            '</div>';
        const updateConn = () => {
            const el2 = document.getElementById("tars-home-conn");
            if (el2) el2.textContent = labels[connectionDot.className] || "Unknown";
        };
        document.addEventListener("tars-events-connected", updateConn);
        document.addEventListener("tars-events-disconnected", updateConn);
    });

    // Screen 3: Infrastructure — consumes Phase 8.1 event stream
    registerScreen("infra", "Infrastructure", "◈", function (el) {
        el.innerHTML =
            '<div class="tars-dashboard">' +
                '<div class="tars-dashboard-title">Infrastructure</div>' +
                '<div id="tars-infra-cpu" class="tars-dashboard-row"><span class="label">CPU</span><span class="value">—</span></div>' +
                '<div id="tars-infra-mem" class="tars-dashboard-row"><span class="label">Memory</span><span class="value">—</span></div>' +
                '<div id="tars-infra-disk" class="tars-dashboard-row"><span class="label">Disk</span><span class="value">—</span></div>' +
                '<div id="tars-infra-temp" class="tars-dashboard-row"><span class="label">Temperature</span><span class="value">—</span></div>' +
                '<div id="tars-infra-uptime" class="tars-dashboard-row"><span class="label">Uptime</span><span class="value">—</span></div>' +
                '<div id="tars-infra-services" class="tars-dashboard-row"><span class="label">Services</span><span class="value">—</span></div>' +
            '</div>' +
            '<div class="tars-dashboard" style="margin-top:8px" id="tars-docker-card">' +
                '<div class="tars-dashboard-title">Docker Containers</div>' +
                '<div id="tars-docker-summary" class="tars-dashboard-row"><span class="label">Containers</span><span class="value" style="color:rgba(210,235,255,0.2)">No Docker</span></div>' +
                '<div id="tars-docker-list"></div>' +
            '</div>' +
            '<div class="tars-dashboard" style="margin-top:8px" id="tars-alert-timeline">' +
                '<div class="tars-dashboard-title">Alerts</div>' +
                '<div id="tars-alert-list"><div class="tars-dashboard-row"><span class="label" style="color:rgba(210,235,255,0.2)">No active alerts</span></div></div>' +
            '</div>';

        function setVal(id, val) {
            const e = document.getElementById(id);
            if (e) e.querySelector(".value").textContent = val;
        }

        function updateMetrics(data) {
            if (data.cpu !== undefined) setVal("tars-infra-cpu", data.cpu + "%");
            if (data.mem !== undefined) setVal("tars-infra-mem", data.mem + "%");
            if (data.disk !== undefined) setVal("tars-infra-disk", data.disk + "%");
            if (data.temp !== undefined) setVal("tars-infra-temp", data.temp + "°C");
            if (data.uptime !== undefined) {
                const h = Math.floor(data.uptime / 3600);
                const m = Math.floor((data.uptime % 3600) / 60);
                setVal("tars-infra-uptime", h + "h " + m + "m");
            }
            if (data.services !== undefined) setVal("tars-infra-services", data.services);
        }

        function renderAlertList(alerts) {
            const list = document.getElementById("tars-alert-list");
            if (!list) return;
            if (!alerts || alerts.length === 0) {
                list.innerHTML = '<div class="tars-dashboard-row"><span class="label" style="color:rgba(210,235,255,0.2)">No active alerts</span></div>';
                return;
            }
            const colors = { critical: "#f87171", warning: "#eab308", info: "#5fd0ff" };
            const labels = { critical: "CRIT", warning: "WARN", info: "INFO" };
            let html = "";
            for (const a of alerts) {
                const color = colors[a.severity] || "rgba(210,235,255,0.3)";
                const time = a.createdAt ? new Date(a.createdAt).toLocaleTimeString() : "";
                html += '<div class="tars-dashboard-row" style="border-left:2px solid ' + color + ';padding-left:6px">' +
                    '<span class="label"><span style="color:' + color + ';font-weight:bold">' + (labels[a.severity] || a.severity) + '</span> ' +
                    a.title + (a.count > 1 ? ' <span style="color:rgba(210,235,255,0.2)">(x' + a.count + ')</span>' : '') + '</span>' +
                    '<span class="value" style="font-size:8px;color:rgba(210,235,255,0.3)">' + time + '</span>' +
                '</div>';
                if (a.message) {
                    html += '<div class="tars-dashboard-row" style="border-left:2px solid ' + color + ';padding:0 0 4px 10px;font-size:8px;color:rgba(210,235,255,0.3)">' +
                        a.message + '</div>';
                }
            }
            list.innerHTML = html;
        }

        function fetchAlerts() {
            fetch("/api/alerts?state=active").then(r => r.json()).then(alerts => {
                if (Array.isArray(alerts)) renderAlertList(alerts);
            }).catch(() => {});
        }

        let tarsDockerContainers = [];

        function renderDockerSummary(summary) {
            const sumEl = document.getElementById("tars-docker-summary");
            const listEl = document.getElementById("tars-docker-list");
            if (!sumEl) return;
            if (!summary) {
                sumEl.querySelector(".value").textContent = "No Docker";
                sumEl.querySelector(".value").style.color = "rgba(210,235,255,0.2)";
                if (listEl) listEl.innerHTML = "";
                return;
            }
            const crashed = summary.crashed || 0;
            const stopped = summary.stopped || 0;
            const running = summary.running || 0;
            const total = summary.total || 0;
            const color = crashed > 0 ? "#f87171" : total === 0 ? "rgba(210,235,255,0.2)" : "#5fd0ff";
            sumEl.querySelector(".value").textContent = running + " running, " + stopped + " stopped" + (crashed > 0 ? ", " + crashed + " crashed" : "");
            sumEl.querySelector(".value").style.color = color;
        }

        function renderDockerContainerList(containers) {
            const listEl = document.getElementById("tars-docker-list");
            if (!listEl) return;
            if (!containers || containers.length === 0) {
                listEl.innerHTML = "";
                return;
            }
            let html = "";
            const stateColors = { running: "#4ade80", exited: "rgba(210,235,255,0.2)", created: "rgba(210,235,255,0.2)", paused: "#eab308", restarting: "#f87171", removing: "#f87171", removed: "rgba(210,235,255,0.1)", dead: "#f87171" };
            for (const c of containers) {
                if (c.state === "removed") continue;
                const color = stateColors[c.state] || "rgba(210,235,255,0.3)";
                const uptime = c.uptimeSeconds ? Math.floor(c.uptimeSeconds / 60) + "m" : "";
                html += '<div class="tars-dashboard-row" style="padding-left:6px">' +
                    '<span class="label" style="font-size:9px"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:' + color + ';margin-right:4px;vertical-align:middle"></span>' + c.name + '</span>' +
                    '<span class="value" style="font-size:8px;color:' + color + '">' + c.state + (uptime ? " " + uptime : "") + '</span>' +
                '</div>';
            }
            listEl.innerHTML = html;
        }

        function fetchDocker() {
            fetch("/api/events?count=50&type=infra.docker.summary").then(r => r.json()).then(events => {
                if (!Array.isArray(events) || events.length === 0) { renderDockerSummary(null); return; }
                const latest = events[events.length - 1];
                renderDockerSummary(latest.data);
            }).catch(() => { renderDockerSummary(null); });
            fetch("/api/events?count=100&type=infra.docker.container").then(r => r.json()).then(events => {
                if (!Array.isArray(events) || events.length === 0) return;
                const seen = {};
                for (const e of events) { seen[e.data.name] = e.data; }
                tarsDockerContainers = Object.values(seen);
                renderDockerContainerList(tarsDockerContainers);
            }).catch(() => {});
        }

        // Fetch latest metrics from API
        function fetchMetrics() {
            fetch("/api/events?count=50").then(r => r.json()).then(events => {
                if (!Array.isArray(events)) return;
                const cpu = events.filter(e => e.type === "health.cpu").pop();
                const mem = events.filter(e => e.type === "health.memory").pop();
                const disk = events.filter(e => e.type === "health.disk").pop();
                const uptime = events.filter(e => e.type === "health.uptime").pop();
                const service = events.filter(e => e.type === "system.heartbeat").pop();
                updateMetrics({
                    cpu: cpu?.data?.percent,
                    mem: mem?.data?.percent,
                    disk: disk?.data?.percent,
                    temp: cpu?.data?.tempC,
                    uptime: uptime?.data?.uptimeSeconds,
                    services: service?.data?.services ? service.data.services.filter(s => s.status !== "stale").length + " online" : undefined
                });
            }).catch(() => {});
        }

        fetchMetrics();
        fetchAlerts();
        fetchDocker();
        if (infraTimer) clearInterval(infraTimer);
        infraTimer = setInterval(function () {
            fetchMetrics();
            fetchAlerts();
            fetchDocker();
        }, 10000);

        // Live events from WebSocket
        const handler = function (e) {
            const ev = e.detail;
            if (!ev || !ev.type) return;
            if (ev.type === "health.cpu") {
                if (ev.data.percent !== undefined) setVal("tars-infra-cpu", ev.data.percent + "%");
                if (ev.data.tempC !== undefined) setVal("tars-infra-temp", ev.data.tempC + "°C");
            }
            if (ev.type === "health.memory" && ev.data.percent !== undefined) setVal("tars-infra-mem", ev.data.percent + "%");
            if (ev.type === "health.disk" && ev.data.percent !== undefined) {
                const diskEl = document.getElementById("tars-infra-disk");
                if (diskEl) diskEl.querySelector(".value").textContent = ev.data.percent + "% (" + ev.data.device + ")";
            }
            if (ev.type === "health.uptime" && ev.data.uptimeSeconds !== undefined) {
                const h = Math.floor(ev.data.uptimeSeconds / 3600);
                const m = Math.floor((ev.data.uptimeSeconds % 3600) / 60);
                setVal("tars-infra-uptime", h + "h " + m + "m");
            }
            if (ev.type === "system.heartbeat" && ev.data.services) {
                const online = ev.data.services.filter(s => s.status !== "stale").length;
                setVal("tars-infra-services", online + " online");
            }
            // Live alert events — refresh full alert list
            if (ev.type.startsWith("alert.")) {
                fetchAlerts();
            }
            // Live Docker events
            if (ev.type === "infra.docker.summary") {
                renderDockerSummary(ev.data);
            }
            if (ev.type === "infra.docker.container") {
                const c = ev.data;
                let updated = false;
                for (let i = 0; i < tarsDockerContainers.length; i++) {
                    if (tarsDockerContainers[i].name === c.name) {
                        if (c.state === "removed") { tarsDockerContainers.splice(i, 1); }
                        else { tarsDockerContainers[i] = c; }
                        updated = true; break;
                    }
                }
                if (!updated && c.state !== "removed") { tarsDockerContainers.push(c); }
                renderDockerContainerList(tarsDockerContainers);
            }
        };
        document.addEventListener("tars-event", handler);

        return () => {
            clearInterval(infraTimer);
            document.removeEventListener("tars-event", handler);
        };
    });

    // Screen 4: Monitor — placeholder for World Monitor, alerts, news
    registerScreen("monitor", "Monitor", "◉", function (el) {
        el.innerHTML =
            '<div class="tars-dashboard">' +
                '<div class="tars-dashboard-title">World Monitor</div>' +
                '<div class="tars-placeholder">' +
                    '<div class="icon">◉</div>' +
                    '<div>External monitoring pending</div>' +
                    '<div class="desc">Phase 8.3 will integrate weather, news, alerts, and calendar feeds.</div>' +
                '</div>' +
            '</div>';
    });

    // Screen 5: System — gateway to developer tools + system info
    registerScreen("system", "System", "⚙", function (el) {
        el.innerHTML =
            '<div class="tars-dashboard">' +
                '<div class="tars-dashboard-title">System</div>' +
                '<div class="tars-dashboard-row"><span class="label">TARS Face</span><span class="value">v7.5</span></div>' +
                '<div class="tars-dashboard-row"><span class="label">Runtime Server</span><span class="value" id="tars-sys-runtime">—</span></div>' +
                '<div class="tars-dashboard-row"><span class="label">Event Bus</span><span class="value" id="tars-sys-events">—</span></div>' +
                '<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">' +
                    '<button class="btn btn-sm" data-action="open-dev-tool" data-tab="brain">🧠 Brain</button>' +
                    '<button class="btn btn-sm" data-action="open-dev-tool" data-tab="observatory">📊 Observatory</button>' +
                    '<button class="btn btn-sm" data-action="open-dev-tool" data-tab="journal">📜 Journal</button>' +
                    '<button class="btn btn-sm" data-action="open-dev-tool" data-tab="settings">⚙ Creator Console</button>' +
                '</div>' +
            '</div>';

        // Fetch runtime info
        fetch("/health").then(r => r.json()).then(h => {
            const el2 = document.getElementById("tars-sys-runtime");
            if (el2) el2.textContent = "v0.1.0 · up " + Math.floor(h.uptime / 60) + "m";
            const el3 = document.getElementById("tars-sys-events");
            if (el3) el3.textContent = h.eventBus.published + " pub, " + h.eventBus.subscriberCount + " subs";
        }).catch(() => {
            const el2 = document.getElementById("tars-sys-runtime");
            if (el2) el2.textContent = "Offline";
        });
    });

    // ── Navigation Controller ──
    function switchScreen(id, skipSave) {
        if (!screens[id]) return;
        activeScreen = id;
        if (!skipSave) localStorage.setItem("tars_active_screen", id);

        // Cleanup previous screen
        if (window.__tarsScreenCleanup) {
            window.__tarsScreenCleanup();
            window.__tarsScreenCleanup = null;
        }

        // Build screen divs if not exist
        for (const sid of Object.keys(screens)) {
            let screenEl = container.querySelector(".tars-screen[data-screen=\"" + sid + "\"]");
            if (!screenEl) {
                screenEl = document.createElement("div");
                screenEl.className = "tars-screen";
                screenEl.dataset.screen = sid;
                container.appendChild(screenEl);
            }
            screenEl.classList.toggle("active", sid === id);
        }

        container.classList.toggle("active", id !== "world");

        // Render active screen
        const activeEl = container.querySelector(".tars-screen.active");
        if (activeEl) {
            activeEl.innerHTML = "";
            const inner = document.createElement("div");
            inner.className = "tars-screen-inner";
            activeEl.appendChild(inner);
            const cleanup = screens[id].render(inner);
            if (typeof cleanup === "function") window.__tarsScreenCleanup = cleanup;
        }

        // Update nav buttons
        navBtns.forEach(b => b.classList.toggle("active", b.dataset.screen === id));
    }

    // ── Event Wiring ──
    navBtns.forEach(btn => {
        btn.addEventListener("click", () => switchScreen(btn.dataset.screen));
        btn.addEventListener("touchend", (e) => {
            e.preventDefault();
            switchScreen(btn.dataset.screen);
        });
    });

    // Swipe handler
    let touchStartX = 0;
    let touchStartY = 0;
    let swiping = false;

    container.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            swiping = true;
        }
    }, { passive: true });

    container.addEventListener("touchmove", (e) => {
        if (!swiping || e.touches.length !== 1) return;
        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;
        if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.5) {
            e.preventDefault();
        }
    }, { passive: false });

    container.addEventListener("touchend", (e) => {
        if (!swiping) return;
        swiping = false;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
            const keys = Object.keys(screens);
            const idx = keys.indexOf(activeScreen);
            if (dx < 0 && idx < keys.length - 1) switchScreen(keys[idx + 1]);
            else if (dx > 0 && idx > 0) switchScreen(keys[idx - 1]);
        }
    }, { passive: true });

    // Keyboard navigation
    document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
            const activeEl = container.querySelector(".tars-screen.active");
            if (!activeEl) return;
            // Don't capture if user is typing in an input
            if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
            e.preventDefault();
            const keys = Object.keys(screens);
            const idx = keys.indexOf(activeScreen);
            if (e.key === "ArrowRight" && idx < keys.length - 1) switchScreen(keys[idx + 1]);
            if (e.key === "ArrowLeft" && idx > 0) switchScreen(keys[idx - 1]);
        }
    });

    // Open dev tool buttons (System screen)
    document.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-action=\"open-dev-tool\"]");
        if (btn && btn.dataset.tab && window.TARS_UI) {
            TARS_UI.openTab(btn.dataset.tab);
        }
    });

    // ── Init ──
    switchScreen(activeScreen, true);
    console.log("[TARS OS] Navigation shell initialized. Active screen:", activeScreen);
})();

</script>

</body>
</html>
