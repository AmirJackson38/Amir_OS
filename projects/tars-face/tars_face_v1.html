// Phase 6: Event interruption system — external events can queue to influence behavior
const pendingEvents = [];

function queueWorldEvent(label, priority, metadata = {}) {
    const event = {
        id: `evt_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`,
        label,
        priority,
        metadata,
        queuedAt: Date.now()
    };
    pendingEvents.push(event);
    console.log(`[WorldEvent] Queued: "${label}" (priority ${priority})`);
    return event;
}

function processWorldEvents() {
    if (pendingEvents.length === 0) return;
    if (worldState.tars.controlMode === "llm") {
        // LLM is active — queue events for later, don't interrupt
        return;
    }
    // Sort by priority descending, take highest
    pendingEvents.sort((a, b) => b.priority - a.priority);
    const top = pendingEvents[pendingEvents.length - 1];
    if (!top) return;

    const currentActivity = ACTIVITY_REGISTRY[worldState.tars.activity];
    const currentPriority = currentActivity ? currentActivity.priority : PRIORITY.LOW;

    if (top.priority > currentPriority) {
        console.log(`[WorldEvent] Interrupting for: "${top.label}" (pri ${top.priority} > ${currentPriority})`);
        const evt = pendingEvents.pop();
        persistWorldEvent({
            eventType: "world_event",
            label: evt.label,
            priority: evt.priority,
            metadata: evt.metadata,
            timestamp: new Date().toISOString()
        });
        worldState.activityLog.push({
            type: "interruption",
            activity: "interruption_" + evt.label,
            location: evt.metadata?.gazeTarget || null,
            reason: "world_event",
            timestamp: new Date().toISOString(),
            event: evt.label,
            priority: evt.priority,
            interruptedActivity: worldState.tars.activity
        });
        if (worldState.activityLog.length > worldState.maxActivityLogSize) {
            worldState.activityLog.shift();
        }
        // Set TARS to investigate — gaze toward relevant location if specified
        if (evt.metadata?.gazeTarget) {
            window.TARS.lookAt(evt.metadata.gazeTarget, "environmental_event");
        } else {
            window.TARS.lookAt("user", "environmental_event");
        }
    } else {
        // Event not important enough to interrupt — drain it silently
        pendingEvents.pop();
    }
}

window.pendingEvents = pendingEvents;

// Helper: Log a meaningful activity event
function logActivityEvent(eventType, activity, location, reason, metadata = {}) {
    const event = {
        id: `evt_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
        timestamp: new Date().toISOString(),
        eventType,
        activity,
        location,
        reason,
        metadata
    };
    worldState.activityLog.push(event);
    if (worldState.activityLog.length > worldState.maxActivityLogSize) {
        worldState.activityLog.shift();
    }

    // Route through canonical event bus
    const mappedType = eventType === "activity_started" ? "activity.started" :
                       eventType === "activity_completed" ? "activity.completed" :
                       eventType === "interruption" ? "activity.interrupted" : `activity.${eventType}`;

    if (typeof emitTARSEvent === "function") {
        emitTARSEvent(mappedType, {
            activity,
            location,
            reason,
            metadata,
            activityEndsAt: worldState.tars.activityEndsAt || null
        }, "tars.activity");
    }

    console.log(`[ActivityLog] ${eventType}: ${activity} at ${location} (${reason})`, metadata);
    return event;
}

// Helper: Update TARS activity state (Single Canonical Emitter for Activity Lifecycle)
function setTARSActivity(activity, location, reason, metadata = {}) {
    const now = Date.now();
    const prevActivity = worldState.tars.activity;
    const prevLocation = worldState.tars.location;
    const isNewActivity = prevActivity !== activity;
    const isNewLocation = prevLocation !== location;

    // 1. If transitioning away from an active activity, complete or interrupt it FIRST
    if (isNewActivity && prevActivity && prevActivity !== "idle") {
        const duration = now - (worldState.tars.activityStartedAt || now);
        worldState.tars.previousActivity = {
            activity: prevActivity,
            location: prevLocation,
            duration,
            endedAt: now
        };
        worldState.tars.activityRecency[prevActivity] = now;

        const isInterruption = typeof reason === "string" && (reason.includes("interruption") || reason.includes("environmental_event") || reason.includes("user_override"));
        const completionType = isInterruption ? "interruption" : "activity_completed";

        logActivityEvent(completionType, prevActivity, prevLocation, reason, {
            duration,
            endedAt: now,
            ...metadata
        });

        // Apply completion effects for previous activity
        const prevEffects = ACTIVITY_EFFECTS[prevActivity];
        if (prevEffects && prevEffects.onCompletion) {
            for (const [need, amount] of Object.entries(prevEffects.onCompletion)) {
                worldState.tars.needs[need] = Math.max(0, Math.min(1, (worldState.tars.needs[need] || 0.5) + amount));
            }
        }
    }

    if (isNewLocation && prevLocation && prevLocation !== "spawn") {
        worldState.tars.locationRecency[prevLocation] = now;
    }

    // Phase 7.2A: Record activity transition telemetry (lightweight, not a decision)
    if (isNewActivity || isNewLocation) {
        if (AUTONOMY_TELEMETRY_DEBUG) {
            const transitionType = isNewActivity ? "activity_start" : "location_change";
            console.log(`[TARS TRANSITION] ${transitionType}: ${prevActivity}@${prevLocation} → ${activity}@${location} (${reason})`);
        }
    }

    // 2. Set state for new activity
    worldState.tars.activity = activity;
    worldState.tars.location = location;
    worldState.tars.activityStartedAt = now;
    worldState.tars.activityReason = reason;

    // Compute natural activity end time from registry metadata
    const reg = ACTIVITY_REGISTRY[activity];
    if (reg && reg.minDuration !== undefined) {
        const durSec = reg.minDuration + Math.random() * (reg.maxDuration - reg.minDuration);
        worldState.tars.activityEndsAt = now + durSec * 1000;
    } else {
        worldState.tars.activityEndsAt = now + 15000;
    }

    // 3. Start new activity SECOND (if new activity is active)
    if (isNewActivity && activity !== "idle") {
        logActivityEvent("activity_started", activity, location, reason, metadata);
    }

    debugLog("Activity set:", { activity, location, reason, previousActivity: worldState.tars.previousActivity?.activity, endsAt: new Date(worldState.tars.activityEndsAt).toISOString() });
    logStateChange("activity_set", { activity, location, reason });
    WorldPersistence.save();
}

// Face animation state
let faceState = {
    eyeBlink: 0,
    blinkTimer: 0,
    expression: "neutral",
    expressionTimer: 0,
    eyebrowOffset: 0,
    mouthOffset: 0,
    squint: 0,
    lookDir: { x: 0, y: 0 },
    pupilDilation: 1.0
};

function drawFace(time) {
    const ctx = faceCtx;
    const w = faceCanvas.width, h = faceCanvas.height;
    ctx.clearRect(0, 0, w, h);
    
    const emotion = currentState.emotion;
    const intensity = currentState.intensity;
    const pulse = Math.sin(time * currentState.pulseSpeed) * 0.5 + 0.5;
    
    // Update face state
    faceState.blinkTimer -= 1/60;
    if (faceState.blinkTimer <= 0) {
        faceState.eyeBlink = 1;
        faceState.blinkTimer = 2 + Math.random() * 4;
    }
    if (faceState.eyeBlink > 0) {
        faceState.eyeBlink = Math.max(0, faceState.eyeBlink - 0.15);
    }
    
    faceState.expressionTimer -= 1/60;
    if (faceState.expressionTimer <= 0) {
        faceState.expression = ["neutral", "curious", "focused", "amused"][Math.floor(Math.random() * 4)];
        faceState.expressionTimer = 3 + Math.random() * 5;
    }
    
    // Emotion-driven face parameters
    const preset = BEHAVIOR_PRESETS[emotion] || BEHAVIOR_PRESETS.idle;
    const faceColor = new THREE.Color(preset.color);
    const r = Math.floor(faceColor.r * 255);
    const g = Math.floor(faceColor.g * 255);
    const b = Math.floor(faceColor.b * 255);
    
    // Base face glow
    const glowAlpha = 0.2 + pulse * 0.3 + intensity * 0.2;
    ctx.fillStyle = `rgba(${r},${g},${b},${glowAlpha})`;
    ctx.beginPath();
    ctx.arc(w/2, h/2, 110, 0, Math.PI * 2);
    ctx.fill();
    
    // Face shape
    ctx.fillStyle = `rgba(${Math.min(255, r+30)},${Math.min(255, g+30)},${Math.min(255, b+30)},0.15)`;
    ctx.beginPath();
    ctx.ellipse(w/2, h/2 + 10, 90, 100, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // ========== EYEBROWS ==========
    ctx.strokeStyle = `rgb(${r},${g},${b})`;
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    const browY = h/2 - 55;
    const browW = 35;
    
    // Left eyebrow
    ctx.beginPath();
    if (emotion === "critical" || emotion === "warning" || emotion === "serious" || emotion === "disapproving") {
        // Angry/down
        ctx.moveTo(w/2 - 45, browY + faceState.eyebrowOffset);
        ctx.lineTo(w/2 - 10, browY - 8 + faceState.eyebrowOffset);
    } else if (emotion === "confused") {
        // Uneven
        ctx.moveTo(w/2 - 45, browY - 5 + faceState.eyebrowOffset);
        ctx.lineTo(w/2 - 10, browY + 3 + faceState.eyebrowOffset);
    } else if (emotion === "amused" || emotion === "celebrate" || emotion === "excited") {
        // Raised happy
        ctx.moveTo(w/2 - 45, browY - 8 + faceState.eyebrowOffset);
        ctx.quadraticCurveTo(w/2 - 27, browY - 15 + faceState.eyebrowOffset, w/2 - 10, browY - 5 + faceState.eyebrowOffset);
    } else if (emotion === "sarcastic") {
        // One up, one down
        ctx.moveTo(w/2 - 45, browY - 10 + faceState.eyebrowOffset);
        ctx.lineTo(w/2 - 10, browY + 5 + faceState.eyebrowOffset);
    } else {
        // Neutral/relaxed
        ctx.moveTo(w/2 - 45, browY + faceState.eyebrowOffset);
        ctx.quadraticCurveTo(w/2 - 27, browY - 5 + faceState.eyebrowOffset, w/2 - 10, browY + faceState.eyebrowOffset);
    }
    ctx.stroke();
    
    // Right eyebrow
    ctx.beginPath();
    if (emotion === "critical" || emotion === "warning" || emotion === "serious" || emotion === "disapproving") {
        ctx.moveTo(w/2 + 10, browY - 8 - faceState.eyebrowOffset);
        ctx.lineTo(w/2 + 45, browY - faceState.eyebrowOffset);
    } else if (emotion === "confused") {
        ctx.moveTo(w/2 + 10, browY + 3 - faceState.eyebrowOffset);
        ctx.lineTo(w/2 + 45, browY - 5 - faceState.eyebrowOffset);
    } else if (emotion === "sarcastic") {
        ctx.moveTo(w/2 + 10, browY + 5 - faceState.eyebrowOffset);
        ctx.lineTo(w/2 + 45, browY - 10 - faceState.eyebrowOffset);
    } else {
        ctx.moveTo(w/2 + 10, browY - faceState.eyebrowOffset);
        ctx.quadraticCurveTo(w/2 + 27, browY - 5 - faceState.eyebrowOffset, w/2 + 45, browY - faceState.eyebrowOffset);
    }
    ctx.stroke();
    
    // ========== EYES ==========
    const eyeY = h/2 - 20;
    const eyeW = 28 - faceState.squint * 10;
    const eyeH = (32 - faceState.squint * 16) * (1 - faceState.eyeBlink);
    const pupilSize = (10 + intensity * 6) * faceState.pupilDilation;
    
    // Eye whites / base
    ctx.fillStyle = `rgba(${r},${g},${b},0.9)`;
    
    // Left eye
    ctx.beginPath();
    ctx.ellipse(w/2 - 35 + faceState.lookDir.x * 5, eyeY + faceState.lookDir.y * 3, eyeW, eyeH, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Right eye
    ctx.beginPath();
    ctx.ellipse(w/2 + 35 + faceState.lookDir.x * 5, eyeY + faceState.lookDir.y * 3, eyeW, eyeH, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Pupils (track look direction)
    ctx.fillStyle = `rgb(${Math.max(0, r-80)},${Math.max(0, g-80)},${Math.max(0, b-80)})`;
    const pupilOffsetX = faceState.lookDir.x * 8;
    const pupilOffsetY = faceState.lookDir.y * 6;
    
    // Left pupil
    ctx.beginPath();
    ctx.ellipse(w/2 - 35 + pupilOffsetX, eyeY + pupilOffsetY, pupilSize, pupilSize * 1.2, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Right pupil
    ctx.beginPath();
    ctx.ellipse(w/2 + 35 + pupilOffsetX, eyeY + pupilOffsetY, pupilSize, pupilSize * 1.2, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Eye highlights (life!)
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath();
    ctx.ellipse(w/2 - 35 + pupilOffsetX - 4, eyeY + pupilOffsetY - 4, 4, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(w/2 + 35 + pupilOffsetX - 4, eyeY + pupilOffsetY - 4, 4, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Eyelids (blink/squint)
    if (faceState.eyeBlink > 0.5 || faceState.squint > 0.5) {
        ctx.fillStyle = `rgba(10,20,40,${faceState.eyeBlink * 0.8 + faceState.squint * 0.5})`;
        ctx.beginPath();
        ctx.ellipse(w/2 - 35, eyeY, eyeW + 4, eyeH * (faceState.eyeBlink + faceState.squint) * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(w/2 + 35, eyeY, eyeW + 4, eyeH * (faceState.eyeBlink + faceState.squint) * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // ========== MOUTH ==========
    const mouthY = h/2 + 40;
    const mouthW = 30 + intensity * 15;
    const baseMouthH = 8;
    
    ctx.strokeStyle = `rgb(${r},${g},${b})`;
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    
    if (emotion === "speak" || currentState.speaking) {
        // Speaking - mouth opens with amplitude
        const mouthOpen = 4 + currentState.speechAmplitude * 25 * (0.5 + 0.5 * Math.sin(time * 15));
        ctx.fillStyle = `rgba(${r},${g},${b},0.9)`;
        ctx.beginPath();
        ctx.ellipse(w/2, mouthY, mouthW * 0.6, mouthOpen, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    } else if (emotion === "amused" || emotion === "celebrate" || emotion === "excited") {
        // Big smile
        ctx.beginPath();
        ctx.moveTo(w/2 - mouthW, mouthY);
        ctx.quadraticCurveTo(w/2, mouthY - 20 - faceState.mouthOffset, w/2 + mouthW, mouthY);
        ctx.stroke();
        
        // Dimples
        ctx.fillStyle = `rgba(${r},${g},${b},0.5)`;
        ctx.beginPath();
        ctx.arc(w/2 - mouthW * 0.7, mouthY - 5, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(w/2 + mouthW * 0.7, mouthY - 5, 4, 0, Math.PI * 2);
        ctx.fill();
    } else if (emotion === "critical" || emotion === "warning") {
        // Grimace / teeth grit
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(w/2 - mouthW * 0.6, mouthY - 3, mouthW * 1.2, 6);
        // Teeth lines
        ctx.strokeStyle = "rgba(255,255,255,0.3)";
        ctx.lineWidth = 1;
        for (let i = -2; i <= 2; i++) {
            ctx.beginPath();
            ctx.moveTo(w/2 + i * 8, mouthY - 3);
            ctx.lineTo(w/2 + i * 8, mouthY + 3);
            ctx.stroke();
        }
    } else if (emotion === "sarcastic") {
        // Smirk - one side up
        ctx.beginPath();
        ctx.moveTo(w/2 - mouthW, mouthY + 3);
        ctx.quadraticCurveTo(w/2, mouthY - 8, w/2 + mouthW, mouthY + 5);
        ctx.stroke();
    } else if (emotion === "confused") {
        // Wavy uncertain mouth
        ctx.beginPath();
        for (let x = -mouthW; x <= mouthW; x += 3) {
            const y = mouthY + Math.sin(x * 0.15 + time * 2) * 4;
            if (x === -mouthW) ctx.moveTo(w/2 + x, y); else ctx.lineTo(w/2 + x, y);
        }
        ctx.stroke();
    } else if (emotion === "disapproving" || emotion === "serious") {
        // Flat line
        ctx.beginPath();
        ctx.moveTo(w/2 - mouthW * 0.7, mouthY);
        ctx.lineTo(w/2 + mouthW * 0.7, mouthY);
        ctx.stroke();
    } else if (emotion === "think") {
        // Slight pursed / thinking
        ctx.beginPath();
        ctx.moveTo(w/2 - mouthW * 0.4, mouthY);
        ctx.quadraticCurveTo(w/2, mouthY - 5, w/2 + mouthW * 0.4, mouthY);
        ctx.stroke();
    } else {
        // Neutral slight curve
        ctx.beginPath();
        ctx.moveTo(w/2 - mouthW * 0.5, mouthY);
        ctx.quadraticCurveTo(w/2, mouthY + 3, w/2 + mouthW * 0.5, mouthY);
        ctx.stroke();
    }
    
    // ========== CHEEK BLUSH (for happy) ==========
    if (emotion === "amused" || emotion === "celebrate" || emotion === "excited") {
        ctx.fillStyle = `rgba(${Math.min(255, r+60)},${Math.max(0, g-20)},${Math.max(0, b-20)},0.2)`;
        ctx.beginPath();
        ctx.arc(w/2 - 70, h/2 + 10, 25, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(w/2 + 70, h/2 + 10, 25, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // ========== FOREHEAD WRINKLES (for thinking/concern) ==========
    if (emotion === "think" || emotion === "confused" || emotion === "critical" || emotion === "warning") {
        ctx.strokeStyle = `rgba(${r},${g},${b},0.4)`;
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(w/2 - 30, h/2 - 75 + i * 6);
            ctx.quadraticCurveTo(w/2, h/2 - 80 + i * 6, w/2 + 30, h/2 - 75 + i * 6);
            ctx.stroke();
        }
    }
    
    faceTexture.needsUpdate = true;
}

// FX state
let fxState = { type: "none", timer: 0, color: new THREE.Color(0x5fd0ff) };

function triggerFX(type, color = 0x5fd0ff, count = 40) {
    fxState.type = type;
    fxState.timer = 0;
    fxState.color.setHex(color);
    
    const positions = fxParticleGeo.attributes.position.array;
    const velocities = fxParticleVelocities;
    const lifes = fxParticleLifes;
    const colors = fxParticleGeo.attributes.color.array;
    const sizes = fxParticleGeo.attributes.size.array;
    
    for (let i = 0; i < count; i++) {
        const idx = i * 3;
        // Spawn at entity center
        positions[idx] = 0;
        positions[idx + 1] = 0;
        positions[idx + 2] = 0;
        
        // Random velocity based on FX type
        let speed, spread;
        if (type === "burst") {
            speed = 0.8 + Math.random() * 1.2;
            spread = 1.0;
        } else if (type === "strobe_red" || type === "strobe_orange") {
            speed = 0.3 + Math.random() * 0.5;
            spread = 0.5;
        } else {
            speed = 0.4 + Math.random() * 0.6;
            spread = 0.8;
        }
        
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        velocities[idx] = Math.sin(phi) * Math.cos(theta) * speed;
        velocities[idx + 1] = Math.cos(phi) * speed;
        velocities[idx + 2] = Math.sin(phi) * Math.sin(theta) * speed;
        
        lifes[i] = 1.5 + Math.random() * 1.0; // life in seconds
        
        colors[idx] = fxState.color.r;
        colors[idx + 1] = fxState.color.g;
        colors[idx + 2] = fxState.color.b;
        
        sizes[i] = 0.05 + Math.random() * 0.08;
    }
    fxParticleGeo.attributes.position.needsUpdate = true;
    fxParticleGeo.attributes.color.needsUpdate = true;
    fxParticleGeo.attributes.size.needsUpdate = true;
}

// Emotion Mixer - blends between states smoothly
class EmotionMixer {
    constructor() {
        this.current = { ...BEHAVIOR_PRESETS.idle };
        this.target = { ...BEHAVIOR_PRESETS.idle };
        this.lerpSpeed = 0.08;
        this.gesturePhase = 0;
        // Use THREE.Color for proper lerping
        this.current.color = new THREE.Color(BEHAVIOR_PRESETS.idle.color);
        this.target.color = new THREE.Color(BEHAVIOR_PRESETS.idle.color);
    }

    setTarget(presetName, intensity = 1.0) {
        const preset = BEHAVIOR_PRESETS[presetName];
        if (!preset) return;
        this.target = { ...preset };
        // Apply intensity modifier
        this.target.deformation *= intensity;
        this.target.energy *= intensity;
        this.target.pulseSpeed *= (0.5 + intensity * 0.5);
        this.target.orbitSpeed *= (0.5 + intensity * 0.5);
        // Convert color to THREE.Color
        this.target.color = new THREE.Color(preset.color);
    }

    blend(presetA, presetB, factor) {
        const result = {};
        const keys = ['pulseSpeed', 'deformation', 'energy', 'asymmetry', 'leanZ', 'orbitSpeed'];
        for (const key of keys) {
            const a = presetA[key];
            const b = presetB[key];
            result[key] = a + (b - a) * factor;
        }
        // Color lerp
        result.color = new THREE.Color(presetA.color).lerp(new THREE.Color(presetB.color), factor);
        result.gesture = factor > 0.5 ? presetB.gesture : presetA.gesture;
        return result;
    }

    update(dt) {
        // Smooth lerp towards target
        const keys = ['pulseSpeed', 'deformation', 'energy', 'asymmetry', 'leanZ', 'orbitSpeed'];
        for (const key of keys) {
            this.current[key] += (this.target[key] - this.current[key]) * this.lerpSpeed * dt * 60;
        }
        // Color lerp
        this.current.color.lerp(this.target.color, this.lerpSpeed * dt * 60);
        
        this.gesturePhase += dt * this.current.orbitSpeed * 0.5;
    }

    getCurrent() {
        return this.current;
    }

    getMixedState() {
        // Return with color as THREE.Color for proper lerping in animation loop
        return {
            color: this.current.color.clone(),
            pulseSpeed: this.current.pulseSpeed,
            deformation: this.current.deformation,
            asymmetry: this.current.asymmetry,
            leanZ: this.current.leanZ,
            orbitSpeed: this.current.orbitSpeed,
            energy: this.current.energy,
            gesture: this.current.gesture
        };
    }

    getGesture() {
        return this.current.gesture;
    }
    
    setIntensity(intensity) {
        // Adjust target deformation and energy based on intensity
        const basePreset = Object.values(BEHAVIOR_PRESETS).find(p => p.color === this.target.color.getHex()) || BEHAVIOR_PRESETS.idle;
        this.target.deformation = basePreset.deformation * intensity;
        this.target.energy = basePreset.energy * intensity;
    }
}

// Global TARS Controller API

window.TARS = {
    setMode(mode) {
        currentState.mode = mode;
        document.getElementById("current-mode").innerText = mode.toUpperCase();
    },
    trigger(presetName) {
        if (!BEHAVIOR_PRESETS[presetName]) return;
        currentState.emotion = presetName;
        document.getElementById("current-emotion").innerText = presetName.toUpperCase();
        console.log(`[TARS] Trigger: ${presetName}`);
        
        // Fire FX from preset
        const preset = BEHAVIOR_PRESETS[presetName];
        if (preset.fx && preset.fx !== "none") {
            currentState.fx = preset.fx;
            currentState.fxTimer = 0;
        }
        
        // Use EmotionMixer for smooth transitions
        emotionMixer.setTarget(presetName, currentState.intensity);
    },
    setEmotion(name, intensity = 0.5) {
        this.trigger(name);
        currentState.intensity = intensity;
    },
    setSpeaking(bool) {
        currentState.speaking = bool;
        console.log(`[TARS] Speaking: ${bool}`);
        if (bool) {
            this.trigger("speak");
            currentState.lastSpeechTime = performance.now() / 1000;
        }
    },
    setListening(bool) {
        currentState.listening = bool;
        console.log(`[TARS] Listening: ${bool}`);
        if (bool) this.trigger("listen");
    },
    setIntensity(v) {
        currentState.intensity = v;
        console.log(`[TARS] Intensity: ${v}`);
        // Update mixer intensity
        emotionMixer.setIntensity(v);
    },
    setUrgency(v) {
        currentState.urgency = v;
        currentState.orbitSpeed = 0.8 + v * 3.0;
        currentState.pulseSpeed = 1.5 + v * 4.0;
        console.log(`[TARS] Urgency: ${v}`);
    },
    // Speech reactivity hooks for LLM/TTS integration
    setSpeechAmplitude(amp) {
        currentState.speechAmplitude = Math.max(0, Math.min(1, amp));
    },
    setSpeechPitch(pitch) {
        currentState.speechPitch = Math.max(0.5, Math.min(2.0, pitch));
    },
    onSpeechStart() {
        console.log(`[TARS] Speech START`);
        this.setSpeaking(true);
    },
    onSpeechEnd() {
        console.log(`[TARS] Speech END`);
        this.setSpeaking(false);
        // Return to idle after brief delay
        setTimeout(() => {
            if (!currentState.speaking) this.trigger("idle");
        }, 500);
    },
    lookAt(targetKey, reason = "autonomous_move", overrideActivity = null) {
        currentState.gazeTarget = targetKey;
        console.log(`[TARS] Look at: ${targetKey} (reason: ${reason})`);
        if (TARGET_POSITIONS[targetKey]) {
            currentState.targetPos.copy(TARGET_POSITIONS[targetKey]);
            const targetVec = TARGET_POSITIONS[targetKey];
            const dx = targetVec.x - tarsEntityGroup.position.x;
            const dz = targetVec.z - tarsEntityGroup.position.z;
            const angle = Math.atan2(dx, dz);
            tarsEntityGroup.rotation.y = angle;
            
            triggerLocationBehavior(targetKey);
            
            const activity = overrideActivity || (() => {
                const activityMap = {
                    "window_left": "weather_observation",
                    "window_right": "weather_observation", 
                    "desk": "computer_work",
                    "rack-a": "server_check",
                    "user": "user_interaction"
                };
                return activityMap[targetKey] || "idle";
            })();
            setTARSActivity(activity, targetKey, reason);
        }
    },
    moveTo(pos) {
        currentState.targetPos.copy(pos);
        console.log(`[TARS] Move to:`, pos);
    },
    // Accepts behavioral intent JSON from LLM: { emotion, intensity, energy, urgency, gesture, movement, gaze, target }
    setBehavior(obj) {
        console.log(`[TARS] setBehavior:`, obj);
        if (obj.emotion) this.setEmotion(obj.emotion, obj.intensity || 0.5);
        if (obj.energy !== undefined) {
            currentState.energy = obj.energy;
            worldState.tars.energy = obj.energy;
        }
        if (obj.urgency !== undefined) this.setUrgency(obj.urgency);
        if (obj.gaze) this.lookAt(obj.gaze, "llm_intent");
        if (obj.movement && obj.target && TARGET_POSITIONS[obj.target]) {
            this.moveTo(TARGET_POSITIONS[obj.target]);
        }
        if (obj.gesture) {
            this.triggerGesture(obj.gesture);
        }
        // LLM intent takes control, start auto-release timer
        worldState.tars.controlMode = "llm";
        clearTimeout(window._llmReleaseTimer);

let _needSnapshotAccum = 0;

function updateNeeds(dt) {
    // Decay all needs
    for (const [need, rate] of Object.entries(NEED_DECAY_RATES)) {
        worldState.tars.needs[need] = Math.max(0, worldState.tars.needs[need] - rate * dt * 60);
    }
    
    // Restore needs based on current location
    const loc = worldState.tars.location;
    if (NEED_RESTORATION[loc]) {
        for (const [need, amount] of Object.entries(NEED_RESTORATION[loc])) {
            worldState.tars.needs[need] = Math.min(1, worldState.tars.needs[need] + amount * dt * 60);
        }
    }
    
    // Activity effects — continuous need changes while engaged
    applyActivityEffects(dt);
    
    // Time-of-day modifiers
    const hour = new Date().getHours();
    const isNight = hour < 6 || hour > 22;
    if (isNight) {
        worldState.tars.needs.energy = Math.max(0, worldState.tars.needs.energy - 0.00005 * dt * 60);
        worldState.tars.needs.comfort = Math.max(0, worldState.tars.needs.comfort - 0.00003 * dt * 60);
    }
    
    // Weather modifiers
    const weather = worldState.environment.weather.condition;
    if (weather === "thunderstorm" || weather === "heavy_rain") {
        worldState.tars.needs.curiosity = Math.min(1, worldState.tars.needs.curiosity + 0.0001 * dt * 60);
        worldState.tars.needs.comfort = Math.max(0, worldState.tars.needs.comfort - 0.0001 * dt * 60);
    }

    accumulateFatigue(dt);

    // Phase 7.4.5: Feed throttled need snapshot into the Observatory layer
    // (presentation telemetry only — does not alter autonomous behavior).
    _needSnapshotAccum += dt;
    if (_needSnapshotAccum >= 1 && typeof emitTARSEvent === "function") {
        _needSnapshotAccum = 0;
        emitTARSEvent("need.changed", {
            reason: "live_snapshot",
            currentNeeds: { ...worldState.tars.needs }
        }, "tars.autonomy");
    }
}

function accumulateFatigue(dt) {
    const activity = worldState.tars.activity;
    if (!activity || activity === "idle") {
        for (const key of Object.keys(worldState.tars.activityFatigue)) {
            worldState.tars.activityFatigue[key] = Math.max(0,
                worldState.tars.activityFatigue[key] - ACTIVITY_FATIGUE.RECOVERY_RATE * dt * 60);
        }
        return;
    }
    const current = worldState.tars.activityFatigue[activity] || 0;
    worldState.tars.activityFatigue[activity] = Math.min(1, current + ACTIVITY_FATIGUE.ACCRUAL_RATE * dt * 60);
}

function applyActivityEffects(dt) {
    const activity = worldState.tars.activity;
    const effects = ACTIVITY_EFFECTS[activity];
    if (!effects) return;

    const needs = worldState.tars.needs;
    const env = worldState.environment;
    const hour = new Date().getHours();
    const isNight = hour < 6 || hour > 22;
    const weather = env.weather.condition;

    // Base continuous effects
    for (const [need, rate] of Object.entries(effects.continuous)) {
        needs[need] = Math.max(0, Math.min(1, needs[need] + rate * dt * 60));
    }

    // Environmental modifiers
    if (effects.modifiers) {
        let mods = null;
        if (effects.modifiers.storm && (weather === "thunderstorm" || weather === "heavy_rain")) {
            mods = effects.modifiers.storm;
        } else if (effects.modifiers.rain && (weather === "rain" || weather === "drizzle")) {
            mods = effects.modifiers.rain;
        }
        if (effects.modifiers.night && isNight) {
            mods = { ...mods, ...effects.modifiers.night };
        }
        if (mods) {
            for (const [need, rate] of Object.entries(mods)) {
                needs[need] = Math.max(0, Math.min(1, needs[need] + rate * dt * 60));
            }
        }
    }
}

    let score = 0;
    const needs = worldState.tars.needs;
    const prefs = worldState.tars.preferences;
    const currentLoc = worldState.tars.location;
    const now = Date.now();
    
    // Need satisfaction potential — weighted by deficit magnitude
    const restoration = NEED_RESTORATION[location] || {};
    for (const [need, amount] of Object.entries(restoration)) {
        const deficit = 1 - needs[need];
        score += deficit * amount;
    }
    
    // Hunger pressure — high hunger draws toward desk (future food proxy)
    if (needs.hunger > 0.5 && location === "desk") {
        score += (needs.hunger - 0.5) * 40;
    }
    if (needs.hunger > 0.8) {
        score += 20; // Urgency bonus when starving — any location change is better
    }
    
    // Location preference — use correct key mapping
    const prefKey = LOCATION_PREF_KEYS[location] || location;
    score += (prefs.locations[prefKey] || 0.5) * 10;
    
    // Activity preference for likely activity at location
    const activityMap = {
        desk: "computer_work",
        "rack-a": "server_check",
        "window_right": "weather_observation",
        "window_left": "weather_observation",
        user: "user_interaction",
        ball: "play_with_ball"
    };
    const activity = activityMap[location];
    if (activity) score += (prefs.activities[activity] || 0.5) * 10;
    
    // Weather affinity — need-weighted: only interesting when curiosity is high
    if (location.includes("window")) {
        const weather = worldState.environment.weather.condition;
        const curiosityDeficit = 1 - needs.curiosity;
        score += curiosityDeficit * (prefs.conditions[weather] || 0.5) * 15;
    }
    
    // Routine bonus
    const hour = new Date().getHours();
    const currentWeather = worldState.environment.weather.condition;
    if (hour >= 6 && hour < 10 && location === "rack-a") score += prefs.routines.morning_check * 20;
    if (hour >= 18 && hour < 22 && location === "desk") score += prefs.routines.evening_wind_down * 15;
    if (currentWeather === "thunderstorm" && location.includes("window")) score += prefs.routines.storm_watch * 25;
    
    // Recency penalty — avoid returning to a location soon after leaving
    const lastLeft = worldState.tars.locationRecency[location];
    if (lastLeft) {
        const secondsSinceLeft = (now - lastLeft) / 1000;
        if (secondsSinceLeft < 45) {
            score -= (45 - secondsSinceLeft) * 1.0;
        }
    }
    
    // Distance penalty (prefer closer locations but not too strong)
    const currentPos = tarsEntityGroup.position;
    const targetPos = TARGET_POSITIONS[location];
    if (targetPos) {
        const dist = currentPos.distanceTo(targetPos);
        score -= dist * 1;
    }
    
    // Add some randomness for organic behavior
    score += (Math.random() - 0.5) * 6;
    
    return score;
}

// Phase 7.3: Select best activity based on need deficits, preferences, fatigue, recency, and curiosity
function selectBestActivity() {
    const needs = worldState.tars.needs;
    const prefs = worldState.tars.preferences;
    const now = Date.now();
    let bestScore = -Infinity;
    let bestActivity = "idle";
    const candidates = [];

    for (const [id, reg] of Object.entries(ACTIVITY_REGISTRY)) {
        let score = 0;
        let needScore = 0;
        let fatiguePenalty = 0;
        let recencyPenalty = 0;
        let weatherBonus = 0;
        let idleBaseline = 0;

        // Need satisfaction potential — how well does this activity address current deficits?
        for (const [need, amount] of Object.entries(reg.needsSatisfied)) {
            const deficit = 1 - needs[need];
            if (deficit > 0.05) {
                const contrib = deficit * amount * SCORING_WEIGHTS.NEED_WEIGHT;
                needScore += contrib;
                score += contrib;
            }
        }

        // Preference weighting
        const prefScore = (prefs.activities[id] || 0.5) * SCORING_WEIGHTS.PREFERENCE_WEIGHT;
        score += prefScore;

        // Fatigue penalty — repeated same activity gets diminishing returns
        const fatigue = worldState.tars.activityFatigue[id] || 0;
        fatiguePenalty = fatigue * SCORING_WEIGHTS.FATIGUE_WEIGHT;
        score -= fatiguePenalty;

        // Curiosity exploration term — encourages new experiences when curiosity is high
        const curiosityDeficit = 1 - needs.curiosity;
        const isMultiLocation = reg.location && reg.location.length > 1;
        const explorationBonus = isMultiLocation ? EXPLORATION.MULTI_LOCATION_BONUS : 1;
        const curiosityScore = curiosityDeficit * SCORING_WEIGHTS.CURIOSITY_EXPLORE_WEIGHT * explorationBonus;
        score += curiosityScore;

        // Environment bonus — weather events make observation more compelling
        const weather = worldState.environment.weather.condition;
        if (id === "weather_observation" && (weather === "thunderstorm" || weather === "heavy_rain")) {
            weatherBonus = EXPLORATION.ENVIRONMENT_BONUS;
            score += weatherBonus;
        }

        // Recency penalty — avoid repeating the same activity too soon
        const lastDone = worldState.tars.activityRecency[id];
        if (lastDone) {
            const secondsSince = (now - lastDone) / 1000;
            if (secondsSince < SCORING_WEIGHTS.RECENCY_WINDOW) {
                recencyPenalty = (SCORING_WEIGHTS.RECENCY_WINDOW - secondsSince) * SCORING_WEIGHTS.RECENCY_PENALTY_RATE;
                score -= recencyPenalty;
            }
        }

        // Idle gets a small baseline to prevent aimless switching when nothing urgent
        if (id === "idle") {
            idleBaseline = SCORING_WEIGHTS.IDLE_BASELINE;
            score += idleBaseline;
        }

        candidates.push({
            id,
            score,
            components: {
                need: +needScore.toFixed(4),
                preference: +prefScore.toFixed(4),
                fatigue: -(+fatiguePenalty.toFixed(4)),
                curiosity: +curiosityScore.toFixed(4),
                recency: -(+recencyPenalty.toFixed(4)),
                weather: +weatherBonus.toFixed(4),
                idle: +idleBaseline.toFixed(4)
            }
        });
        if (score > bestScore) {
            bestScore = score;
            bestActivity = id;
        }
    }

    // Sort descending for runner-up info
    candidates.sort((a, b) => b.score - a.score);
    const topAlternatives = candidates.slice(0, 5).map(c => ({ id: c.id, score: +c.score.toFixed(2), components: c.components }));
    const winnerComponents = candidates.find(c => c.id === bestActivity)?.components || null;

    if (AUTONOMY_TELEMETRY_DEBUG) {
        console.log(`[TARS Autonomy] Activity scores:`, candidates.map(c => `${c.id}:${c.score.toFixed(1)}`).join(" | "));
    }
    return { activity: bestActivity, scores: candidates, winnerComponents, topAlternatives };
}

// Phase 7.2: Select best location for a given activity using ACTIVITY_REGISTRY metadata
function selectBestLocation(activity) {
    const reg = ACTIVITY_REGISTRY[activity];
    if (!reg || !reg.location || reg.location.length === 0) {
        // Activity has no specific location (e.g., idle) — score all locations
        const all = LOCATIONS.map(loc => ({ location: loc, score: scoreLocation(loc) }));
        all.sort((a, b) => b.score - a.score);
        return all[0].location;
    }
    // Score only compatible locations
    let bestLoc = reg.location[0];
    let bestScore = -Infinity;
    for (const loc of reg.location) {
        const s = scoreLocation(loc);
        if (s > bestScore) {
            bestScore = s;
            bestLoc = loc;
        }
    }
    return bestLoc;
}

// Phase 7.3: Select a wander destination based on location novelty
function selectWanderDestination() {
    const candidates = Object.keys(TARGET_POSITIONS)
        .filter(key => key !== worldState.tars.location);
    if (candidates.length === 0) return null;
    const now = Date.now();
    let bestLoc = candidates[0];
    let bestScore = -Infinity;
    for (const loc of candidates) {
        let score = 0;
        const lastLeft = worldState.tars.locationRecency[loc];
        if (lastLeft) {
            const secondsSince = (now - lastLeft) / 1000;
            score += Math.min(secondsSince, 300);
        } else {
            score += 300;
        }
        const activityMap = {
            "window_left": "weather_observation",
            "window_right": "weather_observation",
            "desk": "computer_work",
            "rack-a": "server_check",
            "user": "user_interaction",
            "ball": "play_with_ball"
        };
        const act = activityMap[loc];
        if (act) {
            const lastAct = worldState.tars.activityRecency[act];
            if (lastAct) {
                const secondsSinceAct = (now - lastAct) / 1000;
                score += Math.min(secondsSinceAct, 300) * 0.5;
            } else {
                score += 150;
            }
        }
        score += Math.random() * 50;
        if (score > bestScore) {
            bestScore = score;
            bestLoc = loc;
        }
    }
    return bestLoc;
}

// Phase 7.3: Finalize current activity experience into buffer
function finalizeExperience() {
    const now = Date.now();
    const duration = now - worldState.tars.activityStartedAt;
    const entry = {
        activity: worldState.tars.activity,
        location: worldState.tars.location,
        duration,
        startedAt: worldState.tars.activityStartedAt,
        endedAt: now,
        fatigueAtEnd: worldState.tars.activityFatigue[worldState.tars.activity] || 0,
        needsSnapshot: { ...worldState.tars.needs }
    };
    worldState.tars.experienceBuffer.push(entry);
    if (worldState.tars.experienceBuffer.length > 100) {
        worldState.tars.experienceBuffer.shift();
    }
}

// Phase 7.2A: Intent mapping — deterministic activity → intent label
const ACTIVITY_INTENT_MAP = {
    computer_work: "work",
    server_check: "maintain",
    weather_observation: "observe",
    user_interaction: "socialize",
    gaming: "entertain",
    tv_watching: "rest",
    play_with_ball: "play",
    idle: "rest"
};

// Phase 7.2A: Generate deterministic decision reason from need state
function generateDecisionReason(activity, action, needs) {
    // Only consider needs that the activity actually addresses
    const reg = ACTIVITY_REGISTRY[activity];
    const satisfiedNeeds = reg ? Object.keys(reg.needsSatisfied) : [];

    const filteredDeficits = Object.entries(needs)
        .filter(([k]) => satisfiedNeeds.length === 0 || satisfiedNeeds.includes(k))
        .map(([k, v]) => ({ need: k, deficit: 1 - v }))
        .sort((a, b) => b.deficit - a.deficit);

    // Fallback to all deficits if the activity satisfies nothing specific
    const allDeficits = Object.entries(needs)
        .map(([k, v]) => ({ need: k, deficit: 1 - v }))
        .sort((a, b) => b.deficit - a.deficit);

    const deficits = filteredDeficits.length > 0 ? filteredDeficits : allDeficits;
    const topDeficit = deficits[0];
    const secondDeficit = deficits[1];

    if (action === "stay" || action === "continue" || action === "idle") {
        if (activity === "idle") return `low ${topDeficit.need} + no urgent task`;
        if (action === "continue") {
            const fatigue = (worldState.tars.activityFatigue[activity] || 0);
            if (fatigue < 0.15) return `comfortable continuing ${activity}`;
            return `continuing ${activity} despite ${(fatigue * 100).toFixed(0)}% fatigue`;
        }
        if (topDeficit.deficit < 0.15) return "no pressing need deficit";
        return `current activity addresses ${topDeficit.need} deficit`;
    }

    if (action === "complete") {
        const fatigue = (worldState.tars.activityFatigue[activity] || 0);
        return `${activity} fatigue reached ${(fatigue * 100).toFixed(0)}%, seeking change`;
    }

    if (action === "wander") {
        return `curiosity-driven exploration to ${worldState.tars.location}`;
    }

    if (action === "move" || action === "switch_activity") {
        const reasons = [];
        if (topDeficit.deficit > 0.3) reasons.push(`low ${topDeficit.need}`);
        if (secondDeficit && secondDeficit.deficit > 0.2) reasons.push(`declining ${secondDeficit.need}`);
        if (reasons.length === 0) reasons.push("exploration opportunity");
        return reasons.join(" + ");
    }

    return "autonomous decision";
}

// Phase 7.4.3: Record a decision to autonomy state and history with complete Decision Artifact
function recordAutonomyDecision(intent, selectedActivity, selectedLocation, decisionAction, decisionReason, decisionScore, extra = {}) {
    const now = Date.now();
    const needsSnapshot = { ...worldState.tars.needs };
    const fatigueSnapshot = { ...(worldState.tars.activityFatigue || {}) };
    const weatherSnapshot = { ...(worldState.environment?.weather || {}) };

    // Calculate confidence metric based on winner vs runner-up score separation
    const alternatives = extra.alternatives || [];
    const runnerUpScore = (alternatives && alternatives.length > 1) ? alternatives[1].score : (decisionScore - 10);
    const scoreGap = +(decisionScore - runnerUpScore).toFixed(2);
    // Confidence normalized float [0.0 - 1.0]: gap of 15+ points = 1.0 confidence
    const confidence = Math.min(1, Math.max(0, +(scoreGap / 15).toFixed(2)));

    const decision = {
        timestamp: new Date(now).toISOString(),
        timestampMs: now,
        intent,
        selectedActivity,
        selectedLocation,
        decisionAction,
        decisionReason,
        decisionScore: +decisionScore.toFixed(2),
        confidence,
        scoreGap,
        needsSnapshot,
        fatigueSnapshot,
        weatherSnapshot,
        ...extra
    };

    worldState.tars.autonomy = {
        ...decision,
        decidedAt: now
    };

    worldState.tars.autonomyHistory.push(decision);
    if (worldState.tars.autonomyHistory.length > 200) {
        worldState.tars.autonomyHistory.splice(0, worldState.tars.autonomyHistory.length - 200);
    }

    // Emit canonical decision.made event
    if (typeof emitTARSEvent === "function") {
        emitTARSEvent("decision.made", decision, "tars.autonomy");
    }

    if (AUTONOMY_TELEMETRY_DEBUG) {
        console.log(`[TARS AUTONOMY] intent=${intent} activity=${selectedActivity} location=${selectedLocation} action=${decisionAction} confidence=${(confidence * 100).toFixed(0)}% (gap=${scoreGap}) reason="${decisionReason}"`);
    }
}

// Phase 7.2: Autonomous decision engine — intent → activity → location → stay/move
function makeAutonomousDecision() {
    const now = Date.now();
    if (now - worldState.tars.lastDecisionTime < 2000 + Math.random() * 2000) return;
    if (worldState.tars.controlMode === "llm") return;

    const blockingFx = ["strobe_orange", "strobe_red", "strobe", "bounce", "expansive"];
    if (currentState.fx && blockingFx.includes(currentState.fx)) return;

    const currentActivity = ACTIVITY_REGISTRY[worldState.tars.activity];
    if (currentActivity && worldState.tars.activityEndsAt && now < worldState.tars.activityEndsAt) {
        return;
    }

    // Update decision timestamp so the cooldown gates the next cycle regardless of stay/move outcome
    worldState.tars.lastDecisionTime = now;

    const needs = worldState.tars.needs;
    const { activity: chosenActivity, scores: activityScores, winnerComponents, topAlternatives } = selectBestActivity();
    const chosenLocation = selectBestLocation(chosenActivity);
    const current = worldState.tars.location;
    const intent = ACTIVITY_INTENT_MAP[chosenActivity] || "explore";

    const currentActivityCompat = ACTIVITY_REGISTRY[worldState.tars.activity];
    const currentLocCompat = currentActivityCompat && currentActivityCompat.location.includes(current);
    const sameLocation = current === chosenLocation;
    const sameActivity = worldState.tars.activity === chosenActivity;

    const bestScore = activityScores.find(s => s.id === chosenActivity)?.score || 0;

    if (sameLocation && sameActivity) {
        const fatigue = worldState.tars.activityFatigue[chosenActivity] || 0;

        if (fatigue >= ACTIVITY_FATIGUE.COMPLETE_THRESHOLD) {
            finalizeExperience();
            const reason = generateDecisionReason(chosenActivity, "complete", needs);
            setTARSActivity("idle", current, reason, { fatigueAtDecision: fatigue });
            worldState.tars.continuationCount = 0;
            recordAutonomyDecision(intent, chosenActivity, chosenLocation, "complete", reason, bestScore, {
                fatigueAtDecision: fatigue,
                scoreComponents: winnerComponents,
                alternatives: topAlternatives
            });
            return;
        }

        const currentScore = activityScores.find(s => s.id === worldState.tars.activity)?.score || 0;
        const sortedScores = [...activityScores].sort((a, b) => b.score - a.score);
        const bestAlt = sortedScores.find(s => s.id !== worldState.tars.activity) || sortedScores[0];
        const continuationBias = Math.max(0, 5 - worldState.tars.continuationCount * 1.5);

        if (currentScore + continuationBias >= bestAlt.score) {
            const reg = ACTIVITY_REGISTRY[chosenActivity];
            const durSec = reg && reg.minDuration !== undefined
                ? reg.minDuration + Math.random() * (reg.maxDuration - reg.minDuration)
                : 15;
            worldState.tars.activityEndsAt = now + durSec * 1000;
            worldState.tars.continuationCount += 1;
            const reason = generateDecisionReason(chosenActivity, "continue", needs);
            recordAutonomyDecision(intent, chosenActivity, chosenLocation, "continue", reason, bestScore, {
                continuationCount: worldState.tars.continuationCount,
                fatigueAtDecision: fatigue,
                scoreComponents: winnerComponents,
                alternatives: topAlternatives
            });
            return;
        }

        finalizeExperience();
        worldState.tars.continuationCount = 0;
    }

    if (!sameLocation) {
        if (currentLocCompat && worldState.tars.activity === chosenActivity) {
            const reason = generateDecisionReason(chosenActivity, "stay", needs);
            recordAutonomyDecision(intent, chosenActivity, current, "stay", reason + " (location compatible)", bestScore, {
                scoreComponents: winnerComponents,
                alternatives: topAlternatives
            });
            return;
        }

        const currentLocScore = scoreLocation(current);
        const targetLocScore = scoreLocation(chosenLocation);
        if (targetLocScore <= currentLocScore + 5 && currentLocScore >= 30) {
            const action = chosenActivity === "idle" ? "idle" : "stay";
            const reason = generateDecisionReason(worldState.tars.activity, action, needs) + " (current location sufficient)";
            recordAutonomyDecision(intent, worldState.tars.activity, current, action, reason, currentLocScore, {
                scoreComponents: winnerComponents,
                alternatives: topAlternatives
            });
            return;
        }
    }

    // Wander check: when no activity wins decisively and curiosity is high
    const sortedScores = [...activityScores].sort((a, b) => b.score - a.score);
    const topScore = sortedScores[0]?.score || 0;
    const secondScore = sortedScores[1]?.score || 0;
    const scoreGap = topScore - secondScore;
    const hasCriticalNeed = Object.values(needs).some(v => (1 - v) > WANDER.PRIORITY_DEFICIT_THRESHOLD);
    const nowWander = Date.now();
    const wanderCooldownElapsed = (nowWander - (worldState.tars.lastWanderTime || 0)) > WANDER.COOLDOWN_SECONDS * 1000;

    if (!hasCriticalNeed
        && needs.curiosity < WANDER.CURIOSITY_THRESHOLD
        && scoreGap < WANDER.SCORE_GAP_THRESHOLD
        && wanderCooldownElapsed
        && worldState.tars.activity !== "idle") {
        const wanderTarget = selectWanderDestination();
        if (wanderTarget) {
            worldState.tars.lastWanderTime = nowWander;
            worldState.tars.currentGoal = wanderTarget;
            const wanderReason = generateDecisionReason("idle", "wander", needs);
            recordAutonomyDecision("explore", "idle", wanderTarget, "wander", wanderReason, 0, {
                wanderTarget,
                triggerReason: `curiosity=${(needs.curiosity * 100).toFixed(0)}% gap=${scoreGap.toFixed(1)}`,
                scoreComponents: winnerComponents,
                alternatives: topAlternatives
            });
            logStateChange("wander", { from: worldState.tars.location, to: wanderTarget });
            window.TARS.lookAt(wanderTarget, "wander", "idle");
            window.TARS.setEmotion("think", 0.4);
            return;
        }
    }

    worldState.tars.currentGoal = chosenLocation;

    const action = chosenActivity === "idle" ? "idle" : (sameLocation ? "switch_activity" : "move");
    const reason = generateDecisionReason(chosenActivity, action, needs);
    recordAutonomyDecision(intent, chosenActivity, chosenLocation, action, reason, bestScore, {
        scoreComponents: winnerComponents,
        alternatives: topAlternatives
    });

    logStateChange("autonomous_move", { from: current, to: chosenLocation, activity: chosenActivity });

    window.TARS.lookAt(chosenLocation, "autonomous_move", chosenActivity);

    const emotionMap = {
        computer_work: "think",
        server_check: "listen",
        weather_observation: "think",
        user_interaction: "listen",
        gaming: "chill",
        tv_watching: "chill",
        idle: "neutral"
    };
    if (emotionMap[chosenActivity]) {
        window.TARS.setEmotion(emotionMap[chosenActivity], 0.5 + Math.random() * 0.3);
    }
}
