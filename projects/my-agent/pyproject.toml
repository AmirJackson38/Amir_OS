[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myagent"
version = "1.1.0"
description = "Lightweight terminal AI client for OmniRoute"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Amir"}
]
dependencies = [
    "rich>=13.0",
    "httpx>=0.27",
]

[project.scripts]
myagent = "myagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
